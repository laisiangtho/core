/* ============================================================================
   READING TYPOGRAPHY AND SPACE
   Text size, line spacing and line length are the reader's, with sensible
   defaults and no small fixed menu of steps. Line length is measured in the
   text's own size, so larger type makes a wider column, not a cramped one.
   A pane with room to spare beside its column gets a study margin: the
   chapter's references, study note and the reader's notes move out of the
   way of the text and sit beside it, as in a printed study Bible. Each pane
   decides by its own width, so one wide pane, two parallel panes and a phone
   each get the arrangement that fits them.
   ========================================================================== */
const READING_DEFAULT={size:18,leading:1.66,measure:"comfortable",margin:"auto"};
const READING_LIMITS={size:[8,96],leading:[1,3]};
const MEASURE_EM={comfortable:34,wide:44,full:0};     // ≈ 70 and ≈ 90 characters a line
const MARGIN_MIN=260,MARGIN_MAX=360,MARGIN_GAP=52;
const clampNum=(v,[lo,hi],fallback)=>{const n=Number(v);return Number.isFinite(n)?Math.min(hi,Math.max(lo,n)):fallback;};
function reading(){
  const r=Object.assign({},READING_DEFAULT,appStore.prefs.reading||{});
  r.size=clampNum(r.size,READING_LIMITS.size,READING_DEFAULT.size);
  r.leading=clampNum(r.leading,READING_LIMITS.leading,READING_DEFAULT.leading);
  if(!(r.measure in MEASURE_EM))r.measure=READING_DEFAULT.measure;
  if(r.margin!=="auto"&&r.margin!=="off")r.margin="auto";
  return r;
}
/* Earlier builds kept the size on the session as state.readingSize; reading
   and writing it now goes to the preference, so old sessions carry over. */
Object.defineProperty(state,"readingSize",{
  get(){return reading().size;},
  set(v){appStore.prefs.reading=Object.assign({},appStore.prefs.reading,{size:clampNum(v,READING_LIMITS.size,18)});}
});
function applyReading(){
  const r=reading(),root=document.documentElement.style;
  root.setProperty("--reading-size",r.size+"px");
  root.setProperty("--lh-text",String(r.leading));
  root.setProperty("--measure-em",String(MEASURE_EM[r.measure]||0));
  document.body.dataset.measure=r.measure;
  const sb=$("#sbReading");
  if(sb){
    sb.lastElementChild.textContent=String(Math.round(r.size*10)/10);
    setLabel(sb,`${L("cmd.reading")}: ${L("cmd.textSize")} ${r.size}px`);
  }
}
/* Where the reader is, as a verse and how far through it — kept across any
   change that reflows the text. */
function anchorOf(scroll){
  if(!scroll)return null;
  const top=scroll.scrollTop+12;
  const first=$(".verse",scroll);
  /* Above the first verse — the chapter head — the pixel position is the place. */
  if(!first||scroll.scrollTop<first.offsetTop-12)return {top:scroll.scrollTop};
  const v=$$(".verse",scroll).find(n=>n.offsetTop+n.offsetHeight>top);
  return v?{n:v.dataset.verse,frac:Math.max(0,Math.min(1,(top-v.offsetTop)/Math.max(1,v.offsetHeight)))}:null;
}
function restoreAnchor(scroll,a){
  if(!scroll||!a)return;
  if(a.top!=null){scroll.scrollTop=a.top;return;}
  const v=verseNode(a.n,scroll);
  if(v)scroll.scrollTop=Math.max(0,v.offsetTop+a.frac*v.offsetHeight-12);
}
function setReading(patch){
  const lead=syncLeader&&syncLeader.isConnected?syncLeader:$('.leaf[data-role="primary"] .leaf-scroll');
  const keep=anchorOf(lead);
  appStore.prefs.reading=Object.assign({},reading(),patch);
  saveStore();
  applyReading();
  fitLeaves();alignRows();
  restoreAnchor(lead,keep);
  if(lead&&state.syncScroll)followLeader(lead);
  paintReadingPanel();
}
const nudgeSize=d=>setReading({size:Math.round((reading().size+d)*2)/2});

/* Decides, per pane, whether its study sections sit beside the text. */
function fitLeaves(){
  const r=reading();
  $$(".leaf[data-translation]").forEach(leaf=>{
    const note=$(".note",leaf),col=note&&$(".study-col",note),scroll=$(".leaf-scroll",leaf);
    if(!note)return;
    if(scroll)note.style.setProperty("--pane-h",scroll.clientHeight+"px");
    const measure=MEASURE_EM[r.measure]*r.size;
    const pad=88;                                   // the note's own side padding
    const room=leaf.clientWidth-pad;
    const wide=!!col&&col.childElementCount>0&&r.margin==="auto"&&measure>0&&
      room>=measure+MARGIN_GAP+MARGIN_MIN;
    note.classList.toggle("has-margin",wide);
  });
  /* When the page shows its study note in the margin, the Inspector need not
     show it again. */
  const primary=$('#panes .leaf[data-role="primary"] .note');
  document.body.classList.toggle("study-in-margin",!!primary&&primary.classList.contains("has-margin"));
}

/* ---- the reading panel: one place for all of it ---------------------------- */
function openReadingPanel(anchor){
  const pop=$("#readPanel");
  if(!pop.hidden){closeReadingPanel();return;}
  pop.hidden=false;
  paintReadingPanel();
  const a=anchor&&anchor.offsetParent?anchor:null;
  const w=pop.offsetWidth,h=pop.offsetHeight;
  if(a){
    const r=a.getBoundingClientRect();
    const left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8));
    pop.style.left=left+"px";pop.style.top=Math.max(8,r.top-h-10)+"px";
    pop.style.setProperty("--arrow-x",Math.max(14,Math.min(w-14,r.left+r.width/2-left))+"px");
    pop.classList.add("is-above");pop.classList.remove("no-arrow");
  }else{
    pop.style.left=Math.max(8,(innerWidth-w)/2)+"px";pop.style.top=Math.max(8,innerHeight-h-96)+"px";
    pop.classList.add("no-arrow");
  }
  pop.focus({preventScroll:true});      // into the panel, without lighting up a control
}
function closeReadingPanel(){const pop=$("#readPanel");if(pop)pop.hidden=true;}
function paintReadingPanel(){
  const pop=$("#readPanel");
  if(!pop||pop.hidden)return;
  const r=reading();
  const sz=$('[data-rp="size"]',pop),szn=$('[data-rp="sizeNum"]',pop);
  /* The slider covers everyday sizes; the number goes anywhere, and the
     slider stretches to meet it. */
  sz.max=String(Math.max(40,Math.ceil(r.size)));sz.min=String(Math.min(12,Math.floor(r.size)));
  sz.value=String(r.size);
  if(document.activeElement!==szn)szn.value=String(r.size);
  const ld=$('[data-rp="leading"]',pop),ldn=$('[data-rp="leadingNum"]',pop);
  ld.value=String(r.leading);
  if(document.activeElement!==ldn)ldn.value=r.leading.toFixed(2);
  $$("[data-measure]",pop).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.measure===r.measure)));
  $$("[data-margin]",pop).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.margin===r.margin)));
}
function wireReadingPanel(){
  const pop=$("#readPanel");
  pop.innerHTML=`
    <div class="rp-row"><label class="rp-l" for="rpSize">${esc(L("cmd.textSize"))}</label>
      <div class="rp-ctl">
        <button class="rp-step" data-step="-1" aria-label="${esc(L("cmd.textSmaller"))}" title="${esc(withKey(L("cmd.textSmaller"),KEYS.textSmaller))}"><span class="rp-a small">A</span></button>
        <input type="range" id="rpSize" data-rp="size" min="12" max="40" step="0.5">
        <button class="rp-step" data-step="1" aria-label="${esc(L("cmd.textBigger"))}" title="${esc(withKey(L("cmd.textBigger"),KEYS.textBigger))}"><span class="rp-a">A</span></button>
        <span class="rp-num"><input type="number" data-rp="sizeNum" min="${READING_LIMITS.size[0]}" max="${READING_LIMITS.size[1]}" step="0.5" aria-label="${esc(L("cmd.textSize"))}"><i>px</i></span>
      </div></div>
    <div class="rp-row"><label class="rp-l" for="rpLeading">${esc(L("cmd.leading"))}</label>
      <div class="rp-ctl">
        <span class="rp-glyph">${icon("lay-para")}</span>
        <input type="range" id="rpLeading" data-rp="leading" min="1.2" max="2.4" step="0.02">
        <span class="rp-num"><input type="number" data-rp="leadingNum" min="${READING_LIMITS.leading[0]}" max="${READING_LIMITS.leading[1]}" step="0.05" aria-label="${esc(L("cmd.leading"))}"><i>×</i></span>
      </div></div>
    <div class="rp-row"><span class="rp-l">${esc(L("cmd.measure"))}</span>
      <div class="rp-seg" role="group" aria-label="${esc(L("cmd.measure"))}">
        ${["comfortable","wide","full"].map(m=>`<button data-measure="${m}">${esc(L("val."+m))}</button>`).join("")}
      </div></div>
    <div class="rp-row"><span class="rp-l">${esc(L("cmd.margin"))}</span>
      <div class="rp-seg" role="group" aria-label="${esc(L("cmd.margin"))}">
        ${["auto","off"].map(m=>`<button data-margin="${m}">${esc(L("val."+m))}</button>`).join("")}
      </div></div>
    <div class="rp-foot"><span>${kbd(KEYS.textBigger)} ${kbd(KEYS.textSmaller)} ${kbd(KEYS.textReset)}</span>
      <button class="rp-reset" data-reset>${esc(L("cmd.reset"))}</button></div>`;
  pop.setAttribute("aria-label",L("cmd.reading"));
  pop.addEventListener("input",e=>{
    const k=e.target.dataset.rp;
    if(!k)return;
    const v=Number(e.target.value);
    if(!Number.isFinite(v)||e.target.value==="")return;
    if(k==="size"||k==="sizeNum")setReading({size:clampNum(v,READING_LIMITS.size,18)});
    else setReading({leading:clampNum(v,READING_LIMITS.leading,1.66)});
  });
  /* A typed value settles into range when the field is left. */
  pop.addEventListener("change",e=>{if(e.target.type==="number")paintReadingPanel();});
  pop.addEventListener("focusout",e=>{if(e.target.type==="number"){e.target.value="";paintReadingPanel();}});
  pop.addEventListener("click",e=>{
    const s=e.target.closest("[data-step]");
    if(s){nudgeSize(Number(s.dataset.step));return;}
    const m=e.target.closest("[data-measure]");
    if(m){setReading({measure:m.dataset.measure});return;}
    const g=e.target.closest("[data-margin]");
    if(g){setReading({margin:g.dataset.margin});return;}
    if(e.target.closest("[data-reset]"))setReading(Object.assign({},READING_DEFAULT));
  });
  pop.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();closeReadingPanel();$("#sbReading").focus();}});
  document.addEventListener("pointerdown",e=>{
    if(pop.hidden||pop.contains(e.target)||e.target.closest("#sbReading"))return;
    closeReadingPanel();
  },true);
  $("#sbReading").onclick=e=>openReadingPanel(e.currentTarget);
  /* Ctrl and the wheel (a trackpad pinch arrives the same way) resize the text
     over the reading surface, not the whole page. */
  let acc=0;
  ["#panes","#floats"].forEach(q=>$(q).addEventListener("wheel",e=>{
    if(!e.ctrlKey||!e.target.closest(".leaf-scroll"))return;
    e.preventDefault();
    acc+=e.deltaY;
    if(Math.abs(acc)<24)return;
    nudgeSize(acc<0?1:-1);acc=0;
  },{passive:false}));
}

/* ============================================================================
   11f. READING PLAN AND VERSE OF THE DAY — the "plan" sidebar module
   Plans are generated from the canon, not stored as lists: each is a range of
   chapters spread evenly over a number of days. Progress is the set of
   chapters read, so reading ahead or catching up needs no bookkeeping.
   ========================================================================== */
const canonKeys=keep=>BIBLE_CANON.filter(keep)
  .flatMap(b=>Array.from({length:b.chapters},(_,i)=>chapterKey(b.name,i+1)));
const PLANS=[
  {id:"canon365",days:365,keep:()=>true},
  {id:"nt90",days:90,keep:b=>b.testament==="NT"},
  {id:"gospels40",days:40,keep:b=>["Matthew","Mark","Luke","John"].includes(b.name)},
  {id:"psalms30",days:30,keep:b=>b.name==="Psalms"}
];
const planKeyCache=new Map();
const planKeys=def=>{
  if(!planKeyCache.has(def.id))planKeyCache.set(def.id,canonKeys(def.keep));
  return planKeyCache.get(def.id);
};
/* Calendar days in the reader's own time zone: a day turns over at their
   midnight, not UTC's. */
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayNumber=iso=>{const [y,m,d]=String(iso).split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};

function planState(){
  const p=appStore.plan;
  if(!p||typeof p!=="object")return null;
  const def=PLANS.find(x=>x.id===p.id);
  if(!def||!/^\d{4}-\d{2}-\d{2}$/.test(p.start||""))return null;
  const keys=planKeys(def),n=keys.length;
  const day=Math.max(0,dayNumber(localDate())-dayNumber(p.start));     // 0-based
  const cut=d=>Math.floor(Math.min(d,def.days)*n/def.days);
  const today=day<def.days?keys.slice(cut(day),cut(day+1)):[];
  const read=p.read||(p.read={});
  const behind=keys.slice(0,cut(day)).filter(k=>!read[k]);
  const done=keys.filter(k=>read[k]).length;
  return {def,keys,day,today,behind,read,done,total:n,finished:done===n};
}
function startPlan(id){
  appStore.plan={id,start:localDate(),read:{}};
  saveStore();renderPlan();
}
function setRead(key,on){
  const st=planState();
  if(!st||!st.keys.includes(key))return;
  if(on)st.read[key]=Date.now();else delete st.read[key];
  saveStore();renderPlan();
}
/* Called when a reader reaches the end of a chapter. Only chapters in the
   active plan count, and only once. */
function planReached(key){
  const st=planState();
  if(!st||st.read[key]||!st.keys.includes(key))return;
  setRead(key,true);
  toast(L("msg.read",{key:displayKey(key)}));
}

/* One verse a day, the same for everyone on the same date. */
const DAILY=[
  ["John 3",16],["Psalms 23",1],["Romans 8",28],["Philippians 4",13],["Isaiah 53",5],
  ["Matthew 5",9],["1 Corinthians 13",4],["Genesis 1",1],["John 1",1],["Psalms 1",1],
  ["Proverbs 3",5],["Jeremiah 29",11],["Joshua 1",9],["Micah 6",8],["Lamentations 3",22],
  ["Isaiah 40",31],["Matthew 11",28],["John 14",6],["Romans 12",2],["Galatians 5",22],
  ["Ephesians 2",8],["Hebrews 11",1],["James 1",5],["1 John 4",19],["Psalms 46",1],
  ["Psalms 119",105],["2 Timothy 1",7],["Colossians 3",23],["Revelation 21",4],
  ["Philippians 4",6],["Romans 5",8]
];
const dailyVerse=()=>{const [key,verse]=DAILY[dayNumber(localDate())%DAILY.length];return {key,verse};};

function renderPlan(){
  const host=$("#planPane");
  if(!host)return;
  const tr=TRANSLATIONS.find(t=>t.id===state.translation)||{};
  const d=dailyVerse(),text=verseText(d.key,d.verse);
  const open=activeKey();
  const chip=k=>{
    const read=!!(appStore.plan&&appStore.plan.read&&appStore.plan.read[k]);
    const name=L(read?"cmd.markUnread":"cmd.markRead");
    return `<span class="plan-ch${read?" is-read":""}${k===open?" is-open":""}">`+
      `<button class="pc-open" data-open="${esc(k)}">${esc(displayKey(k))}</button>`+
      `<button class="pc-tick" data-tick="${esc(k)}" aria-pressed="${read}" title="${esc(name)}" aria-label="${esc(name)}">${icon("check")}</button></span>`;
  };
  let html=`<div class="card plan-daily">
      <div class="plan-label">${esc(L("plan.daily"))}</div>
      ${text?`<p class="pd-text" lang="${esc(tr.lang||"")}" dir="${esc(tr.dir||"auto")}">${esc(text)}</p>`:""}
      <button class="pd-ref" data-open="${esc(d.key)}" data-verse="${d.verse}">${esc(refOf(d.key,d.verse))}${icon("chev")}</button>
    </div>`;
  const last=lastPosition();
  if(last)html+=`<button class="plan-continue" data-open="${esc(last.key)}" data-verse="${last.verse}">
      ${icon("book-open")}<span>${esc(L("plan.continue"))}</span><b>${esc(refOf(last.key,last.verse))}</b></button>`;
  const st=planState();
  if(!st){
    html+=`<div class="plan-label plan-gap">${esc(L("plan.choose"))}</div>`+PLANS.map(p=>
      `<button class="plan-pick" data-start="${p.id}"><b>${esc(L("plan."+p.id))}</b>`+
      `<span>${esc(L("lbl.chapters",{n:planKeys(p).length}))} · ${esc(L("lbl.days",{n:p.days}))}</span></button>`).join("");
  }else{
    const pct=Math.floor(st.done/st.total*100);
    html+=`<div class="card plan-card">
      <div class="plan-top"><b>${esc(L("plan."+st.def.id))}</b>
        <span>${esc(L("plan.day",{n:Math.min(st.day+1,st.def.days),total:st.def.days}))}</span></div>
      <div class="plan-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <div class="plan-meta">${esc(L("lbl.progress",{pct,read:st.done,total:st.total}))}</div>`;
    if(st.finished)html+=`<p class="plan-note">${esc(L("plan.finished"))}</p>`;
    else{
      if(st.today.length){
        html+=`<div class="plan-label">${esc(L("plan.today"))}</div><div class="plan-chips">${st.today.map(chip).join("")}</div>`;
        if(st.today.every(k=>st.read[k]))html+=`<p class="plan-note">${esc(L("plan.done"))}</p>`;
      }
      if(st.behind.length){
        html+=`<div class="plan-label is-behind">${esc(L("plan.behind",{n:st.behind.length}))}</div>`+
          `<div class="plan-chips">${st.behind.slice(0,12).map(chip).join("")}</div>`;
      }
    }
    html+=`<button class="plan-stop" data-stop>${esc(L("plan.stop"))}</button></div>`;
  }
  host.innerHTML=html;
}
function mountPlan(){
  const host=$("#planPane");
  host.addEventListener("click",e=>{
    const t=e.target.closest("[data-tick]");
    if(t){setRead(t.dataset.tick,t.getAttribute("aria-pressed")!=="true");return;}
    const o=e.target.closest("[data-open]");
    if(o){
      const v=+o.dataset.verse||0;
      openChapter(o.dataset.open,v>1?{verse:v}:{});
      if(isTouchLayout())document.body.classList.remove("drawer-l","drawer-r","has-drawer");
      return;
    }
    const s=e.target.closest("[data-start]");
    if(s){startPlan(s.dataset.start);return;}
    if(e.target.closest("[data-stop]")&&confirm(L("ask.stopPlan"))){
      appStore.plan=null;saveStore();renderPlan();
    }
  });
  /* The day turns over while the app is open or asleep in a background tab. */
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderPlan();});
  renderPlan();
}

/* ============================================================================
   12. INK LAYER — freehand annotation over the reading surface
   ========================================================================== */
const ink={color:"#e9973f",size:2.5,erase:false};
function mountInk(){
  const scroll=$('.leaf[data-role="primary"] .leaf-scroll');
  const key=activeKey();
  if(!scroll||!key)return;
  const note=$(".note",scroll)||scroll.firstElementChild;
  if(!note){fail(L("err.annotate"));state.ink=false;return;}
  const canvas=el("canvas","ink-layer");
  const w=scroll.clientWidth,h=Math.max(scroll.scrollHeight,scroll.clientHeight);
  canvas.width=w;canvas.height=h;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  canvas.style.position="absolute";canvas.style.left="0";canvas.style.top="0";
  scroll.style.position="relative";
  scroll.appendChild(canvas);

  const bar=el("div","ink-bar");
  bar.innerHTML=CARD_COLORS.map(c=>`<button data-color="${c}" data-l="cmd.inkColour"><span class="swatch" style="background:${c}"></span></button>`).join("")+
    `<button data-tool="erase" data-l="cmd.erase">${icon("eraser")}</button>
     <button data-tool="undo" data-l="cmd.undo">${icon("undo")}</button>
     <button data-tool="clear" data-l="cmd.clear">${icon("trash")}</button>
     <button data-tool="done" data-l="cmd.done">${icon("check")}</button>`;
  applyStrings(bar);
  scroll.parentElement.appendChild(bar);

  const ctx=canvas.getContext("2d");
  const strokes=appStore.drawings[key]||(appStore.drawings[key]=[]);
  const redraw=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    strokes.forEach(s=>{
      const k=canvas.width/(s.w||canvas.width);
      ctx.strokeStyle=s.color;ctx.lineWidth=s.size*k;ctx.lineCap="round";ctx.lineJoin="round";
      ctx.beginPath();
      s.pts.forEach((p,i)=>i?ctx.lineTo(p[0]*k,p[1]*k):ctx.moveTo(p[0]*k,p[1]*k));
      ctx.stroke();
    });
  };
  redraw();
  let cur=null;
  canvas.addEventListener("pointerdown",e=>{
    canvas.setPointerCapture(e.pointerId);
    const r=canvas.getBoundingClientRect();
    const p=[e.clientX-r.left,e.clientY-r.top];
    if(ink.erase){
      const i=strokes.findIndex(s=>s.pts.some(q=>Math.hypot(q[0]*(canvas.width/(s.w||canvas.width))-p[0],q[1]*(canvas.width/(s.w||canvas.width))-p[1])<12));
      if(i>=0){strokes.splice(i,1);redraw();saveStore();}
      return;
    }
    cur={color:ink.color,size:ink.size,w:canvas.width,pts:[p]};
    strokes.push(cur);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!cur)return;
    const r=canvas.getBoundingClientRect();
    cur.pts.push([e.clientX-r.left,e.clientY-r.top]);
    redraw();
  });
  const end=()=>{if(cur){cur=null;saveStore();}};
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",end);

  bar.onclick=e=>{
    const c=e.target.closest("[data-color]");
    if(c){ink.color=c.dataset.color;ink.erase=false;paintBar();return;}
    const t=e.target.closest("[data-tool]");
    if(!t)return;
    const tool=t.dataset.tool;
    if(tool==="erase"){ink.erase=!ink.erase;paintBar();}
    else if(tool==="undo"){strokes.pop();redraw();saveStore();}
    else if(tool==="clear"){strokes.length=0;redraw();saveStore();toast(L("msg.cleared",{what:L("lbl.ink")}));}
    else if(tool==="done"){RIBBON.toggleInk();}
  };
  function paintBar(){
    $$("[data-color]",bar).forEach(b=>b.classList.toggle("is-on",!ink.erase&&b.dataset.color===ink.color));
    $('[data-tool="erase"]',bar).classList.toggle("is-on",ink.erase);
  }
  paintBar();
}

/* ============================================================================
   12b. TEXT — the language, direction and voice of each translation
   Nothing here is assumed. Reading aloud is offered only when this device has
   a voice for the translation's language; right to left is offered only when
   the text is written in a right-to-left script or the registry says so.
   ========================================================================== */
const trMeta=id=>TRANSLATIONS.find(t=>t.id===id)||{id,name:id};
const langName=code=>{
  if(!code)return "";
  try{return new Intl.DisplayNames([LOCALE],{type:"language"}).of(code)||code;}catch(e){return code;}
};
/* Strong right-to-left letters: Hebrew, Arabic, Syriac, Thaana, N'Ko and the
   Arabic presentation forms. */
const RTL_LETTER=/[֐-ࣿיִ-﷿ﹰ-ﻼ]/;
function looksRTL(text){
  let rtl=0,all=0;
  for(const ch of String(text).slice(0,800)){
    if(!/\p{L}/u.test(ch))continue;
    all++;if(RTL_LETTER.test(ch))rtl++;
  }
  return all>0&&rtl/all>.5;
}
/* Decided once per translation, from its first loaded chapter. */
const scriptIsRTL=new Map();
function writtenRTL(id){
  if(scriptIsRTL.has(id))return scriptIsRTL.get(id);
  const t=bibleDataStore[id],k=t&&Object.keys(t)[0];
  if(!k)return false;                          // not loaded yet: ask again later
  const v=looksRTL(Object.values(t[k]).slice(0,4).join(" "));
  scriptIsRTL.set(id,v);
  return v;
}
const registryDir=id=>trMeta(id).dir==="rtl"?"rtl":"ltr";
function textDir(id){
  const pref=(appStore.prefs.textDir||{})[id];
  return pref==="rtl"||pref==="ltr"?pref:registryDir(id);
}
/* The switch appears only where it can matter. */
const dirChoosable=id=>textDir(id)==="rtl"||registryDir(id)==="rtl"||writtenRTL(id);
function setTextDir(id,dir){
  const all=appStore.prefs.textDir||(appStore.prefs.textDir={});
  if(dir===registryDir(id))delete all[id];else all[id]=dir;
  saveStore();renderAll();
  toast(L("msg.state",{what:`${id} · ${L("cmd.textDir")}`,value:L(dir==="rtl"?"val.rtl":"val.ltr")}));
}

/* Voices arrive asynchronously and differ per device and browser. A voice is
   matched on the primary language subtag: "ar" serves ar-SA and ar-EG. */
let voiceList=[];
function loadVoices(){
  try{voiceList=speechAvailable()?(speechSynthesis.getVoices()||[]):[];}catch(e){voiceList=[];}
}
const baseLang=code=>String(code||"").toLowerCase().replace("_","-").split("-")[0];
const voicesFor=id=>{
  const b=baseLang(trMeta(id).lang);
  return b?voiceList.filter(v=>baseLang(v.lang)===b):[];
};
function voiceFor(id){
  const list=voicesFor(id);
  if(!list.length)return null;
  const want=(appStore.prefs.voices||{})[baseLang(trMeta(id).lang)];
  return list.find(v=>v.voiceURI===want)||list.find(v=>v.default)||list.find(v=>v.localService)||list[0];
}
const canSpeak=id=>speechAvailable()&&!!voiceFor(id);
/* Why reading aloud is unavailable, in words; empty when it is available. */
function speechBlocker(id){
  if(!speechAvailable())return L("err.noSpeech");
  const lang=trMeta(id).lang;
  if(!lang)return L("hint.noLang",{tr:id});
  if(!voiceFor(id))return L("hint.noVoice",{lang:langName(lang)});
  return "";
}
function wireVoices(){
  if(!speechAvailable())return;
  loadVoices();
  const refresh=()=>{
    loadVoices();renderSpeechUI();
    if(speech.mode==="idle"&&activeTab())renderAll();   // verse tools gain or lose "read"
  };
  try{speechSynthesis.addEventListener("voiceschanged",refresh);}
  catch(e){speechSynthesis.onvoiceschanged=refresh;}
}
function openVoicePicker(){
  const id=state.translation,list=voicesFor(id);
  if(!list.length){fail(speechBlocker(id)||L("err.noSpeech"));return;}
  const cur=voiceFor(id);
  openModal({
    placeholder:L("cmd.voice"),
    hint:langName(trMeta(id).lang),
    items:list.map(v=>({title:v.name,sub:`${v.lang}${v.localService?"":" · "+L("val.online")}`,
      icon:v===cur?"check":"audio",v})),
    onPick:it=>{
      const all=appStore.prefs.voices||(appStore.prefs.voices={});
      all[baseLang(trMeta(id).lang)]=it.v.voiceURI;
      saveStore();renderSpeechUI();
      toast(L("msg.state",{what:L("cmd.voice"),value:it.v.name}));
    }
  });
  $("#modalInput").oninput=null;
}
/* The verse tools a surface offers, given what its translation can do. */
const verseActions=tr=>VERSE_ACTIONS.filter(a=>a.act!=="speak"||canSpeak(tr));

/* Word counts use the language's own word breaks: Burmese and Thai do not
   separate words with spaces. */
const segmenters=new Map();
function wordCount(text,lang){
  const k=baseLang(lang)||"und";
  if(!segmenters.has(k)){
    let seg=null;
    try{seg=new Intl.Segmenter(k==="und"?undefined:k,{granularity:"word"});}catch(e){}
    segmenters.set(k,seg);
  }
  const seg=segmenters.get(k);
  if(!seg)return String(text).split(/\s+/).filter(Boolean).length;
  let n=0;for(const s of seg.segment(text))if(s.isWordLike)n++;
  return n;
}
/* Fonts that carry each script, ahead of the reading face's fallbacks. */
const SCRIPT_FONTS={
  my:'"Myanmar Text",Georgia,serif',
  ar:'"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Arabic Typesetting",serif'
};
const scriptFont=lang=>SCRIPT_FONTS[baseLang(lang)]||'Georgia,"Times New Roman",serif';

/* ============================================================================
   13. SPEECH — one controller owns the state
   Every entry point (ribbon button, verse button, command palette) drives the
   same object, so the ribbon control always reflects what is actually playing.
   ========================================================================== */
const RING=100.5;                       // 2 * pi * r, r = 16 in the 36 viewBox
const speech={mode:"idle",key:null,nums:[],i:0,frac:0};

const speechAvailable=()=>"speechSynthesis" in window;
function speechProgress(){
  if(!speech.nums.length)return 0;
  return Math.min(1,(speech.i+speech.frac)/speech.nums.length);
}
function renderSpeechUI(){
  const btn=$("#btnSpeech");
  if(!btn)return;
  btn.dataset.mode=speech.mode;
  const fill=$(".ring-fill",btn);
  if(fill)fill.style.strokeDashoffset=String(RING*(1-speechProgress()));
  const use=$(".glyph use",btn);
  if(use)use.setAttribute("href",
    speech.mode==="playing"?"#i-pause":speech.mode==="paused"?"#i-play":"#i-audio");
  const pct=Math.round(speechProgress()*100);
  const name=L(speech.mode==="playing"?"cmd.pause":speech.mode==="paused"?"cmd.resume":"cmd.read");
  /* Idle and unable to speak this translation: say why, and do nothing when
     pressed. aria-disabled keeps the tooltip reachable, which disabled would not. */
  const why=speech.mode==="idle"?speechBlocker(state.translation):"";
  btn.classList.toggle("is-unavailable",!!why);
  btn.setAttribute("aria-disabled",String(!!why));
  btn.setAttribute("aria-label",why?`${name} — ${why}`:name);
  btn.dataset.tip=why?`${name} · ${why}`:speech.mode==="idle"?name:`${name} · ${L("hint.speechAt",{key:displayKey(speech.key),pct})}`;
  btn.title=speech.mode==="idle"?"":L("hint.speech");
}
function markSpoken(n){
  $$(".verse.is-hit").forEach(v=>v.classList.remove("is-hit"));
  if(n==null)return;
  const node=verseNode(n,$(`#panes .leaf[data-translation="${speech.tr}"] .leaf-scroll`)||$('.leaf[data-role="primary"] .leaf-scroll')||document);
  if(!node)return;
  node.classList.add("is-hit");
  /* Scrolling must never break the utterance chain that calls this. */
  if(typeof node.scrollIntoView==="function"){
    try{node.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}
  }
}
function speechStart(key,fromVerse,tr=state.translation){
  const why=speechBlocker(tr);
  if(why){fail(why);return;}
  const vs=chapterVerses(key,tr);
  if(!vs){fail(L("err.noText",{tr,ref:key}));return;}
  const nums=Object.keys(vs).map(Number).sort((a,b)=>a-b);
  const at=fromVerse?nums.indexOf(fromVerse):0;
  speechSynthesis.cancel();
  Object.assign(speech,{mode:"playing",key,tr,nums,i:at<0?0:at,frac:0});
  speakCurrent();
  renderSpeechUI();
}
function speakCurrent(){
  if(speech.mode!=="playing")return;
  if(speech.i>=speech.nums.length){speechStop();toast(L("msg.ended"));return;}
  const n=speech.nums[speech.i];
  markSpoken(n);
  const text=verseText(speech.key,n,speech.tr);
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.95;
  u.lang=trMeta(speech.tr).lang||"";
  const voice=voiceFor(speech.tr);
  /* lang alone lets the engine choose; the voice refines it when accepted. */
  if(voice){try{u.voice=voice;}catch(e){console.warn("[app] voice rejected; using the language default",e);}}
  u.onboundary=e=>{
    if(text.length&&typeof e.charIndex==="number"){
      speech.frac=Math.min(1,e.charIndex/text.length);
      renderSpeechUI();
    }
  };
  u.onend=()=>{
    if(speech.mode!=="playing")return;
    speech.i++;speech.frac=0;renderSpeechUI();speakCurrent();
  };
  u.onerror=()=>{speechStop();fail(L("err.speech"));};
  speechSynthesis.speak(u);
}
function speechPause(){
  if(speech.mode!=="playing")return;
  speech.mode="paused";speechSynthesis.pause();renderSpeechUI();
}
function speechResume(){
  if(speech.mode!=="paused")return;
  speech.mode="playing";speechSynthesis.resume();renderSpeechUI();
}
function speechStop(){
  Object.assign(speech,{mode:"idle",key:null,nums:[],i:0,frac:0});
  if(speechAvailable())speechSynthesis.cancel();
  markSpoken(null);renderSpeechUI();
}
function toggleSpeech(){
  if(speech.mode==="playing")return speechPause();
  if(speech.mode==="paused")return speechResume();
  const why=speechBlocker(state.translation);
  if(why){fail(why);return;}
  const key=activeKey();
  if(!key){fail(L("err.needChapter"));return;}
  speechStart(key);
}
/* A verse button reads from that verse onward, so the ring still means
   "progress through this chapter". */
function speakVerse(key,verse,tr){speechStart(key,verse,tr);}

/* ============================================================================
   14. VERSE CARD EXPORT
   ========================================================================== */
function exportVerseCard(key,verse,tr=state.translation){
  const text=verseText(key,verse,tr);
  if(!text){fail(L("err.noText",{tr,ref:`${key}:${verse}`}));return;}
  const W=1080,H=1350;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  const tone=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,tone("--export-from"));g.addColorStop(1,tone("--export-to"));
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle=tone("--accent-line");x.lineWidth=2;x.strokeRect(48,48,W-96,H-96);
  /* The card follows the text: its script's fonts, its direction, and its own
     word breaks, since Burmese does not put spaces between words. */
  const meta=trMeta(tr),rtl=textDir(tr)==="rtl";
  const M=96,edge=rtl?W-M:M;
  x.direction=rtl?"rtl":"ltr";x.textAlign=rtl?"right":"left";
  x.fillStyle=tone("--accent");x.fillRect(rtl?W-M-70:M,150,70,4);

  x.fillStyle=tone("--text-normal");
  const size=text.length>240?38:text.length>140?46:54;
  x.font=`${size}px ${scriptFont(meta.lang)}`;
  const max=W-M*2;
  let parts;
  try{parts=[...new Intl.Segmenter(meta.lang||undefined,{granularity:"word"}).segment(text)].map(p=>p.segment);}
  catch(e){parts=text.split(/(\s+)/);}
  const lines=[];let line="";
  for(const p of parts){
    const t=line+p;
    if(x.measureText(t.trim()).width>max&&line.trim()){lines.push(line.trim());line=p.trimStart();}else line=t;
  }
  if(line.trim())lines.push(line.trim());
  const lh=size*(baseLang(meta.lang)==="my"?1.9:1.5);
  let y=Math.max(260,(H-lines.length*lh)/2-40);
  lines.forEach(l=>{x.fillText(l,edge,y);y+=lh;});

  x.fillStyle=tone("--accent-2");
  x.font="600 30px Inter, system-ui, sans-serif";
  x.fillText(refOf(key,verse),edge,y+50);
  x.fillStyle=tone("--text-faint");
  x.font="24px Inter, system-ui, sans-serif";
  x.fillText(`${tr} · ${L("app.name")}`,edge,y+90);

  c.toBlob(b=>{
    if(!b){fail(L("err.card"));return;}
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=`${key.replace(/\s+/g,"-")}-${verse}-${tr}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast(L("msg.saved",{name:a.download}));
  },"image/png");
}

/* ============================================================================
   15. EXEGESIS ASSISTANT
   Calls the Anthropic messages endpoint. When no endpoint is reachable the
   failure is reported plainly rather than replaced with canned text.
   ========================================================================== */
const AI_ENDPOINT="https://api.anthropic.com/v1/messages";
const AI_MODEL="claude-sonnet-4-6";
const chatHistory=[];
function renderChat(){
  const log=$("#chatLog");
  if(!log)return;
  log.innerHTML=chatHistory.length?"":
    `<div class="msg ai"><div class="who">${esc(L("lbl.assistant"))}</div>${esc(L("empty.chat"))}</div>`;
  chatHistory.forEach(m=>{
    const n=el("div","msg "+m.role);
    n.innerHTML=`<div class="who">${esc(L(m.role==="user"?"lbl.you":"lbl.assistant"))}</div>${esc(m.text).replace(/\n/g,"<br>")}`;
    log.appendChild(n);
  });
  log.scrollTop=log.scrollHeight;
}
/* The assistant pane's module entry: everything it wires lives here, so the
   pane can be left out of a build without a stray handler anywhere else. */
function mountAssistant(){
  $("#askSend").onclick=askAssistant;
  $("#askBox").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();askAssistant();}
  });
  $("#clearChat").onclick=()=>{chatHistory.length=0;renderChat();};
  renderChat();
}
async function askAssistant(){
  const box=$("#askBox");
  const q=box.value.trim();
  if(!q)return;
  const key=activeKey();
  box.value="";
  chatHistory.push({role:"user",text:q});
  renderChat();
  const pending=el("div","msg ai",`<div class="who">${esc(L("lbl.assistant"))}</div>${esc(L("lbl.thinking"))}`);
  $("#chatLog").appendChild(pending);

  const vs=key?chapterVerses(key):null;
  const passage=vs?Object.keys(vs).map(n=>`${n} ${vs[n].replace(/\[[HG]\d+\]/g,"")}`).join("\n"):"";
  const meta=key&&CHAPTER_META[key]||{};
  /* The prompt is for the model, not the reader, so it is not a UI string. */
  const system=`You are a study assistant inside a scripture study app. Answer about the open passage with careful, non-sectarian exegesis. Note where interpreters differ instead of flattening the disagreement. Keep answers under 180 words. Reply in the language of the question.`;
  const prompt=`Open note: ${key||"none"} (${state.translation})\nTags: ${(meta.tags||[]).join(" ")}\nLinked passages: ${(meta.refs||[]).join(", ")}\n\nPassage:\n${passage}\n\nQuestion: ${q}`;

  try{
    const res=await fetch(AI_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:AI_MODEL,max_tokens:1000,system,messages:[{role:"user",content:prompt}]})
    });
    if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);
    const data=await res.json();
    const text=(data.content||[]).map(p=>p.type==="text"?p.text:"").join("").trim();
    if(!text)throw new Error("empty response");
    chatHistory.push({role:"ai",text});
  }catch(err){
    console.warn("[app] assistant unreachable; point AI_ENDPOINT at an Anthropic-compatible endpoint",err);
    chatHistory.push({role:"ai",text:L("err.assistant",{msg:err.message})});
  }
  pending.remove();
  renderChat();
}

/* ============================================================================
   16. SETTINGS + COMMANDS
   A setting row is its name over its current value; the name is the same
   string the command palette uses, so each setting is worded once.
   ========================================================================== */
const shownHidden=on=>L(on?"val.shown":"val.hidden");
function openSettings(){
  const pref=themePref();
  const again=fn=>()=>{fn();openSettings();};
  const items=[
    {title:L("cmd.appearance"),sub:themeName(pref),icon:THEME_ICON[pref],run:again(cycleTheme)},
    {title:L("cmd.reading"),sub:`${reading().size}px · ${reading().leading.toFixed(2)} · ${L("val."+reading().measure)}`,icon:"type",
      run:()=>{closeModal();openReadingPanel($("#sbReading"));}},
    {title:L("cmd.layout"),sub:L("val."+state.layout),icon:LAYOUT_ICON[state.layout],
      run:again(()=>{state.layout=VERSE_LAYOUTS[(VERSE_LAYOUTS.indexOf(state.layout)+1)%VERSE_LAYOUTS.length];renderAll();})},
    {title:L("cmd.strongs"),sub:shownHidden(state.showStrongs),icon:"tag",
      run:again(()=>{state.showStrongs=!state.showStrongs;renderAll();})},
    ...(voicesFor(state.translation).length?[{title:L("cmd.voice"),
      sub:`${state.translation} · ${(voiceFor(state.translation)||{}).name||""}`,icon:"audio",run:()=>openVoicePicker()}]:[]),
    ...(dirChoosable(state.translation)?[{title:L("cmd.textDir"),
      sub:`${state.translation} · ${L(textDir(state.translation)==="rtl"?"val.rtl":"val.ltr")}`,icon:"dir",
      run:again(()=>setTextDir(state.translation,textDir(state.translation)==="rtl"?"ltr":"rtl"))}]:[]),
    {title:L("cmd.accent"),sub:L("set.accent"),icon:"spark",
      swatch:appStore.prefs.accent||DEFAULT_ACCENT,run:()=>openAccentPicker()},
    {title:L("cmd.ribbon"),sub:shownHidden(appStore.prefs.ribbon!==false),icon:"rail",run:again(toggleRibbon)},
    {title:L("cmd.statusBar"),sub:shownHidden(appStore.prefs.statusBar!==false),icon:"info",run:again(toggleStatusBar)},
    {title:L("cmd.parallel"),sub:`${state.panes.join(", ")} · ${L("set.parallel",{n:MAX_PANES})}`,icon:"add-pane",
      run:again(addPane)},
    {title:L("cmd.exportData"),sub:L("set.export",{v:SCHEMA_VERSION}),icon:"download",run:()=>exportAppData()},
    {title:L("cmd.clearInk"),sub:L("set.clearInk"),icon:"eraser",
      run:()=>{appStore.drawings={};saveStore();renderAll();toast(L("msg.cleared",{what:L("lbl.ink")}));}},
    {title:L("cmd.forget"),sub:L("set.forget"),icon:"undo",
      run:()=>{delete appStore.session;saveStore();toast(L("msg.forgot"));}},
    {title:L("cmd.wipe"),sub:L("set.wipe"),icon:"trash",
      run:()=>{
        if(!confirm(L("ask.wipe")))return;
        appStore=blankStore();storeWritable=true;saveStore();renderAll();renderBookmarks();
        toast(L("msg.wiped"));
      }}
  ];
  openModal({placeholder:L("cmd.settings"),hint:L("app.name"),items,onPick:it=>it.run()});
  $("#modalInput").oninput=null;
}
/* Cycling matters once more than two windows are open and the front one is
   covering the rest. */
function cycleWindows(){
  const wins=$$(".win-layer").filter(w=>!w.hasAttribute("hidden"));
  if(!wins.length){toast(L("msg.noWindows"));return;}
  wins.sort((a,b)=>(parseInt(a.style.zIndex,10)||0)-(parseInt(b.style.zIndex,10)||0));
  raiseWindow(wins[0]);
}
function openAccentPicker(){
  const current=appStore.prefs.accent||DEFAULT_ACCENT;
  const items=ACCENTS.map(([name,hex])=>({title:L("accent."+name.toLowerCase()),sub:hex,swatch:hex,hex}));
  items.push({title:L("cmd.customAccent"),sub:current,icon:"spark",custom:true});
  openModal({
    placeholder:L("cmd.accent"),
    hint:current,
    items,
    onPick:it=>{
      if(it.custom){$("#accentInput").click();return;}
      setAccent(it.hex);
      toast(L("msg.state",{what:L("cmd.accent"),value:it.title}));
    }
  });
  $("#modalInput").oninput=null;
}
function exportAppData(){
  const blob=new Blob([JSON.stringify(appStore,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`laisiangtho-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(L("msg.saved",{name:a.download}));
}
/* Every command has a stable id; its label is "cmd.<id>" unless it says
   otherwise, and its shortcut is KEYS[id]. Pages link to commands by id, so
   rewording a label never breaks a link. */
function commandList(){
  const c=(id,icon,run,label)=>({id,icon,run,title:label||L("cmd."+id),kbd:KEYS[id]||""});
  const list=[
    c("switcher","book-open",openQuickSwitcher),
    c("palette","cmd",openCommandPalette),
    c("mode","edit",()=>{state.mode=state.mode==="reading"?"source":"reading";renderAll();}),
    c("parallel","add-pane",addPane),
    c("closeParallel","x",()=>closePane(state.panes.length-1)),
    c("prev","chev",()=>stepChapter(-1)),
    c("next","chev",()=>stepChapter(1)),
    c("translation","book",()=>openTranslationPicker(0)),
    c("reading","type",()=>openReadingPanel($("#sbReading"))),
    c("textBigger","plus",()=>nudgeSize(1)),
    c("textSmaller","min",()=>nudgeSize(-1)),
    c("textReset","type",()=>setReading({size:READING_DEFAULT.size})),
    c("layout",LAYOUT_ICON[state.layout],cycleLayout,`${L("cmd.layout")}: ${L("val."+state.layout)}`),
    c("graph","graph",()=>RIBBON.openGraph(),L("view.graph")),
    c("board","canvas",()=>RIBBON.openBoard(),L("view.board")),
    c("annotate","pen",()=>RIBBON.toggleInk()),
    ...(speech.mode!=="idle"||canSpeak(state.translation)?[
      c("read","audio",toggleSpeech,L(speech.mode==="playing"?"cmd.pause":speech.mode==="paused"?"cmd.resume":"cmd.read")),
      c("stop","stop",speechStop)]:[]),
    ...(voicesFor(state.translation).length?[c("voice","audio",openVoicePicker)]:[]),
    ...(dirChoosable(state.translation)?[c("textDir","dir",()=>setTextDir(state.translation,textDir(state.translation)==="rtl"?"ltr":"rtl"),
      `${L("cmd.textDir")} · ${state.translation}`)]:[]),
    c("card","card",()=>RIBBON.exportCard()),
    c("copyLink","link",()=>{
      navigator.clipboard.writeText(passageLink())
        .then(()=>toast(L("msg.linkCopied")))
        .catch(()=>fail(L("err.clipboard")));
    }),
    c("composer","note",()=>RIBBON.openComposer()),
    c("newNote","plus",()=>openComposer(createNote({title:""}).id)),
    c("notes","notes",()=>openView("notes"),L("view.notes")),
    c("closeTab","x",()=>state.active&&closeTab(state.active)),
    c("detach","max",()=>{
      if(isTouchLayout()){fail(L("err.smallScreen"));return;}
      const t=activeTab();
      if(t)detachTab(t,Math.round(window.innerWidth/2),Math.round(window.innerHeight/2));
    }),
    c("dockAll","panel-l",()=>{
      const open=floatTabs();
      if(!open.length){toast(L("msg.noWindows"));return;}
      open.forEach(t=>delete t.float);
      state.active=open[open.length-1].id;
      renderAll();
      toast(L("msg.docked",{n:open.length}));
    }),
    c("nextWindow","max",cycleWindows),
    c("settings","settings",openSettings),
    c("appearance","sun",cycleTheme),
    c("accent","spark",openAccentPicker),
    c("ribbon","rail",toggleRibbon),
    c("statusBar","info",toggleStatusBar),
    c("exportData","download",exportAppData),
    c("help","help",()=>openView("help"),L("view.help")),
    c("shortcuts","cmd",()=>openView("shortcuts"),L("view.shortcuts")),
    c("about","info",()=>openView("about"),L("view.about")),
    c("selftest","check",()=>{
      const t=state.tabs.find(x=>x.kind==="selftest");
      if(t&&!t.float&&state.active===t.id)renderPanes();else openView("selftest");
    })
  ];
  /* One "show" command per sidebar pane that is part of this build, and one
     row reset per sidebar that has panes. */
  livePanes().forEach(p=>list.push(c("pane."+p.id,p.icon,()=>{
    if(p.id==="search")RIBBON.focusSearch();else selectSidebar(p.id);
  },L("pane."+p.id))));
  ["left","right"].filter(side=>!sideIsEmpty(side)).forEach(side=>list.push(
    c("rows."+side,side==="left"?"panel-l":"panel-r",()=>{
      resetSidebarRows(side);toast(L("msg.rowsReset",{side:L("side."+side)}));
    },L("cmd.resetRows",{side:L("side."+side)}))));
  list.forEach(x=>{if(x.id==="pane.search")x.kbd=KEYS.search;});
  return list;
}
const runCommand=id=>{const cmd=commandList().find(x=>x.id===id);if(cmd)cmd.run();return !!cmd;};
const RIBBON={
  quickSwitcher:openQuickSwitcher,
  commandPalette:openCommandPalette,
  focusSearch:()=>{
    if(!paneOn("search"))return;
    selectSidebar("search");$("#searchBox").focus();
  },
  openGraph:()=>openView("graph"),
  openBoard:()=>openView("board"),
  toggleInk:()=>{
    const tab=activeTab();
    if(!state.ink&&((!tab||tab.kind!=="chapter")||state.mode!=="reading")){fail(L("err.annotate"));return;}
    state.ink=!state.ink;renderAll();
    if(state.ink)toast(L("msg.inkOn"));
  },
  toggleSpeech,
  exportCard:()=>{
    const key=activeKey();
    if(!key){fail(L("err.needChapter"));return;}
    const vs=chapterVerses(key);
    if(!vs){fail(L("err.noText",{tr:state.translation,ref:key}));return;}
    exportVerseCard(key,+Object.keys(vs)[0]);
  },
  openSettings,
  openHelp:()=>openView("help"),
  /* Buried means raise, front means hide — a taskbar button, not a toggle. */
  openComposer:()=>{
    const win=$("#composer");
    if(!composerIsOpen()){openComposer();return;}
    if(isFront(win)){closeComposer();return;}
    raiseWindow(win);
  }
};

/* ============================================================================
   17. BOOT
   ========================================================================== */
function boot(){
  loadStore();
  document.documentElement.lang=LOCALE;
  applyReading();
  applyStrings();                     // every data-l / data-lt / data-lp in the page
  applyTheme();
  mountPanes();                       // drop panes this build leaves out, wire the rest
  initSidebars();
  const resumed=restoreSession();
  sessionReady=true;
  searchIndex=buildIndex();
  wireChrome();
  wireComposer();
  wireVoices();
  renderSpeechUI();
  $("#btnSpeech").addEventListener("contextmenu",e=>{
    e.preventDefault();
    if(speech.mode!=="idle"){speechStop();toast(L("msg.stopped"));}
  });
  /* A link outranks the saved session; the session outranks the first-run default. */
  if(!applyHash()){
    if(resumed)renderAll();
    else openChapter("Psalms 23");
  }
  if(/[?&]selftest=1\b/.test(location.search))openView("selftest");
  window.addEventListener("hashchange",applyHash);
  window.addEventListener("popstate",applyHash);
  updateStorageReadout();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
