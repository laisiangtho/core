     leave the other rows showing whatever they were showing. */
  const group=sideGroups[which].find(g=>g.views.includes(view));
  if(group)group.active=view;
  renderSidebar(which);
  if(window.innerWidth<=900){
    document.body.classList.add(which==="left"?"drawer-l":"drawer-r","has-drawer");
    refreshNav();
  }
}

/* ============================================================================
   8b. SESSION AND DEEP LINKS
   The workspace is restored from the last visit; a link in the address bar
   outranks it, so a shared passage always opens on the passage.
   ========================================================================== */
/* A width dragged on a desktop must not leak into a drawer, where the
   stylesheet sizes it to the viewport instead. */
const narrowLayout=()=>window.matchMedia
  ? window.matchMedia("(max-width:900px)").matches
  : window.innerWidth<=900;
let storedWidths={l:"",r:""};
function applySidebarWidths(){
  const root=document.documentElement.style;
  if(narrowLayout()){
    root.removeProperty("--sidebar-l");
    root.removeProperty("--sidebar-r");
    return;
  }
  if(storedWidths.l)root.setProperty("--sidebar-l",storedWidths.l);
  if(storedWidths.r)root.setProperty("--sidebar-r",storedWidths.r);
}

function captureSession(){
  const groupsOf=side=>sideGroups[side].map(g=>({views:[...g.views],active:g.active,size:g.size||1}));
  return {
    tabs:state.tabs.map(t=>({kind:t.kind,key:t.key,float:t.float||null})),
    active:state.tabs.findIndex(t=>t.id===state.active),
    panes:[...state.panes],
    paneSizes:[...state.paneSizes],
    mode:state.mode,compareWith:state.compareWith,syncScroll:state.syncScroll,
    showStrongs:state.showStrongs,flow:state.flow,layout:state.layout,readingSize:state.readingSize,
    lastKey:state.lastKey,
    tree:{testaments:[...treeOpen.testaments],books:[...treeOpen.books]},
    sidebars:{
      left:{hidden:$("#sideL").hidden,groups:groupsOf("left")},
      right:{hidden:$("#sideR").hidden,groups:groupsOf("right")}
    },
    widths:{l:storedWidths.l,r:storedWidths.r}
  };
}
/* initSidebars renders the defaults before restoreSession has read the stored
   layout, so saving is held until the restore has had its turn. */
let sessionReady=false;
function saveSession(){
  if(!storeWritable||!sessionReady)return;
  appStore.session=captureSession();
  saveStore();
}
/* Everything restored is validated first: a translation that is no longer in
   the registry, a book that does not exist or a pane that was renamed is
   dropped rather than restored into a broken workspace. */
function restoreSession(){
  const s=appStore.session;
  if(!s||typeof s!=="object"){sessionReady=true;return false;}
  ["mode","compareWith","syncScroll","showStrongs","flow","readingSize","lastKey"].forEach(k=>{
    if(s[k]!==undefined&&s[k]!==null)state[k]=s[k];
  });
  if(VERSE_LAYOUTS.includes(s.layout))state.layout=s.layout;
  if(Array.isArray(s.panes)){
    const panes=s.panes.filter(id=>TRANSLATIONS.some(t=>t.id===id));
    if(panes.length){
      state.panes=panes.slice(0,MAX_PANES);
      state.paneSizes=Array.isArray(s.paneSizes)&&s.paneSizes.length===state.panes.length
        ? s.paneSizes.map(n=>Number(n)||1)
        : state.panes.map(()=>1);
    }
  }
  if(s.widths){
    storedWidths={l:s.widths.l||"",r:s.widths.r||""};
    applySidebarWidths();
  }
  if(s.sidebars){
    ["left","right"].forEach(side=>{
      const conf=s.sidebars[side];
      if(!conf)return;
      const belongs=Object.keys(PANE_SIDE).filter(v=>PANE_SIDE[v]===side);
      const groups=(conf.groups||[])
        .map(g=>({views:(g.views||[]).filter(v=>belongs.includes(v)),active:g.active,size:Number(g.size)||1}))
        .filter(g=>g.views.length);
      const seen=new Set(groups.flatMap(g=>g.views));
      const missing=belongs.filter(v=>!seen.has(v));
      if(groups.length){
        if(missing.length)groups[0].views.push(...missing);
        groups.forEach(g=>{if(!g.views.includes(g.active))g.active=g.views[0];});
        sideGroups[side]=groups.slice(0,MAX_ROWS);
      }
      const host=sideHost(side);
      host.hidden=!!conf.hidden;
      (side==="left"?$("#tglLeft"):$("#tglRight")).setAttribute("aria-pressed",String(!conf.hidden));
      document.body.dataset[side==="left"?"left":"right"]=conf.hidden?"shut":"open";
      renderSidebar(side);
    });
  }
  if(s.tree){
    if(Array.isArray(s.tree.testaments)){
      treeOpen.testaments.clear();
      s.tree.testaments.filter(x=>x==="OT"||x==="NT").forEach(x=>treeOpen.testaments.add(x));
    }
    if(Array.isArray(s.tree.books)){
      treeOpen.books.clear();
      s.tree.books.filter(b=>BOOK_BY_NAME.get(b)).forEach(b=>treeOpen.books.add(b));
    }
  }
  sessionReady=true;
  const tabs=(Array.isArray(s.tabs)?s.tabs:[]).filter(t=>t&&(
    t.kind==="chapter"
      ? !!BOOK_BY_NAME.get(String(t.key).replace(/ \d+$/,""))
      : !!VIEWS[t.kind]));
  if(!tabs.length)return false;
  state.tabs=tabs.map(t=>{
    const rec={id:++tabSeq,kind:t.kind,key:t.kind==="chapter"?t.key:t.kind};
    const f=t.float;
    if(f&&typeof f==="object"&&!isTouchLayout()){
      rec.float={
        x:Math.max(0,Math.min(Number(f.x)||40,window.innerWidth-120)),
        y:Math.max(0,Math.min(Number(f.y)||60,window.innerHeight-80)),
        w:Math.max(340,Number(f.w)||520),h:Math.max(220,Number(f.h)||440),
        translation:TRANSLATIONS.some(x=>x.id===f.translation)?f.translation:null
      };
    }
    return rec;
  });
  const docked=state.tabs.filter(t=>!t.float);
  if(!docked.length){state.active=null;return true;}
  const wanted=state.tabs[Number.isInteger(s.active)?s.active:0];
  state.active=(wanted&&!wanted.float)?wanted.id:docked[0].id;
  return true;
}

/* ---- deep links ---------------------------------------------------------- */
let hashLock=false;
function currentHash(){
  const t=activeTab();
  if(!t)return "";
  if(t.kind!=="chapter")return "view="+t.kind;
  return t.key.replace(/ /g,"+");
}
function syncHash(push){
  if(hashLock)return;
  const h=currentHash();
  if(location.hash.replace(/^#/,"")===h)return;
  try{
    const url=h?"#"+h:location.pathname+location.search;
    if(push)history.pushState(null,"",url);
    else history.replaceState(null,"",url);
  }catch(e){}
}
function parseHash(raw){
  let text=String(raw||"").replace(/^#/,"");
  if(!text)return null;
  try{text=decodeURIComponent(text);}catch(e){}
  text=text.replace(/\+/g," ").trim();
  if(!text)return null;
  if(text.startsWith("view="))return {view:text.slice(5).trim()};
  const m=text.match(/^(.+?)(?::(\d+))?$/);
  if(!m)return null;
  const key=m[1].trim();
  if(!BOOK_BY_NAME.get(key.replace(/ \d+$/,"")))return null;
  return {key,verse:m[2]?+m[2]:null};
}
function applyHash(){
  const p=parseHash(location.hash);
  if(!p)return false;
  hashLock=true;
  try{
    if(p.view)VIEWS[p.view]?openView(p.view):null;
    else openChapter(p.key,p.verse?{verse:p.verse}:{});
  }finally{hashLock=false;}
  return true;
}
function passageLink(verse){
  let h=currentHash();
  if(verse&&h&&!h.startsWith("view="))h+=":"+verse;
  return location.origin+location.pathname+location.search+(h?"#"+h:"");
}

/* ============================================================================
   8c. TOUCH LAYOUT
   Hover toolbars and a multi-tab strip do not survive a phone, so the same
   actions are reached through a switcher, a sheet and a gesture instead.
   ========================================================================== */
const isTouchLayout=()=>window.innerWidth<=760;

function openTabSwitcher(){
  const items=state.tabs.map(t=>({
    title:tabLabel(t),id:t.id,icon:tabIcon(t),
    sub:t.kind==="chapter"?placeOf(t.key):""
  }));
  items.push({title:L("cmd.switcher"),icon:"plus",act:"new"});
  if(state.tabs.length>1)items.push({title:L("cmd.closeTab"),icon:"x",act:"close"});
  openModal({
    placeholder:L("ph.tabs"),
    hint:L("lbl.open",{n:state.tabs.length}),
    items,
    onPick:it=>{
      if(it.act==="new"){openQuickSwitcher();return;}
      if(it.act==="close"){if(state.active)closeTab(state.active);return;}
      state.active=it.id;renderAll();
    }
  });
  $("#modalInput").oninput=null;
}

/* ---- verse bar (desktop) ----------------------------------------------------
   Nothing appears over the text while reading. The verse number is the
   handle: it lights up as the pointer passes; a click, Enter, or a right click
   on the verse opens a small bar pinned above it, pointing at the number. */
const verseBar={node:null};
function openVerseBar(verse,fromKeyboard,at){
  const bar=$("#verseBar");
  closeVerseBar(false);
  const leaf=verse.closest("[data-translation]");
  const tr=leaf?leaf.dataset.translation:state.translation;
  const key=surfaceKey(verse),n=+verse.dataset.verse;
  const marked=!!appStore.highlights[`${key}|${n}`];
  verseBar.node=verse;
  verse.classList.add("is-selected");
  bar.innerHTML=verseActions(tr).map(a=>{
    const name=L(a.act==="mark"&&marked?"cmd.unhighlight":a.label);
    return `<button data-act="${a.act}" title="${esc(name)}" aria-label="${esc(name)}"${a.act==="mark"?` aria-pressed="${marked}"`:""}>${icon(a.icon)}</button>`;
  }).join("");
  bar.setAttribute("aria-label",refOf(key,n));
  bar.hidden=false;
  const num=$(".vnum",verse)||verse;
  const r=num.getBoundingClientRect(),w=bar.offsetWidth,h=bar.offsetHeight;
  const ax=at?at.x:r.left+r.width/2;
  const left=Math.max(8,Math.min(isRTL()?ax-w+22:ax-22,innerWidth-w-8));
  const scroller=verse.closest(".leaf-scroll");
  const ceiling=scroller?scroller.getBoundingClientRect().top+4:8;
  const anchorTop=at?at.y:r.top,anchorBottom=at?at.y:r.bottom;
  const above=anchorTop-h-9>=ceiling;
  bar.classList.toggle("is-above",above);
  bar.style.left=left+"px";
  bar.style.top=(above?anchorTop-h-9:anchorBottom+9)+"px";
  bar.style.setProperty("--arrow-x",Math.max(12,Math.min(w-12,ax-left))+"px");
  if(fromKeyboard){const b=$("button",bar);if(b)b.focus();}
}
function closeVerseBar(restoreFocus){
  const bar=$("#verseBar");
  if(!bar||bar.hidden)return;
  bar.hidden=true;
  const v=verseBar.node;verseBar.node=null;
  if(!v)return;
  v.classList.remove("is-selected");
  if(restoreFocus){const n=$(".vnum",v);if(n)n.focus();}
}
function wireVerseBar(){
  const bar=$("#verseBar");
  wireGridKeys(bar,"button",{onEscape:()=>closeVerseBar(true)});
  bar.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");
    if(!b||!verseBar.node)return;
    const v=verseBar.node;
    closeVerseBar(false);
    verseAction(b.dataset.act,v);
  });
  document.addEventListener("pointerdown",e=>{
    if(bar.hidden||bar.contains(e.target))return;
    if(verseBar.node&&e.target.closest(".vnum")&&verseBar.node.contains(e.target))return;   // the number toggles
    closeVerseBar(false);
  },true);
  ["#panes","#floats"].forEach(q=>$(q).addEventListener("scroll",()=>closeVerseBar(false),true));
  window.addEventListener("resize",()=>closeVerseBar(false));
  /* A right click on a verse opens the bar where the pointer is, unless text is
     selected: then the browser's own menu, with Copy, is what is wanted. */
  ["#panes","#floats"].forEach(q=>$(q).addEventListener("contextmenu",e=>{
    const v=e.target.closest(".chapter .verse");
    if(!v||isTouchLayout()||e.target.closest("a,button"))return;
    const sel=window.getSelection&&String(window.getSelection()||"").trim();
    if(sel)return;
    e.preventDefault();
    openVerseBar(v,false,{x:e.clientX,y:e.clientY});
  }));
  /* Verse numbers are one tab stop per chapter; the arrow keys move between
     them, Enter or Space opens the bar. */
  ["#panes","#floats"].forEach(q=>$(q).addEventListener("keydown",e=>{
    const n=e.target.closest&&e.target.closest(".vnum");
    if(!n)return;
    if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();openVerseBar(n.closest(".verse"),true);return;}
    if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
    const all=$$(".vnum",n.closest(".chapter"));
    const j=all.indexOf(n)+(e.key==="ArrowDown"?1:-1);
    if(j<0||j>=all.length)return;
    e.preventDefault();e.stopPropagation();
    all.forEach(x=>{x.tabIndex=-1;});
    all[j].tabIndex=0;all[j].focus();
  }));
}

/* ---- verse sheet --------------------------------------------------------- */
let sheetVerse=null;
function openVerseSheet(node){

  if(!key||!verse)return;
  sheetVerse=node;

  const surfTr=(node.closest("[data-translation]")||{dataset:{}}).dataset.translation||state.translation;
  const m=trMeta(surfTr);
  $("#sheetHead").innerHTML=`<b>${esc(refOf(key,verse))}</b><span class="sh-text" lang="${esc(m.lang||"")}" dir="${textDir(surfTr)}">${esc(verseText(key,verse,surfTr))}</span>`;

    `<button class="sheet-row" data-act="${a.act}">${icon(a.icon)}

function closeVerseSheet(){

/* ---- the bottom bar follows the scroll -----------------------------------
   The bar is translated by exactly the distance scrolled, so it leaves and
   returns with the text rather than popping between two states. It only
   animates for the snap that resolves a half-open bar when scrolling stops. */
let navH=0,navOff=0,navIdle=null,navLastY=0,navNode=null,navHeld=false;

function navTravel(){
  const bar=$("#mobileBar");
  if(!bar)return 0;
  if(!navH)navH=(bar.offsetHeight||46)+34;
  return navH;
}
function setNav(off,animate){
  const bar=$("#mobileBar");
  if(!bar)return;
  const travel=navTravel()||60;
  navOff=Math.max(0,Math.min(travel,off));
  document.body.classList.toggle("nav-tracking",!animate);
  bar.style.transform=`translateX(-50%) translateY(${Math.round(navOff)}px)`;
  bar.style.opacity=String(1-Math.min(1,navOff/travel));
  bar.classList.toggle("is-stowed",navOff>travel*.85);
}
/* A drawer owns the screen while it is open, so the bar stows regardless of
   where the reader had scrolled to. */
function refreshNav(animate){
  if(!isTouchLayout()){
    const bar=$("#mobileBar");
    if(bar){bar.style.transform="";bar.style.opacity="";bar.classList.remove("is-stowed");}
    return;
  }
  const away=document.body.classList.contains("has-drawer")||
             document.body.classList.contains("drawer-dragging");
  setNav(away?navTravel():0,animate!==false);
}
/* Snapping while a finger is still down would move the bar out from under the
   gesture. The bar holds wherever the scroll left it until the touch ends and
   any momentum has settled. */
function scheduleNavSnap(){
  clearTimeout(navIdle);
  navIdle=setTimeout(()=>{
    if(navHeld){scheduleNavSnap();return;}
    const travel=navTravel();
    setNav(navOff>travel/2?travel:0,true);
  },140);
}
function wireNavScroll(){
  document.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch")navHeld=true;
  },{passive:true});
  const release=()=>{
    if(!navHeld)return;
    navHeld=false;
    scheduleNavSnap();
  };
  document.addEventListener("pointerup",release,{passive:true});
  document.addEventListener("pointercancel",release,{passive:true});
  document.addEventListener("scroll",e=>{
    const t=e.target;
    if(!isTouchLayout()||!t||!t.classList||!t.classList.contains("leaf-scroll"))return;
    if(document.body.classList.contains("has-drawer"))return;
    const y=t.scrollTop;
    if(t!==navNode){navNode=t;navLastY=y;return;}   // a different pane: re-anchor
    const dy=y-navLastY;
    navLastY=y;
    if(y<=4){setNav(0,true);}
    else if(dy)setNav(navOff+dy,false);
    scheduleNavSnap();
  },true);
}

/* ---- edge swipe for the drawers ------------------------------------------
   Opening is a drag from the screen edge; closing is a drag on the scrim. The
   drawer tracks the finger rather than snapping, so an abandoned drag is
   visibly abandoned instead of silently ignored. */
function wireDrawerSwipe(){
  const EDGE=26,COMMIT=.4;
  const scrim=$("#drawerScrim");
  let drag=null,skipScrimClick=false;
  const widthOf=side=>sideHost(side).getBoundingClientRect().width||280;
  const openClass=side=>side==="left"?"drawer-l":"drawer-r";

  document.addEventListener("pointerdown",e=>{
    drag=null;
    if(e.pointerType!=="touch"||!isTouchLayout())return;
    /* State, not just the event target: anything layered over the workspace
       owns the gesture, whether or not the touch began on top of it. */
    if(composerIsOpen()||!$("#modalScrim").hidden)return;
    if($("#verseSheet").classList.contains("is-open"))return;
    const from=e.target instanceof Element?e.target:null;
    if(from&&from.closest("#composer,.sheet,.modal,.scrim"))return;
    const open=document.body.classList.contains("has-drawer");
    if(open){
      if(e.target!==scrim)return;
      const side=document.body.classList.contains("drawer-l")?"left":"right";
      drag={side,mode:"close",x:e.clientX,y:e.clientY,w:widthOf(side),p:1};
      return;
    }
    const atLeft=e.clientX<=EDGE,atRight=e.clientX>=window.innerWidth-EDGE;
    const side=atLeft?physicalSide("left"):atRight?physicalSide("right"):null;
    if(side&&!sideIsEmpty(side))drag={side,mode:"open",x:e.clientX,y:e.clientY,w:widthOf(side),p:0};
  },{passive:true});

  document.addEventListener("pointermove",e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved){
      if(Math.abs(dx)<8)return;
      /* A mostly vertical drag belongs to whatever is scrolling underneath. */
      if(Math.abs(dx)<Math.abs(dy)*1.2){drag=null;return;}
      drag.moved=true;
      document.body.classList.add("drawer-dragging");
      sideHost(drag.side).hidden=false;
      if(drag.mode==="open")document.body.classList.add(openClass(drag.side));
    }
    const onLeft=physicalSide(drag.side)==="left";
    const dir=onLeft?1:-1;
    const base=drag.mode==="open"?0:drag.w;
    const travel=Math.max(0,Math.min(drag.w,base+dx*dir));
    drag.p=travel/drag.w;
    const offset=drag.w-travel;
    sideHost(drag.side).style.transform=`translateX(${onLeft?-offset:offset}px)`;
    document.documentElement.style.setProperty("--drawer-p",String(drag.p*.9));
  },{passive:true});

  const finish=()=>{
    if(!drag)return;
    const d=drag;drag=null;
    sideHost(d.side).style.transform="";
    document.body.classList.remove("drawer-dragging");
    document.documentElement.style.removeProperty("--drawer-p");
    if(!d.moved)return;
    skipScrimClick=true;
    setTimeout(()=>{skipScrimClick=false;},0);
    const open=d.p>COMMIT;
    document.body.classList.remove("drawer-l","drawer-r");
    document.body.classList.toggle("has-drawer",open);
    if(open)document.body.classList.add(openClass(d.side));
    refreshNav();
  };
  document.addEventListener("pointerup",finish,{passive:true});
  document.addEventListener("pointercancel",finish,{passive:true});
  scrim.addEventListener("click",e=>{
    if(skipScrimClick){e.stopImmediatePropagation();skipScrimClick=false;}
  },true);
}

/* ---- swipe between chapters ---------------------------------------------- */
function wireSwipe(){
  let sx=0,sy=0,live=false;
  const host=$("#panes");
  host.addEventListener("pointerdown",e=>{
    live=false;
    if(e.pointerType!=="touch"||!isTouchLayout()||state.ink)return;
    const tab=activeTab();
    if(!tab||tab.kind!=="chapter")return;
    if(e.target.closest("button,a,input,textarea,select,.leaf-divider"))return;
    sx=e.clientX;sy=e.clientY;live=true;
  });
  host.addEventListener("pointerup",e=>{
    if(!live)return;
    live=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    /* Clearly horizontal and clearly deliberate, or it was a scroll. */
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.4)return;
    stepChapter((dx<0)!==isRTL()?1:-1);   // swipe toward the start for the next chapter
  });
  /* The browser cancels the pointer when it takes the gesture for itself. */
  host.addEventListener("pointercancel",()=>{live=false;});
}

/* ============================================================================
   9. MODALS — quick switcher and command palette
   ========================================================================== */
const modal={open:false,items:[],sel:0,onPick:null};
function openModal({placeholder,hint,items,onPick,query=""}){
  modal.open=true;modal.items=items;modal.sel=0;modal.onPick=onPick;modal.all=items;
  $("#modalScrim").hidden=false;
  $("#modalHint").textContent=hint||"";
  const input=$("#modalInput");
  input.placeholder=placeholder;input.value=query;

}
/* Tear the list down on close. Leaving rendered rows with live handlers and a
   bound onPick lets a stale reference fire the action a second time. */
function closeModal(){
  modal.open=false;modal.onPick=null;modal.items=[];
  $("#modalList").innerHTML="";
  $("#modalScrim").hidden=true;
}
function pickModal(it){
  const fn=modal.onPick;
  closeModal();
  if(fn)fn(it);
}
function paintModal(items){
  modal.items=items.slice(0,120);
  const list=$("#modalList");
  list.innerHTML=modal.items.length?"":`<p class="empty-hint">${esc(L("empty.match"))}</p>`;
  modal.items.forEach((it,i)=>{
    const n=el("div","mi"+(i===modal.sel?" is-sel":""),
      `${it.swatch?`<span class="swatch-dot" style="background:${esc(it.swatch)}"></span>`:icon(it.icon||"book")}<div class="mi-main"><div class="mi-t">${esc(it.title)}</div>`+
      (it.sub?`<div class="mi-s">${esc(it.sub)}</div>`:"")+`</div>`+(it.kbd?`<kbd>${esc(it.kbd)}</kbd>`:""));
    n.onmouseenter=()=>{modal.sel=i;paintSel();};
    n.onclick=()=>pickModal(it);

}
function paintSel(){
  $$("#modalList .mi").forEach((n,i)=>n.classList.toggle("is-sel",i===modal.sel));
  const sel=$("#modalList .mi.is-sel");
  if(sel)sel.scrollIntoView({block:"nearest"});
}
function fuzzy(q,s){
  q=q.toLowerCase();s=s.toLowerCase();
  if(!q)return 1;
  let i=0,score=0,streak=0;
  for(const ch of s){
    if(ch===q[i]){i++;streak++;score+=streak*2;}
    else streak=0;
    if(i===q.length)return score+(s.startsWith(q)?40:0);
  }
  return 0;
}
function allChapterItems(){
  const items=[];
  BIBLE_CANON.forEach(b=>{
    for(let c=1;c<=b.chapters;c++){
      const key=chapterKey(b.name,c);
      const has=!!chapterVerses(key,"KJV");
      /* The English key stays searchable as an alias, so either name finds it. */
      const shown=displayKey(key);
      items.push({title:shown,sub:placeOf(key),icon:has?"book":"files",key,has,
        alias:[shown===key?"":key,...(CHAPTER_META[key]&&CHAPTER_META[key].aliases||[])].join(" ")});
    }
  });
  return items;
}
let CHAPTER_ITEMS=null;
function openQuickSwitcher(){
  CHAPTER_ITEMS=CHAPTER_ITEMS||allChapterItems();
  const rank=q=>CHAPTER_ITEMS
    .map(it=>({it,s:Math.max(fuzzy(q,it.title),fuzzy(q,it.alias)*0.9)+(it.has?18:0)}))
    .filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,120).map(r=>r.it);
  openModal({
    placeholder:L("cmd.switcher"),
    hint:L("hint.bundledFirst"),
    items:rank(""),
    onPick:it=>openChapter(it.key)
  });
  $("#modalInput").oninput=e=>{modal.sel=0;paintModal(rank(e.target.value));};
}
function openCommandPalette(){
  const cmds=commandList();
  const rank=q=>cmds.map(c=>({c,s:fuzzy(q,c.title)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.c);
  openModal({
    placeholder:L("cmd.palette"),
    hint:L("lbl.commands",{n:cmds.length}),
    items:rank(""),
    onPick:c=>c.run()
  });
  $("#modalInput").oninput=e=>{modal.sel=0;paintModal(rank(e.target.value));};
}
/* One list, built when it is asked for. Panes carry a button, not a select, so
   adding versions costs nothing until one is opened. */
function openTranslationPicker(paneIndex){
  const i=typeof paneIndex==="number"?paneIndex:0;
  openModal({
    placeholder:L("cmd.translation"),
    hint:state.panes.length>1?L("hint.pane",{i:i+1,n:state.panes.length}):"",
    items:TRANSLATIONS.filter(t=>t.id===state.panes[i]||!state.panes.includes(t.id)).map(t=>{
      const resident=!!bibleDataStore[t.id];
      return {title:`${t.id} — ${t.name}`,
        sub:`${t.year} · ${langName(t.lang)||"?"} · ${t.note}${resident?"":" · "+L("hint.loadsOnUse")}`,
        icon:t.id===state.panes[i]?"check":"book",id:t.id};
    }),
    onPick:t=>setPaneTranslation(i,t.id)
  });
  $("#modalInput").oninput=null;
}

/* ============================================================================
   10. EVENT WIRING
   ========================================================================== */
function wireChrome(){
  const syncEdgeFlags=()=>{
    /* The menu button and the window buttons both float at the window's
       corners, so whichever strip sits under them reserves the space. */
    document.body.dataset.right=$("#sideR").hidden?"shut":"open";
    document.body.dataset.left=$("#sideL").hidden?"shut":"open";
  };
  syncEdgeFlags();
  $("#tglLeft").onclick=e=>{
    const s=$("#sideL");
    if(sideIsEmpty("left"))return;
    if(window.innerWidth<=900){
      document.body.classList.toggle("drawer-l");
      document.body.classList.toggle("has-drawer",document.body.classList.contains("drawer-l"));
      refreshNav();return;
    }
    s.hidden=!s.hidden;e.currentTarget.setAttribute("aria-pressed",String(!s.hidden));
    syncEdgeFlags();saveSession();
  };
  $("#tglRight").onclick=e=>{
    const s=$("#sideR");
    if(sideIsEmpty("right"))return;
    if(window.innerWidth<=900){
      document.body.classList.toggle("drawer-r");
      document.body.classList.toggle("has-drawer",document.body.classList.contains("drawer-r"));
      refreshNav();return;
    }
    s.hidden=!s.hidden;e.currentTarget.setAttribute("aria-pressed",String(!s.hidden));
    syncEdgeFlags();saveSession();
  };
  const paintFullscreen=()=>{
    const on=!!document.fullscreenElement;
    $("#tglFull").setAttribute("aria-pressed",String(on));
    setLabel($("#tglFull"),L("cmd.fullscreen"));
  };
  $("#tglFull").onclick=()=>{
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>fail(L("err.fullscreen")));
  };
  document.addEventListener("fullscreenchange",paintFullscreen);
  paintFullscreen();
  $("#drawerScrim").onclick=()=>{document.body.classList.remove("drawer-l","drawer-r","has-drawer");refreshNav();};
  /* The bottom bar drives the same handlers as the band, so behaviour cannot
     drift between the two layouts. */
  $("#mobileBar").addEventListener("click",e=>{
    const b=e.target.closest("[data-mb]");
    if(!b)return;
    const act=b.dataset.mb;
    if(act==="left")$("#tglLeft").click();
    else if(act==="right")$("#tglRight").click();
    else if(act==="prev")stepChapter(-1);
    else if(act==="next")stepChapter(1);
    else openCommandPalette();
  });
  $("#appBtn").onclick=()=>openSettings();
  $("#barApp").onclick=()=>openSettings();

  $$(".ribbon .rib").forEach(b=>b.onclick=()=>RIBBON[b.dataset.cmd]&&RIBBON[b.dataset.cmd]());

  $("#btnMode").onclick=()=>{state.mode=state.mode==="reading"?"source":"reading";renderAll();};
  $("#btnSplit").onclick=()=>addPane();
  $("#btnPrev").onclick=()=>stepChapter(-1);
  $("#btnNext").onclick=()=>stepChapter(1);
  $("#btnInk").onclick=()=>RIBBON.toggleInk();
  $("#btnMore").onclick=()=>openCommandPalette();

  /* Pane controls are wired only when their pane is part of the build. */
  const on=(q,ev,fn)=>{const n=$(q);if(n)n[ev]=fn;};
  on("#filterBooks","oninput",e=>renderTree(e.target.value));
  const tree=$("#fileTree");
  if(tree){
    wireGridKeys(tree,".ch-chip");
    /* Rows are reachable by Tab; Enter or Space toggles, and the arrow that
       points "inward" in the reading direction opens. */
    tree.addEventListener("keydown",e=>{
      const row=e.target.closest(".tree-row");
      if(!row)return;
      const item=row.parentElement,open=item.classList.contains("is-open");
      const inward=isRTL()?"ArrowLeft":"ArrowRight",outward=isRTL()?"ArrowRight":"ArrowLeft";
      if(e.key==="Enter"||e.key===" "||(e.key===inward&&!open)||(e.key===outward&&open)){
        e.preventDefault();row.click();
      }else if(e.key==="ArrowDown"&&open){
        const first=$(".tree-children [tabindex='0'],.tree-children .tree-row",item);
        if(first){e.preventDefault();first.focus();}
      }
    });
  }
  on("#collapseAll","onclick",()=>{
    treeOpen.books.clear();
    $$("#fileTree .tree-item").forEach(i=>i.classList.remove("is-open"));
    saveSession();
  });
  on("#searchBox","oninput",e=>runSearch(e.target.value));
  on("#clearMarks","onclick",()=>{
    if(!appStore.bookmarks.length)return;
    appStore.bookmarks=[];saveStore();renderBookmarks();toast(L("msg.cleared",{what:L("pane.marks")}));
  });
  on("#noteEditor","oninput",e=>{
    const key=e.target.dataset.key;if(!key)return;
    setChapterNote(key,e.target.value);
  });
  on("#noteEditor","onblur",()=>{renderBacklinks();if(state.mode==="reading")renderPanes();});

  $("#sbTheme").onclick=cycleTheme;
  $("#sbTranslation").onclick=()=>{
    const t=focusedTab();
    if(t&&t.float)openFloatTranslationPicker(t.id);
    else openTranslationPicker(0);
  };
  $("#sbLayout").onclick=cycleLayout;
  $("#sbStrongs").onclick=()=>{state.showStrongs=!state.showStrongs;renderAll();};
  $("#sbSync").onclick=()=>{state.syncScroll=!state.syncScroll;renderStatus();realign();
    toast(L("msg.state",{what:L("cmd.sync"),value:L(state.syncScroll?"val.on":"val.off")}));};

  /* One delegated handler for every reading surface, docked or floating. */
  $("#panes").addEventListener("click",onSurfaceClick);
  $("#floats").addEventListener("click",onSurfaceClick);
  $("#accentInput").addEventListener("input",e=>setAccent(e.target.value));
  document.addEventListener("click",e=>{
    if(!e.target.closest("#popover")&&!e.target.closest("[data-strongs]")&&!e.target.closest(".crumb"))$("#popover").hidden=true;
  });
  $("#modalScrim").onclick=e=>{if(e.target.id==="modalScrim")closeModal();};

  wireShell();
  wireSessionFlush();
  wireWindowFocus();
  wireSwipe();
  wireDrawerSwipe();
  $("#sheetScrim").onclick=closeVerseSheet;
  $("#sheetRows").addEventListener("click",e=>{
    const row=e.target.closest("[data-act]");
    if(!row||!sheetVerse)return;
    const node=sheetVerse;
    closeVerseSheet();
    verseAction(row.dataset.act,node);
  });
  wireNavScroll();
  wireNavPop();
  wireVerseBar();
  wireReadingPanel();
  realign=wireRowAlignment();
  wireTwinHover();
  wireResizers();
  applySidebarWidths();
  window.addEventListener("resize",applySidebarWidths);
  window.addEventListener("keydown",onKey);

}

function surfaceKey(node){
  const leaf=node&&node.closest?node.closest("[data-key]"):null;
  return leaf?leaf.dataset.key:activeKey();
}
function onSurfaceClick(e){
  const cr=e.target.closest(".crumb");
  if(cr){crumbAction(cr);return;}
  const td=e.target.closest("[data-textdir]");
  if(td){const id=td.dataset.textdir;setTextDir(id,textDir(id)==="rtl"?"ltr":"rtl");return;}
  if(e.target.closest("[data-study-add]")){
    selectSidebar("notes");
    const box=$("#noteEditor");if(box)box.focus();
    return;
  }
  const tb=e.target.closest(".tr-btn");
  if(tb){
    if(tb.dataset.float)openFloatTranslationPicker(+tb.dataset.float);
    else openTranslationPicker(+tb.dataset.pane);
    return;
  }
  const cl=e.target.closest("[data-close]");
  if(cl){closePane(+cl.dataset.close);return;}
  const link=e.target.closest(".wikilink");
  if(link){
    const host=e.target.closest("[data-float-id]");
    if(host)navigateFloat(+host.dataset.floatId,link.dataset.link);
    else openChapter(link.dataset.link);
    return;
  }
  const tag=e.target.closest(".tag-inline,[data-tag]");
  if(tag){searchFor(tag.dataset.tag);return;}
  const st=e.target.closest("[data-strongs]");
  if(st){showStrongsPopover(st);return;}
  const vn=e.target.closest(".vnum");
  if(vn){
    const verse=vn.closest(".verse");
    if(isTouchLayout())openVerseSheet(verse);
    else if(verseBar.node===verse)closeVerseBar(false);
    else openVerseBar(verse,false);
    return;
  }
  const ph=e.target.closest(".props-head");
  if(ph){
    const box=ph.parentElement;
    box.classList.toggle("is-collapsed");
    appStore.prefs.propsOpen=!box.classList.contains("is-collapsed");
    saveStore();
    $$(".props").forEach(p=>p.classList.toggle("is-collapsed",!appStore.prefs.propsOpen));
  }
}
function openFloatTranslationPicker(id){
  const tab=state.tabs.find(t=>t.id===id);
  if(!tab||!tab.float)return;
  openModal({
    placeholder:L("cmd.translation"),
    hint:tabLabel(tab),
    items:TRANSLATIONS.map(t=>({title:`${t.id} — ${t.name}`,id:t.id,
      icon:t.id===(tab.float.translation||state.panes[0])?"check":"book",
      sub:`${t.year} · ${langName(t.lang)||"?"} · ${t.note}${bibleDataStore[t.id]?"":" · "+L("hint.loadsOnUse")}`})),
    onPick:async t=>{
      try{await ensureTranslation(t.id);}
      catch(err){fail(L("err.load",{id:t.id,msg:err.message}));return;}
      tab.float.translation=t.id;
      renderAll();
    }
  });
  $("#modalInput").oninput=null;
}

/* The translation a verse was shown in: a parallel pane copies, reads and
   cards its own text, not the first pane's. */
const surfaceTranslation=node=>{
  const s=node&&node.closest?node.closest("[data-translation]"):null;
  return s?s.dataset.translation:state.translation;
};
function verseAction(act,node){
  const key=surfaceKey(node),verse=+node.dataset.verse,tr=surfaceTranslation(node);
  if(act==="mark")toggleHighlight(key,verse,node);
  else if(act==="bookmark")toggleBookmark(key,verse);
  else if(act==="copy")copyRef(node);
  else if(act==="link"){
    const url=passageLink(verse);
    navigator.clipboard.writeText(url)
      .then(()=>toast(L("msg.linkCopied")))
      .catch(()=>fail(L("err.clipboard")));
  }
  else if(act==="speak")speechStart(key,verse,tr);
  else if(act==="card")exportVerseCard(key,verse,tr);
}
function verseText(key,verse,tr=state.translation){
  const v=chapterVerses(key,tr);
  return v&&v[verse]?v[verse].replace(/\[[HG]\d+\]/g,""):"";
}
function copyRef(node){
  const key=surfaceKey(node),verse=+node.dataset.verse,tr=surfaceTranslation(node);
  const text=`${verseText(key,verse,tr)} — ${refOf(key,verse)} (${tr})`;
  navigator.clipboard.writeText(text)
    .then(()=>toast(L("msg.copied",{ref:refOf(key,verse)})))
    .catch(()=>fail(L("err.clipboard")));
}
function showStrongsPopover(node){
  const code=node.dataset.strongs,entry=STRONGS[code];
  const pop=$("#popover");
  if(!entry){fail(L("err.lexicon",{code}));return;}
  pop.className="popover";pop.onclick=null;
  pop.innerHTML=`<div class="pv-code">${esc(code)}</div>
    <div class="pv-lemma">${esc(entry.lemma)}</div>
    <div class="pv-tr">${esc(entry.tr)} · ${esc(entry.pos)}</div>
    <div>${esc(entry.gloss)}</div>`;
  pop.hidden=false;
  const r=node.getBoundingClientRect();
  const w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=Math.min(Math.max(8,r.left-w/2+r.width/2),innerWidth-w-8)+"px";
  pop.style.top=(r.top>h+16?r.top-h-10:r.bottom+10)+"px";
}

function onKey(e){
  const mod=e.ctrlKey||e.metaKey;
  if(modal.open){
    if(e.key==="Escape"){e.preventDefault();closeModal();}
    else if(e.key==="ArrowDown"){e.preventDefault();modal.sel=Math.min(modal.sel+1,modal.items.length-1);paintSel();}
    else if(e.key==="ArrowUp"){e.preventDefault();modal.sel=Math.max(modal.sel-1,0);paintSel();}
    else if(e.key==="Enter"){e.preventDefault();const it=modal.items[modal.sel];if(it)pickModal(it);}
    return;
  }
  if(e.key==="Escape"){
    if(!$("#popover").hidden){$("#popover").hidden=true;return;}
    if(!$("#navPop").hidden){closeNavPop(true);return;}
    if(!$("#verseBar").hidden){closeVerseBar(true);return;}
    if(composerIsOpen()&&$("#composer").contains(document.activeElement)){closeComposer();return;}
    if(state.ink)RIBBON.toggleInk();
    else if(speech.mode!=="idle"){speechStop();toast(L("msg.stopped"));}
    return;
  }
  const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(mod&&e.key.toLowerCase()==="o"){e.preventDefault();openQuickSwitcher();return;}
  if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();openCommandPalette();return;}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==="f"){e.preventDefault();RIBBON.focusSearch();return;}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==="e"){e.preventDefault();state.mode=state.mode==="reading"?"source":"reading";renderAll();return;}
  if(mod&&e.key.toLowerCase()==="g"){e.preventDefault();RIBBON.openGraph();return;}
  if(mod&&e.key.toLowerCase()==="\\"){e.preventDefault();e.shiftKey?closePane(state.panes.length-1):addPane();return;}
  if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();if(state.active)closeTab(state.active);return;}
  if(mod&&e.key==="`"){e.preventDefault();cycleWindows();return;}
  /* The reading text, not the browser's page zoom. */
  if(mod&&!e.altKey&&(e.key==="="||e.key==="+")){e.preventDefault();nudgeSize(1);return;}
  if(mod&&!e.altKey&&(e.key==="-"||e.key==="_")){e.preventDefault();nudgeSize(-1);return;}
  if(mod&&!e.altKey&&e.key==="0"){e.preventDefault();setReading({size:READING_DEFAULT.size});return;}
  if(!mod&&(e.key==="["||e.key==="]")){e.preventDefault();stepChapter(e.key==="]"?1:-1);}
}
function stepChapter(dir){
  const key=activeKey();if(!key)return;
  const book=bookOf(key);
  if(!book)return;
  const ch=+key.split(" ").pop()+dir;
  if(ch<1||ch>book.chapters){toast(L("ch.range",{book:bookName(book),n:book.chapters})+".");return;}
  openChapter(chapterKey(book.name,ch));
}

function wireResizers(){
  $$(".resizer").forEach(r=>{
    r.addEventListener("pointerdown",e=>{
      e.preventDefault();r.classList.add("dragging");r.setPointerCapture(e.pointerId);
      const side=r.dataset.side,startX=e.clientX;
      const el0=side==="left"?$("#sideL"):$("#sideR");
      const start=el0.getBoundingClientRect().width;
      const move=ev=>{
        const d=physicalSide(side)==="left"?ev.clientX-startX:startX-ev.clientX;
        const w=Math.max(180,Math.min(520,start+d));
        document.documentElement.style.setProperty(side==="left"?"--sidebar-l":"--sidebar-r",w+"px");
      };
      const up=()=>{
        r.classList.remove("dragging");
        window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
        const root=document.documentElement.style;
        storedWidths={
          l:root.getPropertyValue("--sidebar-l")||storedWidths.l,
          r:root.getPropertyValue("--sidebar-r")||storedWidths.r
        };
        saveSession();
      };
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    });
  });
}

<script>
"use strict";
/* ============================================================================
   11. OVERLAY VIEWS — graph and study canvas
   ========================================================================== */
let graphSim=null;

/* A blocked or unsupported 2d context should say so, not throw on first paint. */
function canvasUnavailable(host,what){
  const bar=$(".ov-bar",host);
  host.innerHTML="";
  if(bar)host.appendChild(bar);
  const state=el("div","state error");
  state.innerHTML=`${icon("alert")}
    <h3>${esc(L("state.drawFailed"))}</h3>
    <p>${esc(L("state.noCanvas",{what}))}</p>`;
  host.appendChild(state);
}

function buildOverlay(kind){
  if(kind==="notes")return buildNotesManager();
  if(DOC_VIEWS.includes(kind))return buildDoc(kind);
  const leaf=el("div","leaf");
  const ov=el("div","overlay-view");
  if(kind==="graph")buildGraph(ov);else buildBoard(ov);
  leaf.appendChild(ov);
  return leaf;
}

/* ============================================================================
   11b. LEARNING PAGES
   Rendered on the same note surface as scripture, so wikilinks, width and
   typography are the app's own. Anything that could fall out of step with the
   code is generated from the code instead of written down.
   ========================================================================== */
const kbd=s=>s.split(" ").map(k=>`<span class="kbd">${esc(k)}</span>`).join(" ");
const task=(ic,title,desc,keys,go)=>
  `<button class="task"${go?` data-go="${esc(go)}"`:""}>
     <span class="task-t">${icon(ic)}${esc(title)}</span>
     <span class="d">${desc}</span>
     ${keys?`<span>${kbd(keys)}</span>`:""}
   </button>`;

function buildDoc(kind){
  const leaf=el("div","leaf");
  leaf.dataset.role="doc";
  const scroll=el("div","leaf-scroll scroll");
  const note=el("div","note doc");
  note.innerHTML=
    kind==="help"?docHelp():
    kind==="shortcuts"?docShortcuts():
    kind==="selftest"?docSelfTest():docAbout();
  scroll.appendChild(note);
  leaf.appendChild(scroll);
  if(kind==="shortcuts")wireShortcutFilter(note);
  leaf.addEventListener("click",e=>{
    const t=e.target.closest("[data-go]");
    if(!t)return;
    const go=t.dataset.go;
    if(go.startsWith("cmd:")){runCommand(go.slice(4));return;}
    if(go.startsWith("open:"))openChapter(go.slice(5));
    else openView(go);
  });
  return leaf;
}

function docHelp(){
  /* Task titles are the command labels themselves, so a renamed command
     renames its card too. */
  const link=k=>`<a class="wikilink" data-link="${esc(k)}">${esc(k)}</a>`;
  const aboutBtn=`<button class="task" data-go="about" style="display:inline-flex;padding:2px 8px;vertical-align:middle">
    <span class="task-t">${icon("info")}${esc(L("view.about"))}</span></button>`;
  return `<h1 class="inline-title">${esc(L("view.help"))}</h1>
  <div class="note-sub">${esc(L("app.name"))} · ${esc(L("app.tagline"))}</div>
  <p class="doc-lede">${L("doc.help.lede")}</p>

  <div class="doc-h">${L("doc.help.start")}</div>
  <div class="task-grid">
    ${task("book-open",L("cmd.switcher"),L("doc.t.switcher"),KEYS.switcher,"cmd:switcher")}
    ${task("cmd",L("cmd.palette"),L("doc.t.palette"),KEYS.palette,"cmd:palette")}
    ${task("add-pane",L("cmd.parallel"),L("doc.t.parallel"),KEYS.parallel,"cmd:parallel")}
    ${paneOn("search")?task("search",L("pane.search"),L("doc.t.search"),KEYS.search,"cmd:pane.search"):""}
    ${task("graph",L("view.graph"),L("doc.t.graph"),KEYS.graph,"graph")}
    ${task("audio",L("cmd.read"),L("doc.t.read"),"","cmd:read")}
    ${paneOn("plan")?task("calendar",L("pane.plan"),L("doc.t.plan"),"","cmd:pane.plan"):""}
  </div>

  <div class="doc-h">${L("doc.help.passage")}</div>
  <p class="doc-p">${L("doc.help.passage1")}</p>
  <p class="doc-p">${L("doc.help.passage2",{psalm:link("Psalms 23"),john:link("John 3")})}</p>

  <div class="doc-h">${L("doc.help.arrange")}</div>
  <p class="doc-p">${L("doc.help.arrange1")}</p>
  <p class="doc-p">${L("doc.help.arrange2")}</p>

  <div class="doc-h">${L("doc.help.data")}</div>
  <p class="doc-p">${L("doc.help.data1",{about:aboutBtn})}</p>`;
}

/* The table is built from the same list that binds the keys, so it cannot
   describe a shortcut the app does not have. */
function docShortcuts(){
  const fromCommands=commandList().filter(c=>c.kbd).map(c=>({k:c.kbd,a:c.title}));
  const extras=[
    {k:"Esc",a:L("doc.keys.esc")},
    {k:"↑ ↓",a:L("doc.keys.arrows")},
    {k:"↵",a:L("doc.keys.enter")},
    {k:L("doc.keys.mid"),a:L("cmd.closeTab")},
    {k:L("doc.keys.right"),a:L("doc.keys.rightAudio")},
    {k:L("doc.keys.dbl"),a:L("doc.keys.dblBoard")}

function wireShortcutFilter(note){
  const input=$("#keyFilter",note);
  if(!input)return;
  input.oninput=()=>{
    const q=input.value.trim().toLowerCase();
    let shown=0;
    $$(".key-row",note).forEach(r=>{
      const hit=!q||r.dataset.t.includes(q);
      r.hidden=!hit;

/* One detached page per translation that has text, for checks that must not
   depend on which tab happens to be open. */

  for(const l of sampleLeaves()){
    l.style.cssText="position:fixed;left:40px;top:80px;width:640px;height:420px;visibility:hidden;pointer-events:none";
    document.body.appendChild(l);
    let out;
    try{out=check(l);}finally{l.remove();}
    if(out)return out;
  }
  return "";
}

  return TRANSLATIONS.filter(t=>bibleDataStore[t.id]&&Object.keys(bibleDataStore[t.id]).length).map(t=>{
    const key=Object.keys(bibleDataStore[t.id])[0];

  });

/* ---- force-directed graph ------------------------------------------------ */
function buildGraph(host){
  host.innerHTML=`<div class="ov-bar">
      <span class="ov-hint">${esc(L("hint.graph"))}</span>
      <span class="spacer"></span>
      <label>${esc(L("lbl.link"))} <input type="range" id="gLink" min="20" max="220" value="110"></label>
      <label>${esc(L("lbl.repel"))} <input type="range" id="gRep" min="200" max="4000" value="1400"></label>
      <span class="ov-sep"></span>
      <button class="ov-act" id="gReset">${icon("undo")}${esc(L("cmd.recentre"))}</button>
    </div>
    <canvas class="graph"></canvas>`;
  const canvas=$("canvas",host);

  const nodes=[],edges=[];
  const index=new Map();
  const add=key=>{
    if(index.has(key))return index.get(key);
    const n={key,x:0,y:0,vx:0,vy:0,deg:0,mine:false};
    index.set(key,n);nodes.push(n);return n;
  };
  Object.keys(CHAPTER_META).forEach(add);
  Object.keys(CHAPTER_META).forEach(k=>{
    (CHAPTER_META[k].refs||[]).forEach(r=>{
      const a=index.get(k),b=add(r);
      if(edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))return;
      edges.push({a,b});a.deg++;b.deg++;
    });
  });
  appStore.notes.forEach(n=>{
    const text=n.body;if(!text)return;
    const a=add(n.chapter||noteTitle(n));a.mine=true;
    [...text.matchAll(/\[\[([^\]|]+?)(?:\|[^\]]+)?\]\]/g)].forEach(m=>{
      const b=add(m[1].replace(/\.md$/,""));
      edges.push({a,b,mine:true});a.deg++;b.deg++;
    });
  });
  const R=Math.min(220,40+nodes.length*9);
  nodes.forEach((n,i)=>{
    const t=(i/nodes.length)*Math.PI*2;
    n.x=Math.cos(t)*R;n.y=Math.sin(t)*R;
  });

  const ctx=canvas.getContext("2d");
  if(!ctx){canvasUnavailable(host,L("view.graph"));return;}
  let dpr=1,W=0,H=0,drag=null,hover=null,alpha=1;
  const cam={x:0,y:0,z:1};
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function resize(){
    if(!canvas.isConnected){window.removeEventListener("resize",resize);return;}
    dpr=Math.min(2,window.devicePixelRatio||1);
    const r=canvas.getBoundingClientRect();
    W=r.width;H=r.height;
    canvas.width=W*dpr;canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function step(){
    const link=+$("#gLink",host).value,rep=+$("#gRep",host).value;
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy||0.01;
        const f=rep/d2;
        const d=Math.sqrt(d2);
        a.vx-=f*dx/d;a.vy-=f*dy/d;b.vx+=f*dx/d;b.vy+=f*dy/d;
      }
      a.vx-=a.x*0.004;a.vy-=a.y*0.004;
    }
    edges.forEach(e=>{
      const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y;
      const d=Math.hypot(dx,dy)||0.01;
      const f=(d-link)*0.02;
      e.a.vx+=f*dx/d;e.a.vy+=f*dy/d;e.b.vx-=f*dx/d;e.b.vy-=f*dy/d;
    });
    nodes.forEach(n=>{
      if(drag&&drag.node===n)return;
      n.vx*=0.82;n.vy*=0.82;n.x+=n.vx*alpha;n.y+=n.vy*alpha;
    });
    alpha*=0.994;
  }
  const radius=n=>6+Math.min(9,n.deg*1.6);
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(W/2+cam.x,H/2+cam.y);
    ctx.lineWidth=1;
    edges.forEach(e=>{
      const hot=hover&&(e.a===hover||e.b===hover);
      ctx.strokeStyle=hot?css("--accent-1"):css("--graph-edge");
      ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();
    });
    const current=activeKey();
    nodes.forEach(n=>{
      const r=radius(n);
      const isCur=n.key===current;
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);
      ctx.fillStyle=isCur?css("--accent"):n.mine?css("--c-cyan"):hover===n?css("--accent-2"):css("--graph-node");
      ctx.fill();
      if(isCur||hover===n){ctx.lineWidth=2;ctx.strokeStyle=css("--accent-2");ctx.stroke();ctx.lineWidth=1;}
      if(n.deg>1||hover===n||isCur){
        ctx.fillStyle=hover===n||isCur?css("--text-normal"):css("--graph-label");
        ctx.font="11px system-ui, sans-serif";
        ctx.textAlign="center";
        ctx.fillText(n.key,n.x,n.y+r+13);
      }
    });
    ctx.restore();
  }
  function loop(){
    /* The simulation stops the moment its canvas leaves the document, so a
       background tab never burns a frame budget. */
    if(!canvas.isConnected){graphSim=null;return;}
    if(alpha>0.002||drag)step();
    draw();
    graphSim=requestAnimationFrame(loop);
  }
  const at=(cx,cy)=>{
    const r=canvas.getBoundingClientRect();
    const x=cx-r.left-W/2-cam.x,y=cy-r.top-H/2-cam.y;
    return nodes.find(n=>Math.hypot(n.x-x,n.y-y)<radius(n)+6);
  };
  canvas.addEventListener("pointerdown",e=>{
    const n=at(e.clientX,e.clientY);
    const r=canvas.getBoundingClientRect();
    drag=n?{node:n,moved:false}:{pan:true,sx:e.clientX-cam.x,sy:e.clientY-cam.y};
    if(n)alpha=Math.max(alpha,.35);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    const r=canvas.getBoundingClientRect();
    if(drag&&drag.node){
      drag.node.x=e.clientX-r.left-W/2-cam.x;
      drag.node.y=e.clientY-r.top-H/2-cam.y;
      drag.moved=true;alpha=Math.max(alpha,.25);
    }else if(drag&&drag.pan){
      cam.x=e.clientX-drag.sx;cam.y=e.clientY-drag.sy;
    }else{
      const h=at(e.clientX,e.clientY);
      if(h!==hover){hover=h;canvas.style.cursor=h?"pointer":"grab";}
    }
  });
  canvas.addEventListener("pointerup",e=>{
    if(drag&&drag.node&&!drag.moved&&bookOf(drag.node.key))openChapter(drag.node.key);
    drag=null;
  });
  $("#gReset",host).onclick=()=>{cam.x=0;cam.y=0;alpha=1;};
  window.addEventListener("resize",resize);
  requestAnimationFrame(()=>{resize();cancelAnimationFrame(graphSim);loop();});
}

/* ---- study canvas (.canvas board) ---------------------------------------- */
const CARD_COLORS=["#7c3aed","#e9973f","#44cf6e","#53dfdd","#fa99cd"];
function buildBoard(host){
  host.innerHTML=`<div class="ov-bar">
      <span class="ov-hint">${esc(L("hint.board"))}</span>
      <span class="spacer"></span>
      <span class="ov-count" id="bCount"></span>
      <span class="ov-sep"></span>
      <button class="ov-act" id="bAdd">${icon("plus")}${esc(L("cmd.addCard"))}</button>
      <button class="ov-act" id="bClear">${icon("trash")}${esc(L("cmd.clear"))}</button>
    </div>
    <canvas class="board"></canvas>`;
  const canvas=$("canvas",host),ctx=canvas.getContext("2d");
  if(!ctx){canvasUnavailable(host,L("view.board"));return;}
  const cards=appStore.board.cards;
  let dpr=1,W=0,H=0,drag=null,sel=null;
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function resize(){
    if(!canvas.isConnected){window.removeEventListener("resize",resize);return;}
    dpr=Math.min(2,window.devicePixelRatio||1);
    const r=canvas.getBoundingClientRect();W=r.width;H=r.height;
    canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();
  }
  function wrap(text,width,size){
    ctx.font=`${size}px system-ui, sans-serif`;
    const words=String(text).split(/\s+/),lines=[];let line="";
    for(const w of words){
      const t=line?line+" "+w:w;
      if(ctx.measureText(t).width>width&&line){lines.push(line);line=w;}else line=t;
    }
    if(line)lines.push(line);
    return lines;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=css("--ink-canvas");ctx.lineWidth=1;
    for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    cards.forEach(c=>{
      ctx.fillStyle=css("--card-face");
      ctx.strokeStyle=c===sel?css("--accent-1"):css("--card-edge");
      ctx.lineWidth=c===sel?2:1;
      roundRect(ctx,c.x,c.y,c.w,c.h,10);ctx.fill();ctx.stroke();
      ctx.fillStyle=c.color||CARD_COLORS[0];
      roundRect(ctx,c.x,c.y,4,c.h,2);ctx.fill();
      ctx.fillStyle=css("--text-faint");
      ctx.font="600 11px system-ui, sans-serif";
      ctx.textAlign="left";
      ctx.fillText(c.title||L("lbl.untitled"),c.x+14,c.y+20);
      ctx.fillStyle=css("--text-normal");
      ctx.font="13px system-ui, sans-serif";
      wrap(c.text,c.w-28,13).slice(0,Math.floor((c.h-34)/19)).forEach((l,i)=>{
        ctx.fillText(l,c.x+14,c.y+40+i*19);
      });
    });
    if(!cards.length){
      ctx.fillStyle=css("--text-faint");ctx.textAlign="center";
      ctx.font="14px system-ui, sans-serif";
      ctx.fillText(L("hint.boardEmpty"),W/2,H/2);
    }
  }
  const hit=(x,y)=>[...cards].reverse().find(c=>x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h);
  const pos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};

  canvas.addEventListener("pointerdown",e=>{
    const p=pos(e),c=hit(p.x,p.y);
    sel=c||null;
    if(c)drag={c,dx:p.x-c.x,dy:p.y-c.y};
    canvas.setPointerCapture(e.pointerId);draw();
  });
  canvas.addEventListener("pointermove",e=>{
    if(!drag)return;
    const p=pos(e);
    drag.c.x=Math.round(p.x-drag.dx);drag.c.y=Math.round(p.y-drag.dy);
    draw();
  });
  canvas.addEventListener("pointerup",()=>{if(drag){saveStore();drag=null;}});
  canvas.addEventListener("dblclick",e=>{
    const p=pos(e),c=hit(p.x,p.y);
    if(c){
      const text=prompt(L("ask.cardText"),c.text);
      if(text!==null){c.text=text;saveStore();draw();}
      return;
    }
    addCard({title:activeKey()||L("lbl.untitled"),text:"",x:p.x-110,y:p.y-60});
  });
  window.addEventListener("keydown",function onDel(ev){
    if(!canvas.isConnected){window.removeEventListener("keydown",onDel);return;}
    if((ev.key==="Delete"||ev.key==="Backspace")&&sel&&!/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)){
      cards.splice(cards.indexOf(sel),1);sel=null;saveStore();draw();paintCount();
    }
  });
  function addCard(part){
    const c=Object.assign({w:220,h:130,color:CARD_COLORS[cards.length%CARD_COLORS.length]},part);
    cards.push(c);saveStore();draw();paintCount();
  }
  function paintCount(){
    const n=$("#bCount",host);
    if(n)n.textContent=L("lbl.cards",{n:cards.length});
  }
  $("#bAdd",host).onclick=()=>{
    const key=activeKey();
    if(!key){fail(L("err.needChapter"));return;}
    const vs=chapterVerses(key)||{};
    const first=Object.keys(vs)[0];
    addCard({title:`${key}:${first}`,text:verseText(key,+first),x:40+cards.length*24,y:40+cards.length*18});
  };
  $("#bClear",host).onclick=()=>{
    if(!cards.length)return;
    cards.length=0;sel=null;saveStore();draw();paintCount();toast(L("msg.cleared",{what:L("view.board")}));
  };
  window.addEventListener("resize",resize);
  paintCount();
  requestAnimationFrame(resize);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ============================================================================
   11c. NOTE MARKDOWN
   Block level only; inline() is shared with the chapter renderer so wikilinks,
   tags and Strong's behave the same in a note as in scripture.
   ========================================================================== */
function renderNoteMarkdown(md){
  const lines=String(md||"").split("\n");
  const out=[];
  let list=null,inCode=false,code=[];
  const closeList=()=>{if(list){out.push(`</${list}>`);list=null;}};
  for(const raw of lines){
    const line=raw.replace(/\s+$/,"");
    if(/^```/.test(line)){
      if(inCode){out.push(`<pre class="md-code">${esc(code.join("\n"))}</pre>`);code=[];inCode=false;}
      else{closeList();inCode=true;}
      continue;
    }
    if(inCode){code.push(raw);continue;}
    if(!line.trim()){closeList();continue;}
    if(/^(-{3,}|\*{3,})$/.test(line)){closeList();out.push('<hr class="md-hr">');continue;}
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      closeList();
      const lvl=h[1].length;
      out.push(`<div class="md-h md-h${lvl}">${inline(h[2])}</div>`);
      continue;
    }
    const ul=line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){
      if(list!=="ul"){closeList();out.push('<ul class="md-ul">');list="ul";}
      out.push(`<li>${inline(ul[1])}</li>`);continue;
    }
    const ol=line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(ol){
      if(list!=="ol"){closeList();out.push('<ol class="md-ol">');list="ol";}
      out.push(`<li>${inline(ol[1])}</li>`);continue;
    }
    if(line.startsWith("> ")){closeList();out.push(`<div class="md-quote">${inline(line.slice(2))}</div>`);continue;}
    closeList();
    out.push(`<p class="md-p">${inline(line)}</p>`);
  }
  if(inCode)out.push(`<pre class="md-code">${esc(code.join("\n"))}</pre>`);
  closeList();
  return out.join("");
}

/* ============================================================================
   11d. COMPOSER WINDOW
   A floating window rather than a modal: preparing a passage means reading and
   writing at once, so it must never block the workspace behind it.
   ========================================================================== */
const composer={id:null};
const CW_DEFAULT={x:null,y:null,w:560,h:480,max:false,mode:"split",split:.5};
const composerIsOpen=()=>!$("#composer").hidden;
const composerRect=()=>Object.assign({},CW_DEFAULT,appStore.prefs.composer||{});
function saveComposerRect(patch){
  appStore.prefs.composer=Object.assign(composerRect(),patch);
  saveStore();
}
/* Relative times come from Intl, in the reader's language, with no strings. */
const relFmt=(()=>{try{return new Intl.RelativeTimeFormat(LOCALE,{numeric:"auto",style:"short"});}catch(e){return null;}})();
function relTime(t){
  if(!t)return "—";
  const s=Math.round((t-Date.now())/1000);
  if(!relFmt)return new Date(t).toLocaleString(LOCALE);
  if(Math.abs(s)<45)return relFmt.format(0,"second");
  if(Math.abs(s)<3600)return relFmt.format(Math.round(s/60),"minute");
  if(Math.abs(s)<86400)return relFmt.format(Math.round(s/3600),"hour");
  return new Date(t).toLocaleDateString(LOCALE);
}
function downloadText(name,text,type){
  const blob=new Blob([text],{type:type||"text/markdown"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function noteHeadings(body,max){
  const list=String(body||"").split("\n")
    .map(l=>l.match(/^(#{1,4})\s+(.+)$/))
    .filter(Boolean)
    .map(m=>m[2].replace(/[*`_\[\]]/g,"").trim())
    .filter(Boolean);
  return max?list.slice(0,max):list;
}
/* An unnamed note stores an empty title and shows the placeholder, so the
   stored data never depends on the language it was written in. Notes saved by
   older builds carry the English placeholder; they count as unnamed too. */
const LEGACY_UNTITLED="Untitled note";
const isUnnamed=t=>{const x=String(t||"").trim();return !x||x===LEGACY_UNTITLED;};
const noteTitle=n=>isUnnamed(n&&n.title)?L("lbl.untitled"):n.title;
/* A note that has never been named takes its first heading, or failing that its
   opening line, so naming is never a step you have to remember. */
function autoTitleFromBody(){
  const n=noteById(composer.id);
  if(!n)return;
  if(!isUnnamed(n.title))return;
  let next=noteHeadings(n.body,1)[0];
  if(!next){
    const first=String(n.body||"").split("\n").find(l=>l.trim());
    if(first)next=first.replace(/^[>\-*+\s]*(\d+[.)]\s*)?/,"").replace(/[*`_#]/g,"").trim();
  }
  if(!next)return;
  updateNote(n.id,{title:next.slice(0,60)});
  $("#cwTitle").value=noteById(composer.id).title;
  paintComposerMeta();refreshNotesTab();
}
const safeName=s=>String(s||"note").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").slice(0,60)||"note";
function noteToMarkdown(n){
  return ["---",`id: ${n.id}`,`title: ${noteTitle(n)}`,
    `chapter: ${n.chapter||""}`,`updated: ${new Date(n.updated||Date.now()).toISOString()}`,
    "---","",String(n.body||"")].join("\n");
}

function applyComposerRect(){
  const win=$("#composer"),r=composerRect();
  if(isTouchLayout()){
    /* The stylesheet pins the window on a phone; leave the stored rect alone
       so the desktop geometry is still there when the window widens again. */
    win.dataset.max="0";
    win.dataset.mode=r.mode==="split"?"write":(r.mode||"write");
    $$("#cwModes button").forEach(b=>b.classList.toggle("is-on",b.dataset.mode===win.dataset.mode));
    $("#cwMax").innerHTML=icon("maxsq");
    applyComposerSplit(r.split);
    return;
  }
  const w=Math.min(r.w,Math.max(360,innerWidth-16));
  const h=Math.min(r.h,Math.max(260,innerHeight-70));
  const x=r.x==null?Math.max(8,innerWidth-w-26):Math.min(Math.max(0,r.x),Math.max(0,innerWidth-140));
  const y=r.y==null?Math.max(8,Math.round(innerHeight*0.16)):Math.min(Math.max(0,r.y),Math.max(0,innerHeight-90));
  win.style.width=w+"px";win.style.height=h+"px";win.style.left=x+"px";win.style.top=y+"px";
  win.dataset.max=r.max?"1":"0";
  win.dataset.mode=r.mode||"split";
  $$("#cwModes button").forEach(b=>b.classList.toggle("is-on",b.dataset.mode===win.dataset.mode));
  $("#cwMax").innerHTML=icon(r.max?"minimize":"maxsq");
  setLabel($("#cwMax"),L(r.max?"cmd.restore":"cmd.maximise"));
  $("#cwMax").setAttribute("aria-pressed",String(!!r.max));
  applyComposerSplit(r.split);
}
/* Grow factors summing below 1 leave free space undistributed, so a lone
   visible pane would fill only its share. The ratio applies in split mode only. */
function applyComposerSplit(ratio){
  const v=Math.min(.85,Math.max(.15,Number(ratio)||.5));
  const write=$(".cw-write"),preview=$("#cwPreview");
  if(!write||!preview)return v;
  if($("#composer").dataset.mode!=="split"){
    write.style.flex="1 1 0%";
    preview.style.flex="1 1 0%";
    return v;
  }
  write.style.flex=`${v} 1 0%`;
  preview.style.flex=`${1-v} 1 0%`;
  return v;
}
/* Opening with no id resumes the note edited most recently. */

let metaTimer=null;
function paintComposerMeta(flash){

function refreshNotesTab(){

/* ---- editing aids -------------------------------------------------------- */
function cwInsert(text,caretOffset){
  const ta=$("#cwText");
  if(!ta)return;
  const s=ta.selectionStart==null?ta.value.length:ta.selectionStart;
  const e=ta.selectionEnd==null?s:ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  const pos=s+(caretOffset==null?text.length:caretOffset);
  try{ta.setSelectionRange(pos,pos);}catch(err){}
  ta.dispatchEvent(new Event("input",{bubbles:true}));
  ta.focus();
}
function cwWrap(mark){
  const ta=$("#cwText");
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.slice(s,e);
  ta.value=ta.value.slice(0,s)+mark+sel+mark+ta.value.slice(e);
  const pos=sel?s+mark.length*2+sel.length:s+mark.length;
  try{ta.setSelectionRange(sel?s+mark.length:pos,sel?pos-mark.length:pos);}catch(err){}
  ta.dispatchEvent(new Event("input",{bubbles:true}));
  ta.focus();
}
function cwDropLine(ta,lineStart,caret){
  ta.value=ta.value.slice(0,lineStart)+ta.value.slice(caret);
  try{ta.setSelectionRange(lineStart,lineStart);}catch(err){}
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}
/* Enter continues a list or a quote, and clears the marker on an empty item —
   the behaviour that separates a Markdown editor from a plain textarea. */
function cwKeydown(e){
  const ta=e.target;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="b"){e.preventDefault();cwWrap("**");return;}
  if(mod&&e.key.toLowerCase()==="i"){e.preventDefault();cwWrap("*");return;}
  if(e.key==="Tab"){e.preventDefault();cwInsert("  ");return;}
  if(e.key!=="Enter"||e.shiftKey||mod)return;
  const caret=ta.selectionStart;
  if(caret!==ta.selectionEnd)return;
  const lineStart=ta.value.lastIndexOf("\n",caret-1)+1;
  const line=ta.value.slice(lineStart,caret);
  const item=line.match(/^(\s*)(?:([-*+])|(\d+)([.)]))\s+(.*)$/);
  if(item){
    e.preventDefault();
    if(!item[5].trim()){cwDropLine(ta,lineStart,caret);return;}
    cwInsert("\n"+(item[2]?`${item[1]}${item[2]} `:`${item[1]}${Number(item[3])+1}${item[4]} `));
    return;
  }
  const quote=line.match(/^(\s*)>\s?(.*)$/);
  if(quote){
    e.preventDefault();
    if(!quote[2].trim()){cwDropLine(ta,lineStart,caret);return;}
    cwInsert("\n"+quote[1]+"> ");
  }
}

function wireComposer(){
  const win=$("#composer");
  $("#cwText").addEventListener("keydown",cwKeydown);

  $("#cwTitle").addEventListener("input",e=>{
    if(!composer.id)return;
    updateNote(composer.id,{title:e.target.value.trim()});
    paintComposerMeta();
  });
  $("#cwTitle").addEventListener("blur",refreshNotesTab);
  $("#cwText").addEventListener("input",e=>{
    if(!composer.id)return;
    const n=noteById(composer.id);
    if(!n)return;

    if(n.chapter)setChapterNote(n.chapter,e.target.value);

  });
  $("#cwText").addEventListener("blur",()=>{autoTitleFromBody();refreshNotesTab();renderBacklinks();});

  $("#cwModes").addEventListener("click",e=>{
    const b=e.target.closest("[data-mode]");
    if(!b)return;
    saveComposerRect({mode:b.dataset.mode});

  });
  $("#cwMax").onclick=()=>{saveComposerRect({max:!composerRect().max});applyComposerRect();};
  $("#cwClose").onclick=closeComposer;
  /* Everything optional lives behind one menu so the form keeps the space. */
  $("#cwMenu").onclick=()=>{
    const n=noteById(composer.id);
    const items=[
      {title:L("cmd.newNote"),icon:"plus",act:"new"},
      {title:L("cmd.switchNote"),icon:"notes",act:"switch"},
      {title:L("cmd.export"),icon:"download",act:"export"},
      {title:L("view.notes"),icon:"notes",act:"manage"}
    ];
    const open=activeKey();
    if(open)items.splice(1,0,
      {title:L("cmd.insertLink",{key:displayKey(open)}),icon:"link",act:"link"},
      {title:L("cmd.insertVerses",{key:displayKey(open)}),icon:"quote",act:"verses"});
    if(n&&!n.chapter)items.push({title:L("cmd.delete"),icon:"trash",act:"delete"});
    if(n&&n.chapter)items.push({title:L("cmd.openKey",{key:displayKey(n.chapter)}),icon:"book",act:"chapter"});
    openModal({placeholder:L("cmd.more"),hint:n?n.id:"",items,onPick:it=>composerAction(it.act)});
    $("#modalInput").oninput=null;
  };
  function composerAction(act){
    const n=noteById(composer.id);
    if(act==="new"){
      const fresh=createNote({title:""});
      composer.id=fresh.id;paintComposer();refreshNotesTab();
      $("#cwTitle").focus();$("#cwTitle").select();
      return;
    }
    if(act==="switch"){
      const notes=[...appStore.notes].sort((a,b)=>(b.updated||0)-(a.updated||0));
      if(!notes.length){toast(L("empty.notes"));return;}
      openModal({
        placeholder:L("cmd.switchNote"),
        hint:L("lbl.notes",{n:notes.length}),
        items:notes.map(x=>({title:noteTitle(x),icon:x.chapter?"book":"note",id:x.id,
          sub:`${x.id} · ${x.chapter?x.chapter+" · ":""}${L("lbl.words",{n:noteWords(x)})} · ${relTime(x.updated)}`})),
        onPick:it=>{composer.id=it.id;paintComposer();}
      });
      $("#modalInput").oninput=null;
      return;
    }
    if(act==="export"){
      if(!n){fail(L("empty.notes"));return;}
      downloadText(`${safeName(noteTitle(n))}.md`,noteToMarkdown(n));
      toast(L("msg.exported",{n:1}));
      return;
    }
    if(act==="link"){
      const k=activeKey();
      if(k)cwInsert(`[[${k}]] `);
      return;
    }
    if(act==="verses"){
      const k=activeKey();
      const vs=k?chapterVerses(k):null;
      if(!vs){fail(L("err.needChapter"));return;}
      const marked=Object.keys(vs).map(Number).sort((a,b)=>a-b)
        .filter(v=>appStore.highlights[`${k}|${v}`]);
      if(!marked.length){fail(L("err.noHighlights",{key:k}));return;}
      const block=marked.map(v=>`> **${v}** ${verseText(k,v)}`).join("\n")+
        `\n>\n> — [[${k}]] (${state.translation})\n\n`;
      cwInsert(block);
      toast(L("msg.inserted",{n:marked.length}));
      return;
    }
    if(act==="manage"){openView("notes");return;}
    if(act==="chapter"&&n&&n.chapter){openChapter(n.chapter);return;}
    if(act==="delete"&&n){
      if(!confirm(L("ask.deleteNote",{title:noteTitle(n)})))return;
      deleteNote(n.id);
      composer.id=(recentNote()||{}).id||null;
      paintComposer();refreshNotesTab();
      toast(L("msg.deleted",{what:noteTitle(n)}));
    }
  }

  /* The whole bar drags, title included. A press that never travels is a click,
     so the title still edits; once it has focus, dragging selects text instead. */
  $("#cwBar").addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    const bar=$("#cwBar"),title=$("#cwTitle");
    const onTitle=e.target===title;
    if(onTitle&&document.activeElement===title)return;
    if(composerRect().max){
      if(onTitle){title.focus();title.select();}
      return;
    }
    const r=win.getBoundingClientRect();
    const ox=e.clientX-r.left,oy=e.clientY-r.top;
    const sx=e.clientX,sy=e.clientY;
    let moved=false;
    try{bar.setPointerCapture(e.pointerId);}catch(err){}
    const move=ev=>{
      if(!moved){
        if(Math.abs(ev.clientX-sx)<3&&Math.abs(ev.clientY-sy)<3)return;
        moved=true;bar.classList.add("is-dragging");
      }
      const x=Math.min(Math.max(0,ev.clientX-ox),Math.max(0,innerWidth-120));
      const y=Math.min(Math.max(0,ev.clientY-oy),Math.max(0,innerHeight-60));
      win.style.left=x+"px";win.style.top=y+"px";
    };
    const up=()=>{
      bar.classList.remove("is-dragging");
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
      if(!moved){
        if(onTitle){title.focus();title.select();}
        return;
      }
      saveComposerRect({x:parseInt(win.style.left,10),y:parseInt(win.style.top,10)});
    };
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  });

  /* Split mode is only useful while the halves stay together. */
  (function syncPanes(){
    const ta=$("#cwText"),pv=$("#cwPreview");
    let lock=false;
    const link=(from,to)=>from.addEventListener("scroll",()=>{
      if(lock||$("#composer").dataset.mode!=="split")return;
      const fh=from.scrollHeight-from.clientHeight;
      const th=to.scrollHeight-to.clientHeight;
      if(fh<=0||th<=0)return;
      lock=true;
      to.scrollTop=Math.round(from.scrollTop/fh*th);
      requestAnimationFrame(()=>{lock=false;});
    },{passive:true});
    link(ta,pv);link(pv,ta);
  })();

  /* the seam between writing and preview */
  $("#cwSplit").addEventListener("pointerdown",e=>{
    e.preventDefault();
    const seam=$("#cwSplit"),body=$(".cw-body");
    const rect=body.getBoundingClientRect();
    seam.classList.add("dragging");
    try{seam.setPointerCapture(e.pointerId);}catch(err){}
    let ratio=composerRect().split;
    const move=ev=>{
      /* The ratio is the writing side's share, and writing comes first in reading order. */
      const along=isRTL()?rect.right-ev.clientX:ev.clientX-rect.left;
      ratio=applyComposerSplit(along/Math.max(1,rect.width));
    };
    const up=()=>{
      seam.classList.remove("dragging");
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
      saveComposerRect({split:ratio});
    };
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  });
  $("#cwSplit").addEventListener("dblclick",()=>{
    saveComposerRect({split:.5});applyComposerSplit(.5);
  });

  /* resize from the right edge, bottom edge or corner */
  $$(".cw-resize",win).forEach(h=>{
    h.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const dir=h.dataset.dir;
      const r=win.getBoundingClientRect();
      const sx=e.clientX,sy=e.clientY;
      try{h.setPointerCapture(e.pointerId);}catch(err){}
      const move=ev=>{
        if(dir.includes("e"))win.style.width=Math.max(360,Math.min(r.width+ev.clientX-sx,innerWidth-r.left-4))+"px";
        if(dir.includes("s"))win.style.height=Math.max(260,Math.min(r.height+ev.clientY-sy,innerHeight-r.top-4))+"px";
      };
      const up=()=>{
        window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
        saveComposerRect({w:win.offsetWidth,h:win.offsetHeight});
      };
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    });
  });
}
