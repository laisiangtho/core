/* ============================================================================
   1c. WINDOW SHELL — frameless Electron, absent in a browser
   ========================================================================== */
const appShell=window.appShell||null;
function wireShell(){
  const forced=location.search.includes("frameless");
  if(!appShell&&!forced){document.body.dataset.shell="off";return;}
  document.body.dataset.shell="on";
  if(appShell&&appShell.platform)document.body.dataset.platform=appShell.platform;

  const call=(name,label)=>{
    if(!appShell||typeof appShell[name]!=="function"){
      fail(`The window bridge does not expose ${name}(). Check the Electron preload.`);return;   // developer-facing
    }
    try{
      const r=appShell[name]();
      if(r&&typeof r.catch==="function")r.catch(e=>fail(L("err.window",{action:label,msg:e.message})));
    }catch(e){fail(L("err.window",{action:label,msg:e.message}));}
  };
  $("#winMin").onclick=()=>call("minimize","minimise");
  $("#winMax").onclick=()=>call("toggleMaximize","maximise");
  $("#winClose").onclick=()=>call("close","close");
  /* Double-click anywhere on the band that is not a control. */
  $$(".band-drag").forEach(bar=>bar.addEventListener("dblclick",e=>{
    if(!e.target.closest("button")&&!e.target.closest(".tab"))call("toggleMaximize","maximise");
  }));
  if(appShell&&appShell.onMaximizeChange)appShell.onMaximizeChange(setMaximisedIcon);
  if(appShell&&appShell.isMaximized){
    Promise.resolve(appShell.isMaximized()).then(setMaximisedIcon).catch(()=>{});
  }
}
function setMaximisedIcon(isMax){
  const b=$("#winMax");if(!b)return;
  b.innerHTML=icon(isMax?"restore":"maxsq");
  setLabel(b,L(isMax?"cmd.restore":"cmd.maximise"));
}

/* ============================================================================
   2. STATE
   ========================================================================== */
const state={
  panes:["KJV"],           // one translation per parallel pane, left to right
  paneSizes:[1],           // flex-grow per pane, adjusted by the dividers
  compareWith:"ASV",       // translation used when a new pane is opened
  mode:"reading",          // reading | source
  tabs:[],                 // [{id, kind:"chapter"|"graph"|"board", key}]
  lastKey:null,            // the chapter a view tab should report as context
  active:null,             // tab id
  syncScroll:true,
  showStrongs:false,
  layout:"paragraph",      // paragraph | list | continuous — see VERSE_LAYOUTS
  ink:false,
  searchHit:null           // {key, verse} to flash after a jump
};
/* Verse layouts, in the order a click on the status bar steps through them.
   paragraph   each verse its own paragraph, the number leading it (default)
   list        the number hangs in its own column, like a numbered list
   continuous  verses run on as prose, numbers inline */
const VERSE_LAYOUTS=["paragraph","list","continuous"];
const LAYOUT_ICON={paragraph:"lay-para",list:"lay-list",continuous:"lay-flow"};
/* "flow" is how earlier builds stored continuous reading; it stays readable
   and writable so saved sessions carry over. */
Object.defineProperty(state,"flow",{
  get(){return state.layout==="continuous";},
  set(v){if(v)state.layout="continuous";else if(state.layout==="continuous")state.layout="paragraph";}
});
function cycleLayout(){
  state.layout=VERSE_LAYOUTS[(VERSE_LAYOUTS.indexOf(state.layout)+1)%VERSE_LAYOUTS.length];
  renderAll();
  toast(L("msg.state",{what:L("cmd.layout"),value:L("val."+state.layout)}));
}
/* state.translation and state.split are the first pane and the pane count.
   Kept as accessors so every call site that predates parallel panes still works. */
Object.defineProperty(state,"translation",{
  get(){return state.panes[0];},
  set(v){state.panes[0]=v;}
});
Object.defineProperty(state,"split",{
  get(){return state.panes.length>1;},
  set(v){v?addPane():closePane(state.panes.length-1);}
});
const MAX_PANES=4;
/* Opening a pane creates a new reading column, so it asks what to put in it and
   only offers versions that are not already on screen. */
function addPane(){
  if(state.panes.length>=MAX_PANES){toast(L("msg.limitPanes",{n:MAX_PANES}));return;}
  const free=TRANSLATIONS.filter(t=>!state.panes.includes(t.id));
  if(!free.length){toast(L("msg.allOpen"));return;}
  openModal({
    placeholder:L("ph.parallel"),
    hint:L("hint.pane",{i:state.panes.length+1,n:MAX_PANES}),
    items:free.map(t=>({title:`${t.id} — ${t.name}`,icon:"book",id:t.id,
      sub:`${t.year} · ${langName(t.lang)||"?"} · ${t.note}${bibleDataStore[t.id]?"":" · "+L("hint.loadsOnUse")}`})),
    onPick:async t=>{
      if(state.panes.length>=MAX_PANES||state.panes.includes(t.id))return;
      try{await ensureTranslation(t.id);}
      catch(e){fail(L("err.load",{id:t.id,msg:e.message}));return;}
      state.panes.push(t.id);
      state.paneSizes=state.panes.map(()=>1);
      state.compareWith=t.id;
      renderAll();
    }
  });
  $("#modalInput").oninput=null;
}
function closePane(i){
  if(state.panes.length<=1){toast(L("msg.lastPane"));return;}
  state.panes.splice(i,1);
  state.paneSizes.splice(i,1);
  renderAll();
}
async function setPaneTranslation(i,id){
  try{await ensureTranslation(id);}
  catch(e){fail(L("err.load",{id,msg:e.message}));return;}
  state.panes[i]=id;
  if(i===0)searchIndex=buildIndex();
  renderAll();
}
/* Only translations actually opened are held in memory. A bundled version has
   no src and is already resident; anything else is fetched once, on demand. */
async function ensureTranslation(id){
  const t=TRANSLATIONS.find(t=>t.id===id);
  if(!t)throw new Error("not in the translation registry");
  if(bibleDataStore[id])return;
  if(!t.src){bibleDataStore[id]={};return;}
  const res=await fetch(t.src);
  if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);
  const data=await res.json();
  if(!data||typeof data!=="object")throw new Error("the response was not a chapter map");
  bibleDataStore[id]=data;
}

let tabSeq=0;

const chapterKey=(book,ch)=>`${book} ${ch}`;
/* Where a chapter sits, as a reader says it: "Old Testament / Psalms / 23".
   Chapters are not files, so nothing here ever ends in .md. */
const bookOf=key=>BOOK_BY_NAME.get(String(key).replace(/ \d+$/,""))||null;
const testamentOf=b=>L("canon."+b.testament);
const canonText=()=>CANON_TEXT[LOCALE]||null;
/* Where a book's name comes from, most specific first:
   1. the translation shown, when its registry entry lists book names — a
      Burmese Bible names its books in Burmese even in an English interface;
   2. the interface locale's CANON_TEXT table;
   3. BIBLE_CANON's English name.
   Short names serve tight spaces (a narrow pane's breadcrumb) and fall back
   the same way, ending at the canon abbreviation.
   ?pseudo=books stretches every name to test layouts against long names, the
   way Burmese or German ones run, without real data. */
const PSEUDO_BOOKS=/[?&]pseudo=books\b/.test(location.search);
const pseudoName=n=>{
  const acc={a:"á",e:"é",i:"í",o:"ö",u:"ü",A:"Å",E:"É",I:"Î",O:"Ø",U:"Ü",s:"š",c:"ç",n:"ñ"};
  const x=[...n].map(c=>acc[c]||c).join("");
  return `${x}${x.toLowerCase().replace(/\s+/g,"")}ëxtëndëd`;
};
function bookName(b,tr){
  const own=tr&&trMeta(tr).books;
  const t=canonText();
  const name=(own&&own[b.abbr])||(t&&t.books[b.abbr])||b.name;
  return PSEUDO_BOOKS?pseudoName(name):name;
}
function bookShort(b,tr){
  const own=tr&&trMeta(tr).booksShort;
  const t=canonText();
  return (own&&own[b.abbr])||(t&&t.short&&t.short[b.abbr])||b.abbr;
}
const groupName=g=>{const t=canonText();return (t&&t.groups[g])||g;};
/* "Psalms 23" as the reader's language writes it; the key itself never changes. */
const displayKey=key=>{const b=bookOf(key);return b?`${bookName(b)} ${String(key).split(" ").pop()}`:String(key);};
const refOf=(key,verse)=>`${displayKey(key)}:${verse}`;
const placeOf=key=>{
  const b=bookOf(key);
  return b?[testamentOf(b),bookName(b),String(key).split(" ").pop()].join(" / "):String(key);
};
/* A chapter's caption is its first alias that is a phrase, not an
   abbreviation: "The LORD is my shepherd", never "Ps 23". */
const ABBREVIATION=/^(\d\s?)?[A-Z][a-z]{0,3}\.?\s\d+$/;
const chapterCaption=key=>((CHAPTER_META[key]||{}).aliases||[]).find(a=>!ABBREVIATION.test(a))||"";
function chapterVerses(key,tr=state.translation){
  const t=bibleDataStore[tr];
  if(!t)return null;
  return t[key]||null;
}
const loadedKeys=()=>{
  const set=new Set();
  for(const tr of Object.keys(bibleDataStore))for(const k of Object.keys(bibleDataStore[tr]))set.add(k);
  return [...set];
};

/* ============================================================================
   3. MARKDOWN — one document, two views
   Reading mode and source mode render the SAME string, so what is edited is
   exactly what is displayed.
   ========================================================================== */
/* opts.source: the editable form, which always carries the Notes heading so
   there is somewhere to write.
   opts.textOnly: scripture and properties only, for a parallel pane — the
   chapter's references, study note and the reader's notes belong to the
   chapter, not to a translation, and are shown once, in the first pane. */
const NOTES_HEAD="## Notes";
const LEGACY_NOTES_HEAD="## My notes";
function composeMarkdown(key,tr=state.translation,opts={}){
  const bookName=key.replace(/ \d+$/,"");
  const chNum=+key.split(" ").pop();
  const book=BOOK_BY_NAME.get(bookName);
  const verses=chapterVerses(key,tr);
  const meta=CHAPTER_META[key]||{tags:[],refs:[],body:"",aliases:[]};
  const lines=[];
  lines.push("---");
  lines.push(`book: ${bookName}`);
  lines.push(`chapter: ${chNum}`);
  lines.push(`testament: ${book?(book.testament==="OT"?"Old":"New"):"Unknown"}`);
  lines.push(`group: ${book?book.group:"Unknown"}`);
  lines.push(`translation: ${tr}`);
  lines.push(`verses: ${verses?Object.keys(verses).length:0}`);
  lines.push(`canon-order: ${book?book.order:0}`);
  if(meta.aliases&&meta.aliases.length){lines.push("aliases:");meta.aliases.forEach(a=>lines.push(`  - ${a}`));}
  if(meta.tags&&meta.tags.length){lines.push("tags:");meta.tags.forEach(t=>lines.push(`  - ${t.replace(/^#/,"")}`));}
  lines.push("---");
  lines.push("");
  if(verses){
    for(const n of Object.keys(verses).map(Number).sort((a,b)=>a-b)){
      lines.push(`${verses[n]} ^v${n}`);
    }
  }
  lines.push("");
  if(opts.textOnly)return lines.slice(lines.indexOf("---",1)+2).join("\n");   // no frontmatter either
  if(meta.refs&&meta.refs.length){
    lines.push("## Cross references");
    lines.push(meta.refs.map(r=>`[[${r}]]`).join(" · "));
    lines.push("");
  }
  if(meta.body&&meta.body.trim()){lines.push("## Study note");lines.push(meta.body);lines.push("");}
  /* Tags are generated, so they sit above the reader's section: everything
     under the Notes heading is the reader's and nothing else. */
  if(meta.tags&&meta.tags.length){lines.push(meta.tags.join(" "));lines.push("");}
  const personal=getChapterNote(key);
  if((personal&&personal.trim())||opts.source){lines.push(NOTES_HEAD);lines.push((personal||"").trim());lines.push("");}
  return lines.join("\n");
}

function inline(text){
  let s=esc(text);
  s=s.replace(/`([^`]+)`/g,'<code class="md-inline-code">$1</code>');
  s=s.replace(/\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g,(m,target,label)=>{
    const key=target.replace(/\.md$/,"");
    const exists=!!chapterVerses(key,"KJV")||!!CHAPTER_META[key];
    return `<a class="wikilink${exists?"":" is-unresolved"}" data-link="${esc(key)}" title="${esc(placeOf(key))}">${esc(label||key)}</a>`;
  });
  s=s.replace(/\[([HG]\d{1,4})\]/g,(m,code)=>{
    const entry=STRONGS[code];
    if(!entry)return "";
    return `<sup class="strongs-code" data-strongs="${code}">${code}</sup>`;
  });
  s=s.replace(/(^|\s)#([a-z][\w-]*(?:\/[\w-]+)*)/gi,(m,pre,tag)=>`${pre}<a class="tag-inline" data-tag="#${tag}">#${tag}</a>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<span class="md-strong">$1</span>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<span class="md-em">$2</span>');
  return s;
}
/* Attach each Strong's code to the word in front of it so the underline and the
   popover target the word, not a floating superscript. */
function bindStrongs(html){
  return html.replace(/([\w'’-]+)(<sup class="strongs-code" data-strongs="([HG]\d{1,4})">[^<]*<\/sup>)/g,
    (m,word,sup,code)=>`<span class="strongs" data-strongs="${code}">${word}</span>${sup}`);
}

/* The note format writes these headings in English so source mode round-trips;
   the reading view shows them in the reader's language. */
const SECTION_LABEL={"Cross references":"lbl.refs","Study note":"lbl.study","Notes":"lbl.mine","My notes":"lbl.mine"};
function renderMarkdown(md,key,tr=state.translation){
  let firstVerse=true,widest=1;
  const out=[];
  const lines=md.split("\n");
  let i=0;
  if(lines[0]==="---"){
    const fm=[];i=1;
    while(i<lines.length&&lines[i]!=="---"){fm.push(lines[i]);i++;}
    i++;
    out.push(renderProps(fm,key));
  }
  const body=[];
  let buf=[];
  const flush=()=>{
    if(!buf.length)return;
    /* The list layout's number column is as wide as the longest number. */
    body.push(`<div class="chapter${state.flow?" flow":""}${state.layout==="list"?" list":""}" style="--vnum-digits:${widest}">${buf.join("")}</div>`);
    buf=[];
  };
  for(;i<lines.length;i++){
    const line=lines[i];
    if(!line.trim()){continue;}
    const v=line.match(/^(.*?)\s\^v(\d+)$/);
    if(v){
      const num=+v[2];
      const marked=appStore.highlights[`${key}|${num}`];
      buf.push(
        `<div class="verse${marked?" is-marked":""}" data-verse="${num}">`+
        `<span class="vnum" data-verse="${num}" role="button" tabindex="${firstVerse?0:-1}" aria-haspopup="true" aria-label="${esc(refOf(key,num))}">${num}</span>`+
        `<span class="vtext">${bindStrongs(inline(v[1]))}</span></div>`);
      firstVerse=false;widest=Math.max(widest,String(num).length);
      continue;
    }
    flush();
    if(line.startsWith("## ")){
      const h=line.slice(3),k=SECTION_LABEL[h];
      body.push(`<h2 class="md-h2">${k?esc(L(k)):inline(h)}</h2>`);continue;
    }
    if(line.startsWith("> ")){body.push(`<div class="md-quote">${inline(line.slice(2))}</div>`);continue;}
    body.push(`<p style="font-family:var(--font-ui);font-size:var(--fs-ui-l);line-height:1.65;color:var(--text-muted)">${inline(line)}</p>`);
  }
  flush();
  out.push(body.join(""));
  return out.join("");
}

const VERSE_ACTIONS=[
  {act:"mark",     icon:"marker",   label:"cmd.highlight"},
  {act:"bookmark", icon:"bookmark", label:"cmd.bookmark"},
  {act:"speak",    icon:"audio",    label:"cmd.readFrom"},

const PROP_ICON={book:"book",chapter:"quote",testament:"book-open",group:"files",translation:"type",
  verses:"quote","canon-order":"updown",tags:"tag",aliases:"link"};
function renderProps(fmLines,key){
  const rows=[];let cur=null;
  for(const l of fmLines){
    const m=l.match(/^([\w-]+):\s*(.*)$/);
    if(m){cur={k:m[1],v:m[2]?[m[2]]:[]};rows.push(cur);}
    else if(/^\s+-\s/.test(l)&&cur){cur.v.push(l.replace(/^\s+-\s/,""));}
  }
  const html=rows.map(r=>{
    const isList=r.k==="tags"||r.k==="aliases";
    const val=isList
      ? r.v.map(x=>`<span class="pill${r.k==="tags"?"":" plain"}" data-${r.k==="tags"?"tag":"alias"}="${r.k==="tags"?"#"+esc(x):esc(x)}">${r.k==="tags"?"#":""}${esc(x)}</span>`).join("")
      : esc(r.v[0]||"");
    return `<div class="prop-k">${icon(PROP_ICON[r.k]||"info")}<span>${esc(r.k)}</span></div>`+
           `<div class="prop-v" data-prop="${esc(r.k)}" data-key="${esc(key)}">${val}</div>`;
  }).join("");
  const open=appStore.prefs.propsOpen===true;
  return `<div class="props${open?"":" is-collapsed"}"><div class="props-head">${icon("chev")}<span>${esc(L("lbl.properties"))}</span>`+
         `<span style="margin-left:auto;color:var(--base-50)">${esc(L("lbl.fields",{n:rows.length}))}</span></div>`+
         `<div class="props-list">${html}</div></div>`;
}

function openChapter(key,opts={}){

  if(!tab){

function renderTabs(){
  const strip=$("#tabStrip");strip.innerHTML="";
  state.tabs.filter(t=>!t.float).forEach(t=>{
    const node=el("button","tab"+(t.id===state.active?" is-active":""),

    };

    node.setAttribute("role","tab");

  strip.appendChild(add);

/* Tabs reorder by pointer. A press that never travels more than a few pixels is
   an activation, so dragging never costs the reader a click. */
function wireTabDrag(node,tab){
  node.addEventListener("pointerdown",e=>{
    if(e.button!==0||e.target.closest(".t-close"))return;
    const tabs=$$(".tab",$("#tabStrip"));
    const from=tabs.indexOf(node);
    if(from<0)return;
    const rects=tabs.map(t=>t.getBoundingClientRect());
    const width=rects[from].width;
    const startX=e.clientX,startY=e.clientY;
    const strip=$("#tabStrip").getBoundingClientRect();
    let moved=false,to=from,detaching=false;
    const move=ev=>{
      const dx=ev.clientX-startX;
      /* Pulled clear of the strip: this is a detach, not a reorder. */
      const away=!isTouchLayout()&&ev.clientY>strip.bottom+52;
      if(away!==detaching){
        detaching=away;
        node.classList.toggle("is-detaching",away);
        tabs.forEach(t=>{if(t!==node)t.style.transform="";});
      }
      if(detaching){
        moved=true;
        node.style.transform=`translate(${dx}px,${ev.clientY-startY}px)`;
        paintDetachHint(ev.clientX,ev.clientY);
        return;
      }
      $("#winHint").hidden=true;
      if(!moved){
        if(Math.abs(dx)<4)return;
        moved=true;node.classList.add("is-dragging");
        try{node.setPointerCapture(ev.pointerId);}catch(err){}
      }
      node.style.transform=`translateX(${dx}px)`;
      const centre=rects[from].left+width/2+dx;
      const sgn=isRTL()?-1:1;           // later tabs sit further along the reading direction
      let next=from;
      rects.forEach((r,i)=>{
        if(i===from)return;
        const past=(centre-(r.left+r.width/2))*sgn;
        if(i>from&&past>0)next=Math.max(next,i);
        if(i<from&&past<0)next=Math.min(next,i);
      });
      if(next===to)return;
      to=next;
      tabs.forEach((t,i)=>{
        if(i===from)return;
        let shift=0;
        if(to>from&&i>from&&i<=to)shift=-width;
        if(to<from&&i>=to&&i<from)shift=width;
        t.style.transform=shift?`translateX(${shift*sgn}px)`:"";
      });
    };
    const up=ev=>{
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      $("#winHint").hidden=true;
      node.classList.remove("is-detaching");
      if(detaching){detachTab(tab,ev?ev.clientX:startX,ev?ev.clientY:startY);return;}
      if(!moved){state.active=tab.id;renderAll();return;}
      const [item]=state.tabs.splice(from,1);
      state.tabs.splice(to,0,item);
      state.active=tab.id;
      renderAll();
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  });
}
function closeTab(id){
  const i=state.tabs.findIndex(t=>t.id===id);
  if(i<0)return;
  state.tabs.splice(i,1);
  if(state.active===id)state.active=state.tabs.length?state.tabs[Math.max(0,i-1)].id:null;
  renderAll();
}

function renderPanes(){
  const host=$("#panes");
  /* Record where the page was before it is rebuilt, so a re-render never
     costs the reader their place. */
  const prev=$('.leaf[data-role="primary"]',host);
  if(prev&&prev.dataset.key){
    const sc=$(".leaf-scroll",prev);
    if(sc&&sc.scrollHeight>sc.clientHeight)rememberPosition(prev.dataset.key,topVerse(sc));
  }
  host.innerHTML="";
  const tab=activeTab();
  host.classList.toggle("is-split",state.panes.length>1&&(!tab||tab.kind==="chapter"));
  if(!tab){host.appendChild(emptyWorkspace());return;}
  if(tab.kind!=="chapter"){
    host.appendChild(buildOverlay(tab.kind));
    $$(".leaf-scroll",host).forEach(wireFadeScroll);
    return;
  }
  const key=tab.key;
  state.panes.forEach((tr,i)=>{
    if(i)host.appendChild(buildDivider(i));
    const leaf=buildLeaf(key,tr,i);
    setPaneFlex(leaf,state.paneSizes[i]||1);
    host.appendChild(leaf);
  });
  $$(".leaf-scroll",host).forEach(wireFadeScroll);
  fitLeaves();
  alignRows();
  observeRows();
  if(state.panes.length>1)wireSyncScroll();
  const primary=$('.leaf[data-role="primary"] .leaf-scroll',host);
  syncLeader=primary||null;
  if(primary){
    /* An explicit jump (search hit, deep link, bookmark) outranks the memory. */
    const jumping=state.searchHit&&state.searchHit.key===key;
    state.searchHit=null;
    if(!jumping&&state.mode==="reading")restorePosition(primary,key);
    trackPosition(primary,key);
    watchShortChapter(primary,key);
  }
  if(state.ink)mountInk();
}
/* The flex shorthand is unevenly supported when set from script, so the three
   longhands are written instead. */
function setPaneFlex(leaf,grow){
  leaf.style.flexGrow=String(grow);
  leaf.style.flexShrink="1";
  leaf.style.flexBasis="0%";
}
/* Dragging a divider moves width between its two neighbours only, so the panes
   further out keep the size the reader gave them. */
function buildDivider(i){
  const d=el("div","leaf-divider");
  d.dataset.index=i;
  d.title=L("hint.resize");
  d.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const leaves=$$(".leaf",$("#panes"));
    const left=leaves[i-1],right=leaves[i];
    if(!left||!right)return;
    d.classList.add("dragging");d.setPointerCapture(e.pointerId);
    /* Freeze every pane at its current pixel width first, so the two being
       dragged stay comparable with the ones that are not. */
    state.paneSizes=leaves.map(l=>l.offsetWidth||1);
    const startX=e.clientX,lw=state.paneSizes[i-1],rw=state.paneSizes[i],MIN=180;
    const move=ev=>{
      let delta=(ev.clientX-startX)*(isRTL()?-1:1);   // panes run in reading order
      delta=Math.max(MIN-lw,Math.min(rw-MIN,delta));
      state.paneSizes[i-1]=lw+delta;
      state.paneSizes[i]=rw-delta;
      setPaneFlex(left,state.paneSizes[i-1]);
      setPaneFlex(right,state.paneSizes[i]);
    };
    const up=()=>{
      d.classList.remove("dragging");
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
      saveSession();
    };
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  });
  return d;
}

/* ---- navigation picker ----------------------------------------------------

   "chapters" the book's chapters. Choosing a book moves to its chapters without

   edge; touch spans the pane it belongs to, with finger-sized cells. */
const navPop={anchor:null,go:null,current:null,book:null,mode:null};
function openNavPop(anchor,mode,b,current,go){

function paintNavPop(mode,b){
  const pop=$("#navPop"),grid=$("#navGrid");
  navPop.mode=mode;navPop.book=b;
  const curBook=bookOf(navPop.current);
  let html="";
  if(mode==="books"){
    BIBLE_CANON.filter(x=>x.testament===b.testament).forEach(x=>{
      const on=curBook&&x.name===curBook.name;
      const name=bookName(x,navPop.tr);
      /* Numbered by canon order, so the list reads as the sequence it is. */
      html+=`<button class="np-book${on?" is-active":""}" data-book="${esc(x.name)}" title="${esc(name)}" tabindex="${on?0:-1}"${on?' aria-current="true"':""}>`+
        `<span class="np-n">${x.order}</span><span class="np-name">${esc(name)}</span></button>`;
    });

function layoutNavPop(){
  const pop=$("#navPop"),grid=$("#navGrid"),a=navPop.anchor;
  if(!a||pop.hidden)return;
  const ar=a.getBoundingClientRect();
  /* Same test as the stylesheet's touch rules, so cell sizes agree. */
  const touch=isTouchLayout()||(window.matchMedia&&matchMedia("(hover:none)").matches);
  const books=navPop.mode==="books";
  const PAD=8,GAP=4,ARROW=7,EDGE=8;
  let width,cols,cell;
  if(touch){
    /* Span the pane the crumb belongs to; cells stretch to fill whole columns. */
    const leaf=a.closest(".leaf")||document.body;
    const lr=leaf.getBoundingClientRect();
    width=Math.max(220,Math.min(lr.width,innerWidth)-EDGE*2);
    cell=books?140:48;
    cols=Math.max(1,Math.floor((width-PAD*2+GAP)/(cell+GAP)));
    grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
    pop.style.width=width+"px";
    pop.style.left=Math.max(EDGE,Math.min(lr.left+EDGE,innerWidth-width-EDGE))+"px";
  }else{
    const count=grid.children.length;
    if(books){
      /* As wide as the longest name needs, within reason; long names wrap to a
         second line rather than being cut. */
      const probe=$(".np-name",grid);
      const f=probe?getComputedStyle(probe):null;
      const ctx=layoutNavPop.ctx||(layoutNavPop.ctx=document.createElement("canvas").getContext("2d"));
      let longest=0;
      if(ctx&&f){
        ctx.font=`${f.fontWeight} ${f.fontSize} ${f.fontFamily}`;
        $$(".np-name",grid).forEach(n=>{longest=Math.max(longest,ctx.measureText(n.textContent).width);});
      }
      cell=Math.round(Math.max(128,Math.min(236,longest+50)));
      cols=Math.max(1,Math.min(3,count,Math.floor((innerWidth-EDGE*2-PAD*2+GAP)/(cell+GAP))));
    }else{
      cell=34;
      cols=Math.min(count,10);
    }
    width=cols*cell+(cols-1)*GAP+PAD*2+2;      // +2: the 1px border on each side
    grid.style.gridTemplateColumns=`repeat(${cols},${cell}px)`;
    pop.style.width=width+"px";

    const want=isRTL()?ar.right-width+PAD:ar.left-PAD;
    pop.style.left=Math.max(EDGE,Math.min(want,innerWidth-width-EDGE))+"px";
  }
  const left=parseFloat(pop.style.left);
  pop.style.setProperty("--arrow-x",Math.max(14,Math.min(width-14,ar.left+ar.width/2-left))+"px");

     inside whatever height is left. */
  const rowH=(touch?48:30)+GAP;
  const below=innerHeight-ar.bottom-ARROW-EDGE-(touch?90:12);
  const above=ar.top-ARROW-EDGE;
  const rows=Math.ceil(grid.children.length/cols);
  const need=rows*rowH+PAD*2;
  const up=below<Math.min(need,rowH*4)&&above>below;
  const cap=touch?innerHeight*.5:books?innerHeight*.7:rowH*9+PAD*2;
  const room=Math.max(rowH*2,Math.min(up?above:below,cap));
  /* A numbered list reads down its columns, as a contents page does — when the
     whole list fits. Otherwise it scrolls, and runs across so scrolling
     always moves forward through the canon. */
  const down=books&&need<=room;
  grid.style.gridAutoFlow=down?"column":"row";
  grid.style.gridTemplateRows=down?`repeat(${rows},auto)`:"";
  grid.style.maxHeight=Math.min(need,room)+"px";
  pop.classList.toggle("is-above",up);
  pop.style.top=(up?ar.top-ARROW-pop.offsetHeight:ar.bottom+ARROW)+"px";

/* Arrow keys move through a grid of buttons in reading order; Home and End go
   to the ends; typing jumps ("2","3" finds 23, "ps" finds Psalms). Columns are
   read from layout, so the same code serves any width. */
const columnsOf=items=>{
  if(!items.length)return 1;
  const top=items[0].offsetTop;let n=0;
  for(const x of items){if(x.offsetTop!==top)break;n++;}
  return Math.max(1,n);
};
function wireGridKeys(host,itemSel,{onEscape}={}){
  let typed="",typedAt=0,typedIn=null;
  host.addEventListener("keydown",e=>{
    const cur=e.target.closest?e.target.closest(itemSel):null;
    if(!cur||!host.contains(cur))return;
    const items=$$(itemSel,cur.parentElement).filter(n=>n.parentElement===cur.parentElement);
    const i=items.indexOf(cur),fwd=isRTL()?-1:1;
    /* In a grid that flows down its columns, down is the next item and across
       is a whole column away. */
    const down=getComputedStyle(cur.parentElement).gridAutoFlow.startsWith("column");
    const step=down?items.filter(n=>n.offsetLeft===items[0].offsetLeft).length:columnsOf(items);
    const across=down?step:1,vertical=down?1:step;
    let j=null;
    switch(e.key){
      case "ArrowRight":j=i+fwd*across;break;
      case "ArrowLeft":j=i-fwd*across;break;
      case "ArrowDown":j=i+vertical;break;
      case "ArrowUp":j=i-vertical;break;
      case "Home":j=0;break;
      case "End":j=items.length-1;break;
      case "PageDown":j=i+vertical*5;break;
      case "PageUp":j=i-vertical*5;break;
      case "Escape":
        if(onEscape){e.preventDefault();e.stopPropagation();onEscape();}
        return;
      default:{
        if(e.key.length!==1||!/\S/.test(e.key)||e.ctrlKey||e.metaKey||e.altKey)return;
        /* The buffer belongs to one set of items; a repaint starts it over. */
        const now=Date.now(),set=items[0];
        typed=(now-typedAt<800&&typedIn===set?typed:"")+e.key.toLowerCase();typedAt=now;typedIn=set;
        const hit=items.findIndex(n=>n.textContent.trim().toLowerCase().startsWith(typed));
        if(hit<0)return;
        j=hit;
      }
    }
    e.preventDefault();e.stopPropagation();
    j=Math.max(0,Math.min(items.length-1,j));
    items.forEach(n=>{n.tabIndex=-1;});
    items[j].tabIndex=0;
    items[j].focus({preventScroll:true});
    try{items[j].scrollIntoView({block:"nearest"});}catch(err){}
  });
}
/* [1,2,3,5,7,8] -> "1–3, 5, 7–8" */
function ranges(nums){
  const out=[];
  for(let i=0;i<nums.length;i++){
    let j=i;while(j+1<nums.length&&nums[j+1]===nums[j]+1)j++;
    out.push(j>i?`${nums[i]}–${nums[j]}`:String(nums[i]));i=j;
  }
  return out.join(", ");
}
function buildLeaf(key,tr,index,floatId){

  /* Verse actions and links resolve their chapter from the surface they were
     clicked on, not from whatever the docked workspace happens to show. */
  leaf.dataset.key=key;
  const meta=TRANSLATIONS.find(t=>t.id===tr);
  const trName=`${meta?meta.name:tr} · ${L("cmd.translation")}`;
  const rtl=textDir(tr)==="rtl";
  const dirName=`${L("cmd.textDir")}: ${L(rtl?"val.rtl":"val.ltr")}`;
  leaf.innerHTML=`<div class="leaf-head">${crumbs(key,tr)}
      ${dirChoosable(tr)?`<button class="dir-btn" data-textdir="${esc(tr)}" aria-pressed="${rtl}" title="${esc(dirName)}" aria-label="${esc(dirName)}">${icon("dir")}</button>`:""}
      <button class="tr-btn" ${floatId?`data-float="${floatId}"`:`data-pane="${index}"`} title="${esc(trName)}" aria-label="${esc(trName)}">
        ${esc(tr)}${icon("chev")}</button>

    </div><div class="leaf-scroll scroll"></div>`;
  const scroll=$(".leaf-scroll",leaf);
  const verses=chapterVerses(key,tr);

    const ta=el("textarea","source scroll");
    const original=composeMarkdown(key,tr,{source:index===0,textOnly:index>0});
    ta.value=original;
    ta.spellcheck=false;
    ta.dir="auto";
    ta.readOnly=index!==0;
    if(index===0)ta.addEventListener("blur",()=>commitSource(key,original,ta));
    scroll.appendChild(ta);
    return leaf;
  }

  const book=bookOf(key);
  const note=el("div","note");
  const count=verses?Object.keys(verses).length:0;

     carries what neither does: the number set large, and the caption. */
  /* A parallel pane repeats nothing the first pane already shows. Its head

     text alone: properties, references, the study note and the reader's notes
     belong to the chapter and appear once, in the first pane. */
  const compare=index>0&&!floatId;

    ? [langName(meta&&meta.lang),meta&&meta.year,L("lbl.verses",{n:count})].filter(Boolean).join(" · ")
    : `${book?groupName(book.group):""} · ${tr} · ${L("lbl.verses",{n:count})}`;

      <div class="ch-meta">${caption?`<div class="ch-caption">${esc(caption)}</div>`:""}
        <div class="note-sub">${esc(sub)}</div></div></header>`+
    renderMarkdown(composeMarkdown(key,tr,{textOnly:compare}),key,tr);
  /* Where this translation lacks verses the first pane has, say which. */
  if(compare&&verses){
    const first=chapterVerses(key,state.panes[0])||{};
    const gap=Object.keys(first).map(Number).filter(n=>!(n in verses)).sort((a,b)=>a-b);
    if(gap.length){
      const note2=el("p","tr-missing",esc(L("lbl.missingHere",{list:ranges(gap)})));
      note.appendChild(note2);
    }
  }
  /* Scripture carries its own language and direction; the page around it
     keeps the interface's. */
  $$(".chapter",note).forEach(c=>{c.lang=(meta&&meta.lang)||"";c.dir=textDir(tr);});
  if(!verses){
    const t=TRANSLATIONS.find(t=>t.id===tr);
    /* Registered but empty is "not bundled"; loaded but without this chapter
       is "outside the sample". The old check compared against a note string
       the registry never used, so it always said the second. */
    const bundled=!!bibleDataStore[tr]&&Object.keys(bibleDataStore[tr]).length>0;
    const why=t&&!bundled?L("ch.notBundled",{name:t.name}):L("ch.outside",{key});
    const notice=el("div","callout");
    const path=`bibleDataStore["${tr}"]["${key}"]`;
    notice.innerHTML=`<div class="co-title">${icon("alert")}<span>${esc(L("ch.noText",{tr}))}</span></div>
      ${esc(why)} ${esc(L("ch.intact",{path:"\u0000"})).replace("\u0000",`<span class="kbd">${esc(path)}</span>`)}`;
    const props=$(".props",note);

    note.appendChild(empty);

     that sits below the text, or beside it when the pane has room. */

  if(chapterEl&&!compare){
    const row=el("div","reading-row");
    chapterEl.before(row);row.appendChild(chapterEl);
    let n=row.nextSibling;
    while(n){const next=n.nextSibling;if(!(n.classList&&n.classList.contains("tr-missing")))studyCol.appendChild(n);n=next;}

/* Source mode edits the note, not the canon. Everything under "## Notes" is
   written back; a change to the scripture lines is refused out loud. */
function commitSource(key,original,ta){
  /* Notes saved by older builds were headed "My notes"; either heading works. */
  const cut=t=>{
    for(const h of [NOTES_HEAD,LEGACY_NOTES_HEAD]){
      const i=t.indexOf("\n"+h+"\n");
      if(i>=0)return {head:t.slice(0,i),mine:t.slice(i+h.length+2).trim()};
      if(t.endsWith("\n"+h))return {head:t.slice(0,t.length-h.length-1),mine:""};
    }
    return {head:t,mine:""};
  };
  const a=cut(original),b=cut(ta.value);
  if(a.head.trim()!==b.head.trim()){
    ta.value=a.head.replace(/\s+$/,"")+"\n\n"+NOTES_HEAD+"\n"+b.mine+"\n";
    fail(L("err.source"));
  }
  if(b.mine!==a.mine){
    setChapterNote(key,b.mine);
    renderNotesPane();renderBacklinks();
  }
}

const verseNode=(n,root=document)=>root.querySelector(`.verse[data-verse="${n}"]`);

/* ---- reading position -------------------------------------------------------
   Every chapter remembers the verse at the top of the page, so returning to it
   — a new tab, a reload, a re-render after a setting changes — lands where the
   reader left off instead of at the top. Verse 1 is the top and is not stored.
   The oldest entries are dropped past a few hundred chapters. */
const POSITION_LIMIT=400;
function topVerse(scroll){
  const top=scroll.scrollTop+12;
  const v=$$(".verse",scroll).find(n=>n.offsetTop+n.offsetHeight>top);
  return v?+v.dataset.verse:null;
}
function rememberPosition(key,verse){
  if(!key||!storeWritable)return;
  const all=appStore.positions||(appStore.positions={});
  if(!verse||verse<=1){if(all[key]){delete all[key];saveStore();}return;}
  if(all[key]&&all[key].v===verse)return;
  all[key]={v:verse,at:Date.now()};
  const keys=Object.keys(all);
  if(keys.length>POSITION_LIMIT){
    keys.sort((a,b)=>all[a].at-all[b].at).slice(0,keys.length-POSITION_LIMIT).forEach(k=>delete all[k]);
  }
  saveStore();
}
const lastPosition=()=>{
  const all=appStore.positions||{};
  const key=Object.keys(all).sort((a,b)=>all[b].at-all[a].at)[0];
  return key&&bookOf(key)?{key,verse:all[key].v}:null;
};
function restorePosition(scroll,key){
  const p=(appStore.positions||{})[key];
  if(!p)return false;
  const v=verseNode(p.v,scroll);
  if(!v)return false;
  scroll.scrollTop=Math.max(0,v.offsetTop-10);

/* Watches one reading surface: records the position as it settles and tells
   the plan when the end of the chapter has been reached. */
function trackPosition(scroll,key){

  scroll.__posKey=key;

  scroll.addEventListener("scroll",()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{
      if(!scroll.isConnected)return;
      rememberPosition(key,topVerse(scroll));
      if(scroll.scrollTop+scroll.clientHeight>=scroll.scrollHeight-scroll.clientHeight*.45)planReached(key);
    },220);
  },{passive:true});
}

/* A chapter that fits on one screen can never be scrolled to its end, so for a
   plan it counts as read after it has been on screen, in front, for a while. */
const SHORT_READ_MS=20000;
let shortReadTimer=null;
function watchShortChapter(scroll,key){

    if(!scroll.isConnected||!chapterVerses(key))return;
    if(scroll.scrollHeight>scroll.clientHeight+24)return;
    shortReadTimer=setTimeout(()=>{
      if(scroll.isConnected&&!document.hidden&&activeKey()===key)planReached(key);
    },SHORT_READ_MS);

/* ---- parallel reading: aligned rows and scroll sync -------------------------
   With sync on, verse n starts at the same height in every pane: each verse
   takes the height of its tallest twin, and each chapter starts as low as the
   lowest. Scrolling is then a straight copy of scrollTop from the pane being
   scrolled to the others, one frame at a time — no jump at a verse boundary,
   and the same verse always side by side.
   Flowing paragraphs cannot be aligned by verse; there the followers track the
   verse under the reading line, proportionally through it. */
const READING_LINE=.3;

/* Watch the pane container and every pane in it; a divider drag resizes
   panes without resizing the container. */
function observeRows(){
  if(!rowObserver)return;
  rowObserver.disconnect();
  rowObserver.observe($("#panes"));

}                 // of the pane height, from the top
let syncLeader=null,syncFrame=0;
function alignRows(){
  const host=$("#panes");
  const chapters=$$('.leaf[data-translation] .chapter',host);
  chapters.forEach(c=>{c.style.paddingTop="";$$(".verse",c).forEach(v=>{v.style.minHeight="";});});
  const on=state.syncScroll&&!state.flow&&state.mode==="reading"&&chapters.length>1;
  host.classList.toggle("is-aligned",on);
  if(!on)return;
  /* Read everything, then write everything: one layout pass, not hundreds. */
  const rows=new Map();
  chapters.forEach(c=>$$(".verse",c).forEach(v=>{
    const n=v.dataset.verse;
    if(!rows.has(n))rows.set(n,[]);
    rows.get(n).push({v,h:v.getBoundingClientRect().height});
  }));
  /* offsetTop from the note, whatever wraps the chapter. */
  const tops=chapters.map(c=>{let t=0,n=c;while(n&&!n.classList.contains("note")){t+=n.offsetTop;n=n.offsetParent;}return t;});
  const lowest=Math.max(...tops);
  rows.forEach(list=>{
    if(list.length<2)return;
    const h=Math.max(...list.map(x=>x.h));
    list.forEach(x=>{if(x.h<h-.5)x.v.style.minHeight=h+"px";});
  });
  /* Padding, not margin: a margin would collapse into the heading above it. */
  chapters.forEach((c,i)=>{if(tops[i]<lowest)c.style.paddingTop=(lowest-tops[i])+"px";});
}
function followLeader(from){
  const scrolls=$$(".leaf-scroll",$("#panes"));
  const aligned=$("#panes").classList.contains("is-aligned");
  scrolls.forEach(to=>{
    if(to===from)return;
    if(aligned){to.scrollTop=from.scrollTop;return;}
    const line=from.scrollTop+from.clientHeight*READING_LINE;
    const v=$$(".verse",from).find(n=>n.offsetTop+n.offsetHeight>line);
    if(!v)return;
    const twin=verseNode(v.dataset.verse,to);
    if(!twin)return;
    const frac=Math.max(0,Math.min(1,(line-v.offsetTop)/Math.max(1,v.offsetHeight)));
    to.scrollTop=twin.offsetTop+frac*twin.offsetHeight-to.clientHeight*READING_LINE;
  });

/* The pane the reader is touching leads; the scroll events the followers fire

function wireSyncScroll(){
  const scrolls=$$(".leaf-scroll",$("#panes"));

    ["pointerenter","pointerdown","wheel","touchstart","focusin","keydown"].forEach(ev=>
      s.addEventListener(ev,lead,{passive:true}));

function wireRowAlignment(){

  const again=()=>{

      const keep=anchorOf(lead);

/* Pointing at a verse in one pane marks the same verse in the others. */

/* ============================================================================
   4b. WINDOW LAYER
   Floating tabs and the composer share one stacking order, so clicking any of
   them brings it forward exactly as a desktop window manager would.
   ========================================================================== */
const WIN_BASE=120,WIN_TOP=190;
/* Which surface the panels describe: a focused float, or the docked workspace. */
let focusedFloat=null;

function raiseWindow(el){
  if(!el)return;
  /* A hidden window must not hold a slot, or re-showing it lands at the bottom. */
  const wins=$$(".win-layer")
    .filter(w=>w===el||!w.hasAttribute("hidden"))
    .sort((a,b)=>(parseInt(a.style.zIndex,10)||WIN_BASE)-(parseInt(b.style.zIndex,10)||WIN_BASE));
  const ordered=wins.filter(w=>w!==el).concat(wins.includes(el)?[el]:[el]);
  ordered.forEach((w,i)=>{
    w.style.zIndex=String(Math.min(WIN_TOP,WIN_BASE+i));
    w.classList.toggle("is-front",w===el);
  });

}

function setFocusContext(floatId){

  /* The composer does not move the reading context; it sits beside it. */
  if(floatId===undefined)return;
  if(next===focusedFloat)return;
  if(floatId===null&&focusedFloat===null)return;
  focusedFloat=next;
  renderContext();
}

  if(focusedFloat!=null){
    const t=state.tabs.find(x=>x.id===focusedFloat&&x.float);
    if(t)return t;

  }

}
const contextTranslation=()=>{

/* The panels that describe a passage, refreshed without rebuilding surfaces. */
function renderContext(){

function wireWindowFocus(){
  document.addEventListener("pointerdown",e=>{
    const el=e.target instanceof Element?e.target:null;
    if(!el)return;
    const node=el.closest(".win-layer");
    if(node){raiseWindow(node);return;}
    if(el.closest("#panes")||el.closest(".tabbar")){
      if(focusedFloat!=null){focusedFloat=null;renderContext();}
    }
  },true);
  /* A window dragged off-screen, or stranded by a smaller viewport, is
     unreachable; every float is pulled back into view on resize. */
  window.addEventListener("resize",clampFloats);
}
function clampFloats(){
  floatTabs().forEach(tab=>{
    const node=floatEls.get(tab.id);
    if(!node)return;
    const w=Math.min(tab.float.w,Math.max(340,window.innerWidth-16));
    const h=Math.min(tab.float.h,Math.max(220,window.innerHeight-16));
    tab.float.w=w;tab.float.h=h;
    tab.float.x=Math.max(0,Math.min(tab.float.x,window.innerWidth-Math.min(w,140)));
    tab.float.y=Math.max(0,Math.min(tab.float.y,window.innerHeight-40));
    node.style.width=w+"px";node.style.height=h+"px";
    node.style.left=tab.float.x+"px";node.style.top=tab.float.y+"px";
  });
}

/* ============================================================================
   4c. DETACHED TABS
   A float is a frame around the same .leaf the workspace builds; only the
   chrome differs, so every kind of tab can be detached without a second
   renderer. Floats hold one translation and are a pointer-layout feature.
   ========================================================================== */
const floatEls=new Map();
const floatTabs=()=>state.tabs.filter(t=>t.float);

/* The size a reader last settled on is the size they want next time. */
function defaultFloatSize(){
  const saved=appStore.prefs.floatRect||{};
  const w=Math.max(340,Math.min(Number(saved.w)||Math.round(window.innerWidth*.46),window.innerWidth-24));
  const h=Math.max(220,Math.min(Number(saved.h)||Math.round(window.innerHeight*.6),window.innerHeight-24));
  return {w,h};
}
function rememberFloatSize(tab){
  if(!tab||!tab.float)return;
  appStore.prefs.floatRect={w:tab.float.w,h:tab.float.h};
  saveStore();
}
function detachTab(tab,x,y){
  if(isTouchLayout()||!tab)return;
  const {w,h}=defaultFloatSize();
  /* Cascade so a second window never lands exactly on the first. */
  const step=(floatTabs().length%5)*26;
  tab.float={
    x:Math.max(8,Math.min(Math.round(x-w/2)+step,window.innerWidth-w-8)),
    y:Math.max(8,Math.min(Math.round(y-18)+step,window.innerHeight-h-8)),
    w,h,
    translation:tab.kind==="chapter"?contextTranslation():null
  };
  if(state.active===tab.id){
    const next=state.tabs.find(t=>!t.float);
    state.active=next?next.id:null;
  }
  renderAll();
  const node=floatEls.get(tab.id);
  if(node)raiseWindow(node);
  toast(L("msg.detached",{key:tabLabel(tab)}));
}
function dockTab(tab,index){
  if(!tab||!tab.float)return;
  delete tab.float;
  const from=state.tabs.indexOf(tab);
  if(from>=0&&typeof index==="number"){
    state.tabs.splice(from,1);
    state.tabs.splice(Math.max(0,Math.min(index,state.tabs.length)),0,tab);
  }
  state.active=tab.id;
  renderAll();
}
function navigateFloat(id,key){
  const tab=state.tabs.find(t=>t.id===id);
  if(!tab||!tab.float)return;
  if(!bookOf(key)){fail(L("err.noBook",{key}));return;}
  tab.kind="chapter";tab.key=key;
  renderAll();
}
function floatSignature(tab){
  return [tab.kind,tab.key,tab.float.translation||"",state.mode,state.showStrongs,state.layout].join("|");
}
function buildFloatBody(tab){
  if(tab.kind!=="chapter")return buildOverlay(tab.kind);
  const tr=tab.float.translation||state.panes[0];
  const leaf=buildLeaf(tab.key,tr,0,tab.id);
  const sc=$(".leaf-scroll",leaf);
  /* The body is not in the page yet; place it on the next frame. */
  requestAnimationFrame(()=>{if(sc.isConnected){restorePosition(sc,tab.key);trackPosition(sc,tab.key);}});
  return leaf;
}
function buildFloat(tab){
  const win=el("div","float-win win-layer");
  win.dataset.floatId=tab.id;
  win.style.left=tab.float.x+"px";win.style.top=tab.float.y+"px";
  win.style.width=tab.float.w+"px";win.style.height=tab.float.h+"px";
  win.setAttribute("role","dialog");
  win.setAttribute("aria-label",tabLabel(tab));
  win.innerHTML=`<div class="float-bar">
      <span class="float-name">${icon(tabIcon(tab))}
        <span class="fn-text">${esc(tabLabel(tab))}</span></span>
      <button class="cw-tool" data-win="dock" data-l="cmd.dock">${icon("panel-l")}</button>
      <button class="cw-tool" data-win="close" data-l="cmd.close">${icon("x")}</button>
    </div>
    <div class="float-body"></div>
    <div class="cw-resize" data-dir="e"></div>
    <div class="cw-resize" data-dir="s"></div>
    <div class="cw-resize" data-dir="se"></div>`;
  applyStrings(win);
  wireFloatBar(win,tab);
  wireFloatResize(win,tab);
  win.addEventListener("click",e=>{
    const b=e.target.closest("[data-win]");
    if(!b)return;
    if(b.dataset.win==="close")closeTab(tab.id);
    else dockTab(tab,state.tabs.length);
  });
  return win;
}
function wireFloatBar(win,tab){
  const bar=$(".float-bar",win);
  bar.addEventListener("dblclick",e=>{
    if(e.target.closest("button"))return;
    toggleFloatMax(win,tab);
  });
  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    if(tab.float.max)return;
    const r=win.getBoundingClientRect();
    const ox=e.clientX-r.left,oy=e.clientY-r.top;
    let moved=false,dockAt=null;
    raiseWindow(win);
    try{bar.setPointerCapture(e.pointerId);}catch(err){}
    const move=ev=>{
      if(!moved){
        if(Math.abs(ev.clientX-e.clientX)<3&&Math.abs(ev.clientY-e.clientY)<3)return;
        moved=true;bar.classList.add("is-dragging");
      }
      win.style.left=Math.min(Math.max(0,ev.clientX-ox),window.innerWidth-90)+"px";
      win.style.top=Math.min(Math.max(0,ev.clientY-oy),window.innerHeight-40)+"px";
      dockAt=dockTarget(ev.clientX,ev.clientY);
      paintDockHint(dockAt);
    };
    const up=()=>{
      bar.classList.remove("is-dragging");
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
      $("#winHint").hidden=true;
      if(!moved)return;
      if(dockAt!==null){dockTab(tab,dockAt);return;}
      tab.float.x=parseInt(win.style.left,10);
      tab.float.y=parseInt(win.style.top,10);
      saveSession();
    };
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  });
}
function toggleFloatMax(win,tab){
  const g=8;
  if(tab.float.max){
    Object.assign(tab.float,tab.float.max,{max:null});
    delete tab.float.max;
  }else{
    tab.float.max={x:tab.float.x,y:tab.float.y,w:tab.float.w,h:tab.float.h};
    tab.float.x=g;tab.float.y=g;
    tab.float.w=window.innerWidth-g*2;
    tab.float.h=window.innerHeight-g*2;
  }
  win.style.left=tab.float.x+"px";win.style.top=tab.float.y+"px";
  win.style.width=tab.float.w+"px";win.style.height=tab.float.h+"px";
  win.classList.toggle("is-max",!!tab.float.max);
  saveSession();
}
function wireFloatResize(win,tab){
  $$(".cw-resize",win).forEach(h=>{
    h.addEventListener("pointerdown",e=>{
      e.preventDefault();
      raiseWindow(win);
      const dir=h.dataset.dir,r=win.getBoundingClientRect();
      const sx=e.clientX,sy=e.clientY;
      try{h.setPointerCapture(e.pointerId);}catch(err){}
      const move=ev=>{
        if(dir.includes("e"))win.style.width=Math.max(340,Math.min(r.width+ev.clientX-sx,window.innerWidth-r.left-4))+"px";
        if(dir.includes("s"))win.style.height=Math.max(220,Math.min(r.height+ev.clientY-sy,window.innerHeight-r.top-4))+"px";
      };
      const up=()=>{
        window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
        tab.float.w=win.offsetWidth;tab.float.h=win.offsetHeight;
        rememberFloatSize(tab);saveSession();
      };
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    });
  });
}
/* Over the tab strip means dock, and where in the strip means at which index. */
function dockTarget(x,y){
  const bar=$(".tabbar");
  if(!bar)return null;
  const r=bar.getBoundingClientRect();
  if(x<r.left||x>r.right||y<r.top-10||y>r.bottom+10)return null;
  const tabs=$$(".tab",$("#tabStrip"));
  let index=tabs.length;
  for(let i=0;i<tabs.length;i++){
    if(beforeMid(x,tabs[i].getBoundingClientRect())){index=i;break;}
  }
  return index;
}
function paintDockHint(index){
  const hint=$("#winHint");
  if(index===null){hint.hidden=true;return;}
  const strip=$("#tabStrip").getBoundingClientRect();
  const tabs=$$(".tab",$("#tabStrip"));
  /* The hint sits where the tab will land, measured in reading order. */
  const edge=tabs.length?(index>=tabs.length
    ? endEdge(tabs[tabs.length-1].getBoundingClientRect())
    : startEdge(tabs[index].getBoundingClientRect())):startEdge(strip);
  const left=isRTL()?edge-120:edge;
  hint.hidden=false;
  hint.className="win-hint tab";
  hint.style.left=left+"px";
  hint.style.top=(strip.bottom-30)+"px";
  hint.style.width="120px";
  hint.style.height="30px";
}
function syncFloats(){
  const host=$("#floats");
  if(!host)return;
  if(isTouchLayout()){
    /* A phone has no room for windows; anything detached comes back as a tab. */
    let changed=false;
    state.tabs.forEach(t=>{if(t.float){delete t.float;changed=true;}});
    floatEls.forEach(node=>node.remove());
    floatEls.clear();
    if(changed&&!state.active&&state.tabs.length)state.active=state.tabs[0].id;
    return changed;
  }
  [...floatEls.keys()].forEach(id=>{
    if(!state.tabs.some(t=>t.id===id&&t.float)){
      floatEls.get(id).remove();
      floatEls.delete(id);
    }
  });
  floatTabs().forEach(tab=>{
    let node=floatEls.get(tab.id);
    if(!node){
      node=buildFloat(tab);
      host.appendChild(node);
      floatEls.set(tab.id,node);
      raiseWindow(node);
    }
    $(".fn-text",node).textContent=tabLabel(tab);
    /* Rebuild the body only when what it shows changed, so scrolling survives
       every unrelated render. */
    const sig=floatSignature(tab);
    if(node.dataset.sig!==sig){
      node.dataset.sig=sig;
      const body=$(".float-body",node);
      body.innerHTML="";
      body.appendChild(buildFloatBody(tab));
      $$(".leaf-scroll",body).forEach(wireFadeScroll);
    }
  });
  return false;
}

/* ============================================================================
   5. FILE EXPLORER
   ========================================================================== */
/* Open state lives outside the render so expanding a book survives the next
   state change, and the branch holding the current chapter opens itself. */
const treeOpen={testaments:new Set(["OT","NT"]),books:new Set()};
let treeFollowed=null;

function renderTree(filter=""){
  const host=$("#fileTree");
  if(!host)return;
  host.innerHTML="";
  const q=filter.trim().toLowerCase();
  const current=activeKey();
  const currentBook=current?current.replace(/ \d+$/,""):null;
  if(currentBook&&treeFollowed!==current){treeOpen.books.add(currentBook);}
  const groups=[["OT",L("canon.OT")],["NT",L("canon.NT")]];
  let shown=0;
  groups.forEach(([code,label])=>{
    const books=BIBLE_CANON.filter(b=>b.testament===code&&(!q||bookName(b).toLowerCase().includes(q)||b.name.toLowerCase().includes(q)||b.abbr.toLowerCase().includes(q)));
    if(!books.length)return;
    const holdsCurrent=!!currentBook&&books.some(b=>b.name===currentBook);
    const open=q?true:treeOpen.testaments.has(code);
    const item=el("div","tree-item"+(open?" is-open":"")+(holdsCurrent?" is-current":""));
    item.dataset.testament=code;
    item.innerHTML=`<div class="tree-row" tabindex="0" role="button"><span class="twisty">${icon("chev")}</span>
      <span class="tree-label">${esc(label)}</span><span class="tree-aux">${books.length}</span></div>
      <div class="tree-children"></div>`;
    const kids=$(".tree-children",item);
    $(".tree-row",item).onclick=()=>{
      item.classList.toggle("is-open");
      if(item.classList.contains("is-open"))treeOpen.testaments.add(code);
      else treeOpen.testaments.delete(code);
      saveSession();
    };
    books.forEach(b=>{
      shown++;
      const loaded=[];
      for(let ch=1;ch<=b.chapters;ch++)if(chapterVerses(chapterKey(b.name,ch),"KJV"))loaded.push(ch);
      const isCurrent=b.name===currentBook;
      const bookOpen=(q&&books.length<6)||treeOpen.books.has(b.name);
      const bi=el("div","tree-item is-book"+(bookOpen?" is-open":"")+(isCurrent?" is-current":""));
      bi.dataset.book=b.name;
      bi.innerHTML=`<div class="tree-row" tabindex="0" role="button"><span class="twisty">${icon("chev")}</span>
        <span class="tree-label" title="${esc(bookName(b))}">${esc(bookName(b))}</span>
        <span class="tree-aux">${loaded.length?loaded.length+"/":""}${b.chapters}</span></div>
        <div class="tree-children grid"></div>`;
      $(".tree-row",bi).onclick=()=>{
        bi.classList.toggle("is-open");
        if(bi.classList.contains("is-open"))treeOpen.books.add(b.name);
        else treeOpen.books.delete(b.name);
        saveSession();
      };
      const grid=$(".tree-children",bi);
      grid.addEventListener("click",e=>{
        const chip=e.target.closest(".ch-chip");
        if(chip)openChapter(chapterKey(b.name,+chip.dataset.ch));
      });
      for(let ch=1;ch<=b.chapters;ch++){
        const key=chapterKey(b.name,ch);
        const chip=el("button","ch-chip"+(chapterVerses(key,"KJV")?" has-text":"")+(key===current?" is-active":""),String(ch));
        chip.dataset.ch=ch;chip.title=placeOf(key);
        /* One tab stop per book grid; arrow keys move within it. */
        chip.tabIndex=(key===current||(!isCurrent&&ch===1))?0:-1;
        grid.appendChild(chip);
      }
      kids.appendChild(bi);
    });
    host.appendChild(item);
  });
  if(!shown)host.innerHTML=`<p class="empty-hint">${esc(L("empty.match"))}</p>`;
  const total=BIBLE_CANON.reduce((n,b)=>n+b.chapters,0);
  $("#filesTitle").textContent=q?L("lbl.books",{n:shown}):`${L("lbl.books",{n:BIBLE_CANON.length})} · ${L("lbl.chapters",{n:total})}`;
  /* Follow the reader once per chapter change, never fighting their scrolling. */
  if(current&&treeFollowed!==current){
    treeFollowed=current;
    const chip=$(".ch-chip.is-active",host);
    if(chip&&chip.scrollIntoView){
      try{chip.scrollIntoView({block:"nearest"});}catch(e){}
    }
  }
}


/* ============================================================================
   5b. SIDEBAR ROWS
   Each sidebar holds a list of groups; a group owns some tabs and shows one of
   them. Pane views are never rebuilt, only re-parented, so a half-typed search
   or an unsaved note survives every layout change.
   ========================================================================== */
const MAX_ROWS=3;
const MIN_ROW=110;
/* Sidebar panes are modules. Each names its side and icon; its label is
   "pane.<id>". A pane may bring mount (wired once at boot) and refresh
   (repainted when the open chapter changes). A pane with on:false is taken
   out before the sidebars are built: no tab, no section, no handlers, no
   render cost, no command, nothing in the saved layout. Add ?with=<id> to the
   URL to switch an unfinished pane on while working on it. */
const PANES=[
  {id:"files",  side:"left", icon:"files",   on:true},
  {id:"search", side:"left", icon:"search",  on:true},
  {id:"marks",  side:"left", icon:"bookmark",on:true, mount:()=>renderBookmarks()},
  {id:"tags",   side:"left", icon:"tag",     on:true, mount:()=>renderTagCloud()},
  {id:"plan",   side:"left", icon:"calendar",on:true, mount:()=>mountPlan(), refresh:()=>renderPlan()},
  {id:"outline",side:"right",icon:"info",    on:true, refresh:()=>renderOutline()},
  {id:"links",  side:"right",icon:"link",    on:true, refresh:()=>renderBacklinks()},
  {id:"notes",  side:"right",icon:"edit",    on:true, refresh:()=>renderNotesPane()},
  {id:"ai",     side:"right",icon:"spark",   on:false,mount:()=>mountAssistant()}
];
const livePanes=()=>PANES.filter(p=>p.live);
const paneOn=id=>PANES.some(p=>p.id===id&&p.live);
const sideIsEmpty=side=>!PANES.some(p=>p.live&&p.side===side);
function mountPanes(){
  let wanted=[];
  try{wanted=(new URLSearchParams(location.search).get("with")||"").split(",").filter(Boolean);}catch(e){}
  PANES.forEach(p=>{
    const view=$(`.pane-view[data-view="${p.id}"]`);
    p.live=!!view&&(p.on||wanted.includes(p.id));
    if(!p.live&&view)view.remove();
  });
  livePanes().forEach(p=>{
    if(!p.mount)return;
    try{p.mount();}
    catch(err){console.error(`[app] pane "${p.id}" failed to mount`,err);}
  });
}
/* The panes that follow the open chapter. One failing pane logs and leaves the
   others drawn. */
function refreshSidePanes(){
  livePanes().forEach(p=>{
    if(!p.refresh)return;
    try{p.refresh();}
    catch(err){console.error(`[app] pane "${p.id}" failed to render`,err);}
  });
}
const PANE_META={};
const PANE_SIDE={};
const PANE_HOLDER={};
const sideGroups={left:[],right:[]};
const sideHost=side=>side==="left"?$("#sideL"):$("#sideR");

/* Watches one scroll pane and reports which edges have content beyond them. */
function wireFadeScroll(node){
  if(!node||node.__fadeWired)return;
  node.__fadeWired=true;
  node.classList.add("fade-scroll");
  let queued=false;
  const update=()=>{
    queued=false;
    const max=node.scrollHeight-node.clientHeight;
    const live=max>2;
    node.style.setProperty("--fade-top",live&&node.scrollTop>2?"20px":"0px");
    node.style.setProperty("--fade-bottom",live&&node.scrollTop<max-2?"26px":"0px");
  };
  const schedule=()=>{
    if(queued)return;
    queued=true;
    requestAnimationFrame(update);
  };
  node.__fadeRefresh=schedule;
  node.addEventListener("scroll",schedule,{passive:true});
  window.addEventListener("resize",schedule);
  /* A pane is display:none until its tab is chosen, so it measures zero at wire
     time and nothing inside it changes when it appears. */
  try{new ResizeObserver(schedule).observe(node);}catch(e){}
  /* Panes repaint their contents without scrolling, so watch the subtree too. */
  try{new MutationObserver(schedule).observe(node,{childList:true,subtree:true,characterData:true});}
  catch(e){}
  schedule();
}

function initSidebars(){
  ["left","right"].forEach(side=>{
    const host=sideHost(side);
    const views=PANES.filter(p=>p.live&&p.side===side)
      .map(p=>$(`.pane-view[data-view="${p.id}"]`,host)).filter(Boolean);
    views.forEach(v=>$$(".pane-body",v).forEach(wireFadeScroll));
    PANES.filter(p=>p.live&&p.side===side).forEach(p=>{
      PANE_META[p.id]={icon:p.icon,label:L("pane."+p.id)};
      PANE_SIDE[p.id]=side;
    });
    $$(".pane-tabs",host).forEach(n=>n.remove());
    /* A side with nothing to show is closed, and so is its toggle. */
    if(!views.length){
      host.hidden=true;host.dataset.empty="true";
      document.body.dataset[side]="shut";
      [side==="left"?"#tglLeft":"#tglRight",`#mobileBar [data-mb="${side}"]`].forEach(q=>{const b=$(q);if(b)b.hidden=true;});
      return;
    }
    const body=el("div","side-body");
    host.insertBefore(body,$(".resizer",host));
    const holder=el("div","pane-holder");
    views.forEach(v=>holder.appendChild(v));
    host.appendChild(holder);
    PANE_HOLDER[side]=holder;
    const hint=el("div","drop-hint");hint.hidden=true;host.appendChild(hint);
    const caret=el("div","drop-caret");caret.hidden=true;host.appendChild(caret);
    sideGroups[side]=[{views:views.map(v=>v.dataset.view),active:views[0].dataset.view,size:1}];
    renderSidebar(side);
  });
}

function renderSidebar(side){
  const host=sideHost(side);
  const body=$(".side-body",host);
  const holder=PANE_HOLDER[side];
  if(!body||!holder)return;
  $$(".pane-view",body).forEach(v=>holder.appendChild(v));   // park, never rebuild
  body.innerHTML="";
  sideGroups[side].forEach((g,i)=>{
    if(i)body.appendChild(buildRowDivider(side,i));
    const grp=el("div","side-group");
    grp.dataset.side=side;grp.dataset.group=String(i);
    grp.style.flexGrow=String(g.size||1);
    grp.style.flexBasis="0%";
    const strip=el("div","pane-tabs"+(i===0?" band-drag":""));
    strip.setAttribute("role","tablist");
    g.views.forEach(v=>{
      const meta=PANE_META[v]||{icon:"info",label:v};
      const btn=el("button","pane-tab"+(v===g.active?" is-active":""),`<svg><use href="#i-${meta.icon}"/></svg>`);
      btn.dataset.view=v;setLabel(btn,meta.label,keyFor("pane."+v));
      btn.setAttribute("role","tab");
      btn.setAttribute("aria-selected",String(v===g.active));
      wirePaneTab(btn,side,i,v);
      strip.appendChild(btn);
    });
    grp.appendChild(strip);
    g.views.forEach(v=>{
      const node=$(`.pane-view[data-view="${v}"]`,holder);
      if(!node)return;
      node.classList.toggle("is-active",v===g.active);
      grp.appendChild(node);
    });
    body.appendChild(grp);
  });
  $$(".pane-body",body).forEach(n=>{if(n.__fadeRefresh)n.__fadeRefresh();});
  saveSession();
}

function wirePaneTab(btn,side,groupIndex,view){
  btn.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    const startX=e.clientX,startY=e.clientY;
    let moved=false,ghost=null,target=null;
    const move=ev=>{
      if(!moved){
        if(Math.abs(ev.clientX-startX)<4&&Math.abs(ev.clientY-startY)<4)return;
        moved=true;
        btn.classList.add("is-ghost");
        document.body.classList.add("is-dragging-tab");
        ghost=makeDragGhost(view);
        try{btn.setPointerCapture(ev.pointerId);}catch(err){}
      }
      ghost.style.left=ev.clientX+"px";
      ghost.style.top=ev.clientY+"px";
      target=dropTarget(side,ev.clientX,ev.clientY);
      paintDrop(side,target,view);
    };
    const up=()=>{
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      if(ghost)ghost.remove();
      document.body.classList.remove("is-dragging-tab");
      btn.classList.remove("is-ghost");
      clearDropPaint(side);
      if(!moved){
        sideGroups[side][groupIndex].active=view;
        renderSidebar(side);
        return;
      }
      if(target)applyDrop(side,view,target);
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  });
}

/* Every pixel of the sidebar resolves to a drop: a strip means "join this row
   at this index", a body half means "make a new row on that side". Strips get a
   magnetic margin so the pointer does not have to be exact. */
function dropTarget(side,x,y){
  const host=sideHost(side);
  const r=host.getBoundingClientRect();
  if(x<r.left-60||x>r.right+60||y<r.top-24||y>r.bottom+24)return null;
  const groups=$$(".side-group",host);
  if(!groups.length)return null;
  for(let i=0;i<groups.length;i++){
    const strip=$(".pane-tabs",groups[i]);
    const sr=strip.getBoundingClientRect();
    if(y>=sr.top-8&&y<=sr.bottom+8){
      const tabs=$$(".pane-tab",strip);
      let index=tabs.length;
      for(let k=0;k<tabs.length;k++){
        if(beforeMid(x,tabs[k].getBoundingClientRect())){index=k;break;}
      }
      return {type:"strip",group:i,index};
    }
  }
  for(let i=0;i<groups.length;i++){
    const gr=groups[i].getBoundingClientRect();
    if(y<gr.top||y>gr.bottom)continue;
    const sr=$(".pane-tabs",groups[i]).getBoundingClientRect();
    const top=sr.bottom,h=Math.max(1,gr.bottom-top);
    return {type:(y-top)/h<0.5?"above":"below",group:i};
  }
  return {type:"below",group:groups.length-1};
}
function clearDropPaint(side){
  const host=sideHost(side);
  const hint=$(".drop-hint",host),caret=$(".drop-caret",host);
  if(hint)hint.hidden=true;
  if(caret)caret.hidden=true;
  $$(".pane-tab",host).forEach(t=>{t.style.transform="";});
}
function paintDrop(side,target,dragView){
  const host=sideHost(side);
  clearDropPaint(side);
  if(!target)return;
  const grp=$$(".side-group",host)[target.group];
  if(!grp)return;
  const hr=host.getBoundingClientRect();
  const hint=$(".drop-hint",host),caret=$(".drop-caret",host);
  if(target.type==="strip"){
    const strip=$(".pane-tabs",grp);
    const tabs=$$(".pane-tab",strip);
    const sr=strip.getBoundingClientRect();
    let x;
    const out=isRTL()?-2:2;
    if(!tabs.length)x=startEdge(sr)+(isRTL()?-14:14);
    else if(target.index>=tabs.length)x=endEdge(tabs[tabs.length-1].getBoundingClientRect())+out;
    else x=startEdge(tabs[target.index].getBoundingClientRect())-out;
    caret.hidden=false;
    caret.style.left=(x-hr.left)+"px";
    caret.style.top=(sr.bottom-hr.top-24)+"px";
    caret.style.height="22px";
    tabs.forEach((t,k)=>{                       // neighbours open the gap
      if(t.dataset.view===dragView)return;
      t.style.transform=`translateX(${k>=target.index?5:-5}px)`;
    });
    return;
  }
  const gr=grp.getBoundingClientRect();
  const sr=$(".pane-tabs",grp).getBoundingClientRect();
  const mid=(sr.bottom+gr.bottom)/2;
  const top=target.type==="above"?sr.bottom:mid;
  const bottom=target.type==="above"?mid:gr.bottom;
  hint.hidden=false;
  hint.className="drop-hint "+target.type;
  hint.style.left=(gr.left-hr.left+4)+"px";
  hint.style.width=Math.max(0,gr.width-8)+"px";
  hint.style.top=(top-hr.top)+"px";
  hint.style.height=Math.max(8,bottom-top)+"px";
}
function applyDrop(side,view,target){
  const gs=sideGroups[side];
  const from=gs.findIndex(g=>g.views.includes(view));
  if(from<0)return;
  const rowsBefore=gs.length;
  if(target.type==="strip"){
    const dest=gs[target.group];
    if(!dest)return;
    const at=dest.views.indexOf(view);
    let index=target.index;
    gs[from].views=gs[from].views.filter(v=>v!==view);
    if(dest===gs[from]&&at>-1&&at<index)index--;   // the removal shifts the gap
    index=Math.max(0,Math.min(index,dest.views.length));
    dest.views.splice(index,0,view);
    dest.active=view;
  }else{
    const alone=gs[from].views.length===1;
    if(!alone&&gs.length>=MAX_ROWS){
      toast(L("msg.limitRows",{n:MAX_ROWS}));
      return;
    }
    gs[from].views=gs[from].views.filter(v=>v!==view);
    gs.splice(target.type==="below"?target.group+1:target.group,0,
      {views:[view],active:view,size:1});
  }
  for(let i=gs.length-1;i>=0;i--){
    if(!gs[i].views.length){gs.splice(i,1);continue;}
    if(!gs[i].views.includes(gs[i].active))gs[i].active=gs[i].views[0];
  }
  if(!gs.length)gs.push({views:[view],active:view,size:1});
  /* Heights the reader set are only discarded when the row count changes. */
  if(gs.length!==rowsBefore)gs.forEach(g=>g.size=1);
  renderSidebar(side);
}
/* Kept for the command palette and tests: move a view without a pointer. */
function moveSideView(side,view,target){applyDrop(side,view,target);}

function buildRowDivider(side,i){
  const d=el("div","row-divider");
  d.title=L("hint.resize");
  d.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const groups=$$(".side-group",sideHost(side));
    const above=groups[i-1],below=groups[i];
    if(!above||!below)return;
    d.classList.add("dragging");
    try{d.setPointerCapture(e.pointerId);}catch(err){}
    /* Freeze every row at its current height first so the untouched ones keep it. */
    sideGroups[side].forEach((g,k)=>{g.size=groups[k]?groups[k].offsetHeight||1:1;});
    const startY=e.clientY,ah=sideGroups[side][i-1].size,bh=sideGroups[side][i].size;
    const move=ev=>{
      let delta=ev.clientY-startY;
      delta=Math.max(MIN_ROW-ah,Math.min(bh-MIN_ROW,delta));
      sideGroups[side][i-1].size=ah+delta;
      sideGroups[side][i].size=bh-delta;
      above.style.flexGrow=String(ah+delta);
      below.style.flexGrow=String(bh-delta);
    };
    const up=()=>{
      d.classList.remove("dragging");
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
      saveSession();
    };
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  });
  return d;
}
function resetSidebarRows(side){
  const gs=sideGroups[side];
  const all=gs.flatMap(g=>g.views);
  sideGroups[side]=[{views:all,active:gs[0]?gs[0].active:all[0],size:1}];
  renderSidebar(side);
}

function buildIndex(){
  const rows=[];
  for(const key of Object.keys(bibleDataStore[state.translation]||{})){
    const vs=bibleDataStore[state.translation][key];
    for(const n of Object.keys(vs))rows.push({key,verse:+n,text:vs[n].replace(/\[[HG]\d+\]/g,"")});
  }
  return rows;
}
let searchIndex=[];
function runSearch(q){
  const host=$("#searchResults");
  if(!host)return;
  q=q.trim();
  if(!q){
    host.innerHTML=`<p class="empty-hint">${esc(L("empty.search"))}</p>`;
    $("#searchTitle").textContent=L("pane.search");return;
  }
  if(q.startsWith("#")){renderTagResults(q);return;}
  const phrase=/^".*"$/.test(q);
  const needle=phrase?q.slice(1,-1).toLowerCase():q.toLowerCase();
  const terms=phrase?[needle]:needle.split(/\s+/).filter(Boolean);
  const groups=new Map();
  let total=0;
  for(const row of searchIndex){
    const lower=row.text.toLowerCase();
    if(!terms.every(t=>lower.includes(t)))continue;
    total++;
    if(!groups.has(row.key))groups.set(row.key,[]);
    if(groups.get(row.key).length<40)groups.get(row.key).push(row);
  }
  $("#searchTitle").textContent=`${L("lbl.verses",{n:total})} · ${L("lbl.chapters",{n:groups.size})}`;
  if(!total){
    host.innerHTML=`<p class="empty-hint">${esc(L("empty.searchNone",{tr:state.translation,q}))}</p>`;
    return;
  }
  host.innerHTML="";
  for(const [key,rows] of groups){
    const g=el("div","result-group");
    g.innerHTML=`<div class="result-head">${icon("book")}<span>${esc(displayKey(key))}</span><span class="rh-count">${rows.length}</span></div>`;
    rows.forEach(r=>{
      const line=el("div","result-line");
      let html=esc(r.text);
      terms.forEach(t=>{
        html=html.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi"),"<mark>$1</mark>");
      });
      line.innerHTML=`<b style="color:var(--accent-2)">${r.verse}</b> ${html}`;
      line.onclick=()=>openChapter(key,{verse:r.verse});
      g.appendChild(line);
    });
    $(".result-head",g).onclick=()=>openChapter(key);
    host.appendChild(g);
  }
}
function renderTagResults(tag){
  const host=$("#searchResults");
  const hits=Object.keys(CHAPTER_META).filter(k=>(CHAPTER_META[k].tags||[]).some(t=>t===tag||t.startsWith(tag+"/")));
  $("#searchTitle").textContent=`${tag} · ${L("lbl.chapters",{n:hits.length})}`;
  host.innerHTML=hits.length?"":`<p class="empty-hint">${esc(L("empty.tag",{tag}))}</p>`;
  hits.forEach(k=>{
    const g=el("div","result-group");
    g.innerHTML=`<div class="result-head">${icon("tag")}<span>${esc(displayKey(k))}</span></div>
      <div class="result-line">${esc((CHAPTER_META[k].body||"").slice(0,150))}</div>`;
    g.onclick=()=>openChapter(k);
    host.appendChild(g);
  });
}

function renderBacklinks(){
  const host=$("#linksPane");
  if(!host)return;
  const key=activeKey();
  if(!key){host.innerHTML=`<p class="empty-hint">${esc(L("empty.noChapter"))}</p>`;return;}
  const linksTo=new RegExp(`\\[\\[${key.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(\\.md)?(\\|[^\\]]*)?\\]\\]`);
  const bookName=key.replace(/ \d+$/,"");
  const linked=[],unlinked=[];
  Object.keys(CHAPTER_META).forEach(k=>{
    if(k===key)return;
    const m=CHAPTER_META[k];
    const inRefs=(m.refs||[]).includes(key);
    const inBody=linksTo.test(m.body||"");
    if(inRefs||inBody)linked.push({key:k,why:inBody?m.body:L("lbl.viaRefs")});
    else if((m.body||"").includes(bookName))unlinked.push({key:k,why:m.body});
  });
  appStore.notes.forEach(n=>{

      linked.push({key:n.chapter||noteTitle(n),label:n.chapter?displayKey(n.chapter):noteTitle(n),noteId:n.chapter?null:n.id,why:n.body,mine:true});
  });

      g.appendChild(line);
    });
    return g;

  host.innerHTML="";

function selectSidebar(view){
