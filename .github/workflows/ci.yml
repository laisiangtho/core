# Every push and pull request: the checks that need nothing but Node.
name: check

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests and the boundary rules: no browser, a second or two.
      - run: npm test
      # The end-to-end suite drives the real build in a browser. The driver is
      # optional for a working copy; here it is installed so the suite runs
      # rather than skips.
      - run: npm i --no-save playwright-core
      - run: npx playwright-core install --with-deps chromium || npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The packaged desktop app, started on a virtual display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run desktop:build && xvfb-run -a node test/e2e/desktop.mjs
